<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gestión Taller</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #f2f2f2;

      color: #222;

    }


    .contenedor {

      max-width: 800px;

      margin: 0 auto;

      padding: 20px;

    }


    h1 {

      text-align: center;

      margin-bottom: 25px;

    }


    .tarjeta {

      background: white;

      padding: 20px;

      margin-bottom: 20px;

      border-radius: 12px;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.08);

    }


    .tarjeta h2 {

      margin-top: 0;

    }


    input,
    select,
    textarea,
    button {

      width: 100%;

      padding: 12px;

      margin-top: 8px;

      margin-bottom: 12px;

      border-radius: 8px;

      border: 1px solid #ccc;

      font-size: 16px;

    }


    textarea {

      min-height: 90px;

      resize: vertical;

    }


    button {

      background: #222;

      color: white;

      border: none;

      cursor: pointer;

      font-weight: bold;

    }


    button:hover {

      opacity: 0.9;

    }


    /* =========================
       MENÚ PRINCIPAL
    ========================= */

    .menu-principal {

      display: flex;

      flex-direction: column;

      gap: 12px;

    }


    .boton-menu {

      padding: 18px;

      font-size: 18px;

      margin: 0;

      border-radius: 10px;

    }


    .boton-volver {

      background: #666;

      margin-top: 5px;

    }


    /* =========================
       SECCIONES
    ========================= */

    .seccion {

      display: none;

    }


    .seccion.activa {

      display: block;

    }


    /* =========================
       INFORMACIÓN VEHÍCULO
    ========================= */

    .datos-vehiculo {

      background: #f7f7f7;

      padding: 15px;

      border-radius: 10px;

      margin-top: 15px;

    }


    .dato {

      margin-bottom: 10px;

      line-height: 1.4;

    }


    /* =========================
       HISTORIAL
    ========================= */

    .historial {

      margin-top: 20px;

    }


    .pestanas-historial {

      display: flex;

      gap: 8px;

      overflow-x: auto;

      padding: 5px 2px 12px 2px;

      margin-bottom: 5px;

    }


    .pestana {

      width: auto;

      min-width: 130px;

      margin: 0;

      padding: 12px 15px;

      white-space: nowrap;

      background: #e9e9e9;

      color: #222;

      border: 1px solid #ccc;

      border-radius: 8px;

      flex-shrink: 0;

    }


    .pestana:hover {

      background: #ddd;

    }


    .pestana.activa {

      background: #222;

      color: white;

      border-color: #222;

    }


    /* =========================
       DETALLE INTERVENCIÓN
    ========================= */

    .detalle-intervencion {

      background: #f7f7f7;

      border-radius: 10px;

      padding: 18px;

      margin-top: 10px;

      border: 1px solid #ddd;

    }


    .detalle-intervencion h3 {

      margin-top: 0;

    }


    /* =========================
       FOTOS GUARDADAS
    ========================= */

    .fotos {

      margin-top: 20px;

    }


    .galeria-fotos {

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 10px;

      margin-top: 10px;

    }


    .foto-historial {

      width: 100%;

      height: 180px;

      object-fit: cover;

      border-radius: 10px;

      border: 1px solid #ccc;

      cursor: pointer;

      background: #eee;

    }


    .sin-fotos {

      color: #666;

      font-style: italic;

      padding: 10px 0;

    }


    /* =========================
       VISTA PREVIA DE FOTOS
    ========================= */

    .vista-previa-fotos {

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 10px;

      margin-top: 15px;

      margin-bottom: 15px;

    }


    .previsualizacion-foto {

      position: relative;

      border-radius: 10px;

      overflow: hidden;

      border: 1px solid #ccc;

      background: #eee;

    }


    .previsualizacion-foto img {

      width: 100%;

      height: 160px;

      object-fit: cover;

      display: block;

    }


    .boton-eliminar-foto {

      position: absolute;

      top: 8px;

      right: 8px;

      width: 40px;

      height: 40px;

      padding: 0;

      margin: 0;

      border-radius: 50%;

      background: #d00000;

      color: white;

      border: none;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

    }


    .boton-eliminar-foto:hover {

      background: #a00000;

    }


    /* =========================
       MENSAJES
    ========================= */

    .mensaje {

      padding: 12px;

      border-radius: 8px;

      background: #f1f1f1;

      margin-top: 10px;

    }


    /* =========================
       MÓVIL
    ========================= */

    @media (max-width: 600px) {

      .contenedor {

        padding: 12px;

      }


      .galeria-fotos {

        grid-template-columns: 1fr;

      }


      .foto-historial {

        height: 230px;

      }


      .vista-previa-fotos {

        grid-template-columns: 1fr;

      }


      .previsualizacion-foto img {

        height: 230px;

      }

    }

  </style>

</head>


<body>


<div class="contenedor">


  <!-- =====================================
       MENÚ PRINCIPAL
  ====================================== -->

  <div
    id="menuPrincipal"
    class="seccion activa"
  >

    <h1>🔧 Gestión Taller</h1>


    <div class="tarjeta">

      <h2>¿Qué desea hacer?</h2>


      <div class="menu-principal">


        <button
          class="boton-menu"
          onclick="mostrarSeccion('buscar')"
        >
          🔎 Buscar vehículo
        </button>


        <button
          class="boton-menu"
          onclick="mostrarSeccion('nuevoVehiculo')"
        >
          🚗 Nuevo vehículo
        </button>


        <button
          class="boton-menu"
          onclick="mostrarSeccion('nuevaIntervencion')"
        >
          🛠️ Nueva intervención
        </button>


      </div>

    </div>

  </div>


  <!-- =====================================
       BUSCAR VEHÍCULO
  ====================================== -->

  <div
    id="buscar"
    class="seccion"
  >

    <h1>🔎 Buscar vehículo</h1>


    <div class="tarjeta">


      <input
        type="text"
        id="patenteBuscar"
        placeholder="Ingrese la patente"
      >


      <button
        onclick="buscarVehiculo()"
      >
        Buscar vehículo
      </button>


      <button
        class="boton-volver"
        onclick="volverInicio()"
      >
        ⬅️ Volver al inicio
      </button>


    </div>


    <div class="tarjeta">

      <h2>📋 Información del vehículo</h2>


      <div id="resultado">

        <div class="mensaje">

          Ingrese una patente para buscar
          un vehículo.

        </div>

      </div>

    </div>

  </div>


  <!-- =====================================
       NUEVO VEHÍCULO
  ====================================== -->

  <div
    id="nuevoVehiculo"
    class="seccion"
  >

    <h1>🚗 Nuevo vehículo</h1>


    <div class="tarjeta">


      <input
        type="text"
        id="patente"
        placeholder="Patente"
      >


      <input
        type="text"
        id="marca"
        placeholder="Marca"
      >


      <input
        type="text"
        id="modelo"
        placeholder="Modelo"
      >


      <input
        type="number"
        id="anio"
        placeholder="Año"
      >


      <input
        type="number"
        id="kilometraje"
        placeholder="Kilometraje"
      >


      <input
        type="text"
        id="cliente"
        placeholder="Nombre del cliente"
      >


      <input
        type="text"
        id="telefono"
        placeholder="Teléfono"
      >


      <button
        onclick="agregarVehiculo()"
      >
        💾 Guardar vehículo
      </button>


      <button
        class="boton-volver"
        onclick="volverInicio()"
      >
        ⬅️ Volver al inicio
      </button>


    </div>

  </div>


  <!-- =====================================
       NUEVA INTERVENCIÓN
  ====================================== -->

  <div
    id="nuevaIntervencion"
    class="seccion"
  >

    <h1>🛠️ Nueva intervención</h1>


    <div class="tarjeta">


      <input
        type="text"
        id="patenteIntervencion"
        placeholder="Patente del vehículo"
      >


      <input
        type="date"
        id="fecha"
      >


      <select id="tipo">

        <option value="">
          Seleccione tipo de trabajo
        </option>

        <option value="Service">
          Service
        </option>

        <option value="Cambio de aceite">
          Cambio de aceite
        </option>

        <option value="Frenos">
          Frenos
        </option>

        <option value="Motor">
          Motor
        </option>

        <option value="Suspensión">
          Suspensión
        </option>

        <option value="Electricidad">
          Electricidad
        </option>

        <option value="Diagnóstico">
          Diagnóstico
        </option>

        <option value="Otro">
          Otro
        </option>

      </select>


      <input
        type="number"
        id="kmIntervencion"
        placeholder="Kilometraje"
      >


      <textarea
        id="motivo"
        placeholder="Motivo del ingreso"
      ></textarea>


      <textarea
        id="trabajo"
        placeholder="Trabajo realizado"
      ></textarea>


      <textarea
        id="repuestos"
        placeholder="Repuestos utilizados"
      ></textarea>


      <textarea
        id="observaciones"
        placeholder="Observaciones"
      ></textarea>


      <!-- =================================
           FOTOS
      ================================== -->


      <label>

        <strong>
          📷 Fotos de la intervención
        </strong>

      </label>


      <input
        type="file"
        id="fotos"
        accept="image/*"
        multiple
        onchange="seleccionarFotos()"
      >


      <small>

        Podés seleccionar una o varias fotos.
        Antes de guardar podés revisar y
        eliminar las que no quieras.

      </small>


      <!-- VISTA PREVIA -->

      <div
        id="vistaPreviaFotos"
        class="vista-previa-fotos"
      ></div>


      <button
        onclick="agregarIntervencion()"
      >
        💾 Guardar intervención
      </button>


      <button
        class="boton-volver"
        onclick="volverInicio()"
      >
        ⬅️ Volver al inicio
      </button>


    </div>

  </div>


</div>


<script>


/* ==========================================
   DATOS
========================================== */


let vehiculos =

  JSON.parse(
    localStorage.getItem("vehiculos")
  ) || [];


let historialActual = [];


/*
  Fotos seleccionadas pero todavía
  NO guardadas.
*/

let fotosSeleccionadas = [];


/* ==========================================
   GUARDAR DATOS
========================================== */


function guardarDatos() {

  localStorage.setItem(
    "vehiculos",
    JSON.stringify(vehiculos)
  );

}


/* ==========================================
   CAMBIAR SECCIÓN
========================================== */


function mostrarSeccion(nombre) {

  const secciones =
    document.querySelectorAll(
      ".seccion"
    );


  secciones.forEach(
    seccion => {

      seccion.classList.remove(
        "activa"
      );

    }
  );


  const seccion =
    document.getElementById(
      nombre
    );


  if (seccion) {

    seccion.classList.add(
      "activa"
    );

  }

}


/* ==========================================
   VOLVER AL INICIO
========================================== */


function volverInicio() {

  const secciones =
    document.querySelectorAll(
      ".seccion"
    );


  secciones.forEach(
    seccion => {

      seccion.classList.remove(
        "activa"
      );

    }
  );


  document
    .getElementById(
      "menuPrincipal"
    )
    .classList.add(
      "activa"
    );

}


/* ==========================================
   ESCAPAR HTML
========================================== */


function escaparHTML(texto) {

  if (
    texto === null ||
    texto === undefined
  ) {

    return "";

  }


  return String(texto)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ==========================================
   FORMATO FECHA
========================================== */


function formatearFecha(fecha) {

  if (!fecha) {

    return "Sin fecha";

  }


  const partes =
    fecha.split("-");


  if (
    partes.length !== 3
  ) {

    return fecha;

  }


  return (

    partes[2] +
    "/" +
    partes[1] +
    "/" +
    partes[0]

  );

}


/* ==========================================
   COMPRIMIR FOTO
========================================== */


function comprimirFoto(archivo) {

  return new Promise(

    (resolve, reject) => {


      const lector =
        new FileReader();


      lector.onload =
        function(evento) {


          const imagen =
            new Image();


          imagen.onload =
            function() {


              const MAXIMO =
                1200;


              let ancho =
                imagen.width;


              let alto =
                imagen.height;


              if (
                ancho > MAXIMO
              ) {

                alto =
                  alto *
                  MAXIMO /
                  ancho;


                ancho =
                  MAXIMO;

              }


              if (
                alto > MAXIMO
              ) {

                ancho =
                  ancho *
                  MAXIMO /
                  alto;


                alto =
                  MAXIMO;

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                ancho;


              canvas.height =
                alto;


              const contexto =
                canvas.getContext(
                  "2d"
                );


              contexto.drawImage(

                imagen,

                0,

                0,

                ancho,

                alto

              );


              const fotoComprimida =
                canvas.toDataURL(

                  "image/jpeg",

                  0.70

                );


              resolve(
                fotoComprimida
              );

            };


          imagen.onerror =
            reject;


          imagen.src =
            evento.target.result;

        };


      lector.onerror =
        reject;


      lector.readAsDataURL(
        archivo
      );

    }

  );

}


/* ==========================================
   SELECCIONAR FOTOS
========================================== */


function seleccionarFotos() {


  const input =
    document.getElementById(
      "fotos"
    );


  const archivos =
    Array.from(
      input.files
    );


  archivos.forEach(
    archivo => {


      /*
        Evita agregar dos veces
        exactamente el mismo archivo.
      */


      const yaExiste =
        fotosSeleccionadas.some(

          foto =>

            foto.name ===
              archivo.name &&

            foto.size ===
              archivo.size &&

            foto.lastModified ===
              archivo.lastModified

        );


      if (!yaExiste) {

        fotosSeleccionadas.push(
          archivo
        );

      }

    }
  );


  mostrarVistaPreviaFotos();


  /*
    Limpiamos el input para que
    se puedan seleccionar más fotos
    posteriormente.
  */


  input.value = "";

}


/* ==========================================
   MOSTRAR VISTA PREVIA DE FOTOS
========================================== */


function mostrarVistaPreviaFotos() {


  const contenedor =
    document.getElementById(
      "vistaPreviaFotos"
    );


  contenedor.innerHTML = "";


  fotosSeleccionadas.forEach(

    (archivo, indice) => {


      const lector =
        new FileReader();


      lector.onload =
        function(evento) {


          const elemento =
            document.createElement(
              "div"
            );


          elemento.className =
            "previsualizacion-foto";


          elemento.innerHTML = `

            <img
              src="${evento.target.result}"
              alt="Vista previa"
            >

            <button
              type="button"
              class="boton-eliminar-foto"
              onclick="eliminarFotoSeleccionada(${indice})"
              title="Eliminar foto"
            >
              🗑️
            </button>

          `;


          contenedor.appendChild(
            elemento
          );

        };


      lector.readAsDataURL(
        archivo
      );

    }

  );

}


/* ==========================================
   ELIMINAR FOTO ANTES DE GUARDAR
========================================== */


function eliminarFotoSeleccionada(
  indice
) {


  if (
    indice < 0 ||
    indice >= fotosSeleccionadas.length
  ) {

    return;

  }


  fotosSeleccionadas.splice(
    indice,
    1
  );


  mostrarVistaPreviaFotos();

}


/* ==========================================
   AGREGAR VEHÍCULO
========================================== */


function agregarVehiculo() {


  const patente =

    document
      .getElementById(
        "patente"
      )
      .value
      .trim()
      .toUpperCase();


  const marca =

    document
      .getElementById(
        "marca"
      )
      .value
      .trim();


  const modelo =

    document
      .getElementById(
        "modelo"
      )
      .value
      .trim();


  const anio =

    document
      .getElementById(
        "anio"
      )
      .value
      .trim();


  const kilometraje =

    document
      .getElementById(
        "kilometraje"
      )
      .value
      .trim();


  const cliente =

    document
      .getElementById(
        "cliente"
      )
      .value
      .trim();


  const telefono =

    document
      .getElementById(
        "telefono"
      )
      .value
      .trim();


  if (!patente) {

    alert(
      "Ingrese la patente."
    );

    return;

  }


  const existe =

    vehiculos.some(

      vehiculo =>

        vehiculo.patente ===
        patente

    );


  if (existe) {

    alert(
      "Ya existe un vehículo con esa patente."
    );

    return;

  }


  const nuevoVehiculo = {

    patente:
      patente,

    marca:
      marca,

    modelo:
      modelo,

    anio:
      anio,

    kilometraje:
      kilometraje,

    cliente:
      cliente,

    telefono:
      telefono,

    historial:
      []

  };


  vehiculos.push(
    nuevoVehiculo
  );


  guardarDatos();


  alert(
    "Vehículo guardado correctamente."
  );


  document.getElementById(
    "patente"
  ).value = "";


  document.getElementById(
    "marca"
  ).value = "";


  document.getElementById(
    "modelo"
  ).value = "";


  document.getElementById(
    "anio"
  ).value = "";


  document.getElementById(
    "kilometraje"
  ).value = "";


  document.getElementById(
    "cliente"
  ).value = "";


  document.getElementById(
    "telefono"
  ).value = "";


  volverInicio();

}


/* ==========================================
   AGREGAR INTERVENCIÓN
========================================== */


async function agregarIntervencion() {


  const patente =

    document
      .getElementById(
        "patenteIntervencion"
      )
      .value
      .trim()
      .toUpperCase();


  const fecha =

    document.getElementById(
      "fecha"
    ).value;


  const tipo =

    document.getElementById(
      "tipo"
    ).value;


  const km =

    document
      .getElementById(
        "kmIntervencion"
      )
      .value
      .trim();


  const motivo =

    document
      .getElementById(
        "motivo"
      )
      .value
      .trim();


  const trabajo =

    document
      .getElementById(
        "trabajo"
      )
      .value
      .trim();


  const repuestos =

    document
      .getElementById(
        "repuestos"
      )
      .value
      .trim();


  const observaciones =

    document
      .getElementById(
        "observaciones"
      )
      .value
      .trim();


  /*
    IMPORTANTE:
    usamos solamente las fotos
    que quedaron después de
    eliminar las equivocadas.
  */


  const archivos =
    fotosSeleccionadas;


  const vehiculo =

    vehiculos.find(

      v =>

        v.patente ===
        patente

    );


  if (!vehiculo) {

    alert(
      "No existe un vehículo con esa patente."
    );

    return;

  }


  if (!fecha) {

    alert(
      "Seleccione una fecha."
    );

    return;

  }


  if (!tipo) {

    alert(
      "Seleccione el tipo de trabajo."
    );

    return;

  }


  /* ========================================
     PROCESAR FOTOS
  ======================================== */


  const fotos = [];


  if (
    archivos.length > 0
  ) {


    for (

      let i = 0;

      i < archivos.length;

      i++

    ) {


      try {


        const foto =
          await comprimirFoto(
            archivos[i]
          );


        fotos.push(
          foto
        );


      } catch (error) {


        alert(
          "No se pudo procesar una de las fotos."
        );


        return;

      }

    }

  }


  /* ========================================
     CREAR INTERVENCIÓN
  ======================================== */


  const intervencion = {


    fecha:
      fecha,


    tipo:
      tipo,


    kilometraje:
      km,


    motivo:
      motivo,


    trabajo:
      trabajo,


    repuestos:
      repuestos,


    observaciones:
      observaciones,


    fotos:
      fotos

  };


  vehiculo.historial.push(
    intervencion
  );


  try {


    guardarDatos();


  } catch (error) {


    alert(

      "No se pudieron guardar los datos. " +
      "Es posible que el navegador se haya " +
      "quedado sin espacio para las fotos."

    );


    vehiculo.historial.pop();


    return;

  }


  alert(
    "Intervención guardada correctamente."
  );


  /* ========================================
     LIMPIAR FORMULARIO
  ======================================== */


  document.getElementById(
    "patenteIntervencion"
  ).value = "";


  document.getElementById(
    "fecha"
  ).value = "";


  document.getElementById(
    "tipo"
  ).value = "";


  document.getElementById(
    "kmIntervencion"
  ).value = "";


  document.getElementById(
    "motivo"
  ).value = "";


  document.getElementById(
    "trabajo"
  ).value = "";


  document.getElementById(
    "repuestos"
  ).value = "";


  document.getElementById(
    "observaciones"
  ).value = "";


  document.getElementById(
    "fotos"
  ).value = "";


  /*
    MUY IMPORTANTE:
    vaciamos las fotos temporales.
  */


  fotosSeleccionadas = [];


  document.getElementById(
    "vistaPreviaFotos"
  ).innerHTML = "";


  volverInicio();

}


/* ==========================================
   MOSTRAR INTERVENCIÓN
========================================== */


function mostrarIntervencion(
  indice
) {


  const intervencion =
    historialActual[indice];


  if (!intervencion) {

    return;

  }


  const botones =
    document.querySelectorAll(
      ".pestana"
    );


  botones.forEach(

    (boton, i) => {


      if (
        i === indice
      ) {


        boton.classList.add(
          "activa"
        );


      } else {


        boton.classList.remove(
          "activa"
        );

      }

    }

  );


  const detalle =
    document.getElementById(
      "detalleHistorial"
    );


  if (!detalle) {

    return;

  }


  let fotosHTML = "";


  if (

    intervencion.fotos &&

    intervencion.fotos.length > 0

  ) {


    fotosHTML = `

      <div class="fotos">

        <h3>
          📷 Fotos
        </h3>

        <div class="galeria-fotos">

    `;


    intervencion.fotos.forEach(

      foto => {


        fotosHTML += `

          <img
            src="${foto}"
            class="foto-historial"
            onclick="abrirFoto('${foto}')"
          >

        `;

      }

    );


    fotosHTML += `

        </div>

      </div>

    `;


  } else {


    fotosHTML = `

      <div class="fotos">

        <h3>
          📷 Fotos
        </h3>

        <div class="sin-fotos">

          No hay fotos cargadas
          en esta intervención.

        </div>

      </div>

    `;

  }


  detalle.innerHTML = `

    <div class="detalle-intervencion">

      <h3>
        🛠️ Detalle de la intervención
      </h3>


      <div class="dato">

        <strong>📅 Fecha:</strong>

        ${escaparHTML(
          formatearFecha(
            intervencion.fecha
          )
        )}

      </div>


      <div class="dato">

        <strong>🔧 Tipo:</strong>

        ${escaparHTML(
          intervencion.tipo
        )}

      </div>


      <div class="dato">

        <strong>📏 Kilometraje:</strong>

        ${escaparHTML(
          intervencion.kilometraje
        )}

        km

      </div>


      <div class="dato">

        <strong>📝 Motivo:</strong>

        ${escaparHTML(
          intervencion.motivo
        )}

      </div>


      <div class="dato">

        <strong>🛠️ Trabajo realizado:</strong>

        ${escaparHTML(
          intervencion.trabajo
        )}

      </div>


      <div class="dato">

        <strong>🧰 Repuestos:</strong>

        ${escaparHTML(
          intervencion.repuestos
        )}

      </div>


      <div class="dato">

        <strong>📌 Observaciones:</strong>

        ${escaparHTML(
          intervencion.observaciones
        )}

      </div>


      ${fotosHTML}


    </div>

  `;

}


/* ==========================================
   ABRIR FOTO GRANDE
========================================== */


function abrirFoto(foto) {


  const ventana =
    window.open();


  if (!ventana) {


    alert(
      "El navegador bloqueó la apertura de la foto."
    );


    return;

  }


  ventana.document.write(`

    <html>

      <head>

        <title>
          Foto - Gestión Taller
        </title>


        <style>

          body {

            margin: 0;

            background: #000;

            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 100vh;

          }


          img {

            max-width: 100%;

            max-height: 100vh;

            object-fit: contain;

          }

        </style>

      </head>


      <body>

        <img src="${foto}">

      </body>

    </html>

  `);

}


/* ==========================================
   BUSCAR VEHÍCULO
========================================== */


function buscarVehiculo() {


  const patente =

    document
      .getElementById(
        "patenteBuscar"
      )
      .value
      .trim()
      .toUpperCase();


  const resultado =
    document.getElementById(
      "resultado"
    );


  const vehiculo =

    vehiculos.find(

      v =>

        v.patente ===
        patente

    );


  if (!vehiculo) {


    historialActual = [];


    resultado.innerHTML = `

      <div class="mensaje">

        ❌ No se encontró ningún vehículo
        con la patente

        <strong>

          ${escaparHTML(
            patente
          )}

        </strong>.

      </div>

    `;


    return;

  }


  /*
    Ordenar historial
    del más reciente al más antiguo
  */


  const historialOrdenado =

    [...vehiculo.historial].sort(

      (a, b) =>

        new Date(b.fecha) -
        new Date(a.fecha)

    );


  historialActual =
    historialOrdenado;


  /* ========================================
     INFORMACIÓN DEL VEHÍCULO
  ======================================== */


  let html = `

    <div class="datos-vehiculo">


      <div class="dato">

        <strong>🚗 Patente:</strong>

        ${escaparHTML(
          vehiculo.patente
        )}

      </div>


      <div class="dato">

        <strong>🏭 Marca:</strong>

        ${escaparHTML(
          vehiculo.marca
        )}

      </div>


      <div class="dato">

        <strong>🚘 Modelo:</strong>

        ${escaparHTML(
          vehiculo.modelo
        )}

      </div>


      <div class="dato">

        <strong>📅 Año:</strong>

        ${escaparHTML(
          vehiculo.anio
        )}

      </div>


      <div class="dato">

        <strong>📏 Kilometraje:</strong>

        ${escaparHTML(
          vehiculo.kilometraje
        )}

        km

      </div>


      <div class="dato">

        <strong>👤 Cliente:</strong>

        ${escaparHTML(
          vehiculo.cliente
        )}

      </div>


      <div class="dato">

        <strong>📞 Teléfono:</strong>

        ${escaparHTML(
          vehiculo.telefono
        )}

      </div>


    </div>

  `;


  /* ========================================
     HISTORIAL
  ======================================== */


  if (
    historialOrdenado.length === 0
  ) {


    html += `

      <div class="historial">

        <h3>
          📋 Historial
        </h3>


        <div class="mensaje">

          Este vehículo todavía no tiene
          intervenciones registradas.

        </div>

      </div>

    `;


  } else {


    html += `

      <div class="historial">

        <h3>
          📋 Historial
        </h3>


        <div class="pestanas-historial">

    `;


    historialOrdenado.forEach(

      (intervencion, indice) => {


        html += `

          <button
            type="button"
            class="pestana"
            onclick="mostrarIntervencion(${indice})"
          >

            📅

            ${escaparHTML(
              formatearFecha(
                intervencion.fecha
              )
            )}

          </button>

        `;

      }

    );


    html += `

        </div>


        <!--
          El detalle empieza vacío
          hasta tocar una fecha.
        -->


        <div
          id="detalleHistorial"
        ></div>


      </div>

    `;

  }


  resultado.innerHTML =
    html;


  /*
    NO abrimos ninguna intervención
    automáticamente.
  */

}


</script>


</body>

</html>
