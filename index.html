<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taller v110 CELU</title>
<style>body{margin:0;padding:15px;font-family:Arial;background:#f2f2f2}.tarjeta{background:#fff;padding:20px;border-radius:12px;max-width:800px;margin:auto}button{width:100%;padding:16px;margin-top:10px;border:none;border-radius:8px;background:#222;color:#fff;font-size:18px}input,select,textarea{width:100%;padding:12px;margin:6px 0 15px;border:1px solid #ccc;border-radius:7px;font-size:16px}.oculto{display:none!important}.boton-recuperar{background:#0066cc}.boton-secundario{background:#777}.boton-cerrar{background:#a00000}</style></head><body>
<div id="pantallaLogin" class="tarjeta"><h1>🔧 Taller v110</h1><h2>Entrar</h2><label>Email</label><input id="loginEmail" value="maxi_boca46@hotmail.com"><label>Contraseña</label><input type="password" id="loginPassword"><button id="btnLogin" type="button">🔐 Ingresar</button><div id="mensajeLogin" style="margin-top:15px;font-weight:bold;color:red;white-space:pre-wrap"></div></div>
<div id="sistema" class="tarjeta oculto"><h1>🔧 Taller</h1><button id="btnMenuBuscar">🔎 Buscar</button><button id="btnMenuNuevoVeh">🚗 Nuevo veh</button><button id="btnMenuNuevaInterv">🛠️ Nueva interv</button><button id="btnRecuperar" class="boton-recuperar">♻️ Recuperar viejos</button><button id="btnCerrarSesion" class="boton-cerrar">Cerrar</button><div id="estadoRecupero" style="font-weight:bold;margin-top:10px"></div>
<div id="buscar" class="oculto"><hr><h2>Buscar</h2><input id="patenteBuscar" placeholder="Patente"><button id="btnBuscarAhora">Buscar</button><div id="resultadoBusqueda"></div></div>
<div id="nuevoVehiculo" class="oculto"><hr><h2>Nuevo veh</h2><input id="patente" placeholder="Patente"><input id="marca" placeholder="Marca"><input id="modelo" placeholder="Modelo"><input id="cliente" placeholder="Cliente"><button id="btnGuardarVeh">Guardar</button></div>
<div id="nuevaIntervencion" class="oculto"><hr><h2>Nueva interv</h2><input id="patenteIntervencion" placeholder="Patente"><input type="date" id="fecha"><textarea id="motivo" placeholder="Motivo"></textarea><button id="btnGuardarInterv">Guardar</button></div>
</div>
<script>
const URL_SUPA="https://sljknzpyxmpfnkcaoksu.supabase.co"; const KEY="sb_publishable_3oidhuHVin61bwlZBTW41w_fuF_rqPI";
let TOKEN=localStorage.getItem("token"); let UID=localStorage.getItem("uid");
function $(id){return document.getElementById(id);}
function headers(){return {"apikey":KEY,"Authorization":"Bearer "+TOKEN,"Content-Type":"application/json"};}
if(TOKEN&&UID){$("pantallaLogin").classList.add("oculto");$("sistema").classList.remove("oculto");}
$("btnLogin").addEventListener("click", async function(){
  $("mensajeLogin").textContent="⏳ Tocaste el botón, ingresando...";
  const email=$("loginEmail").value.trim(); const pass=$("loginPassword").value;
  if(!pass){$("mensajeLogin").textContent="❌ Poné contraseña"; return;}
  try{
    const r=await fetch(URL_SUPA+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password:pass})});
    const t=await r.text(); let j={}; try{j=JSON.parse(t)}catch(e){j={error:t}}
    if(!r.ok){$("mensajeLogin").textContent="❌ Error: "+(j.error_description||j.error||t); return;}
    TOKEN=j.access_token; UID=j.user.id; localStorage.setItem("token",TOKEN); localStorage.setItem("uid",UID);
    $("pantallaLogin").classList.add("oculto"); $("sistema").classList.remove("oculto");
  }catch(e){$("mensajeLogin").textContent="❌ Error celular: "+e.message+" - Probá con WiFi";}
});
$("btnCerrarSesion").onclick=function(){localStorage.clear();location.reload();};
$("btnMenuBuscar").onclick=function(){$("buscar").classList.remove("oculto");}
$("btnMenuNuevoVeh").onclick=function(){$("nuevoVehiculo").classList.remove("oculto");}
$("btnMenuNuevaInterv").onclick=function(){$("fecha").valueAsDate=new Date();$("nuevaIntervencion").classList.remove("oculto");}
$("btnRecuperar").onclick=async function(){
  $("estadoRecupero").textContent="⏳ Recuperando..."; let cv=0,ci=0;
  const rv=await fetch(URL_SUPA+"/rest/v1/vehiculos?user_id=is.null&select=*",{headers:headers()}); const veh=await rv.json();
  for(let v of (veh||[])){const rr=await fetch(URL_SUPA+"/rest/v1/vehiculos?id=eq."+v.id,{method:"PATCH",headers:{...headers(),"Prefer":"return=minimal"},body:JSON.stringify({user_id:UID})}); if(rr.ok) cv++;}
  const ri=await fetch(URL_SUPA+"/rest/v1/intervenciones?user_id=is.null&select=*",{headers:headers()}); const inter=await ri.json();
  for(let it of (inter||[])){const rr=await fetch(URL_SUPA+"/rest/v1/intervenciones?id=eq."+it.id,{method:"PATCH",headers:{...headers(),"Prefer":"return=minimal"},body:JSON.stringify({user_id:UID})}); if(rr.ok) ci++;}
  $("estadoRecupero").textContent="✅ Veh: "+cv+" Interv: "+ci;
};
$("btnGuardarVeh").onclick=async function(){
  const p=$("patente").value.toUpperCase().trim(); const r=await fetch(URL_SUPA+"/rest/v1/vehiculos",{method:"POST",headers:{...headers(),"Prefer":"return=minimal"},body:JSON.stringify({user_id:UID,patente:p,marca:$("marca").value,modelo:$("modelo").value,cliente:$("cliente").value})}); alert(r.ok?"Guardado":"Error "+await r.text());
};
$("btnBuscarAhora").onclick=async function(){
  const p=$("patenteBuscar").value.toUpperCase().trim(); const r=await fetch(URL_SUPA+"/rest/v1/vehiculos?user_id=eq."+UID+"&patente=eq."+p+"&select=*",{headers:headers()}); const d=await r.json();
  $("resultadoBusqueda").textContent=d[0]?JSON.stringify(d[0]):"No encontrado. Apretá RECUPERAR si es viejo";
};
$("btnGuardarInterv").onclick=async function(){
  const p=$("patenteIntervencion").value.toUpperCase().trim(); const r=await fetch(URL_SUPA+"/rest/v1/vehiculos?user_id=eq."+UID+"&patente=eq."+p+"&select=id",{headers:headers()}); const v=await r.json();
  if(!v[0]){alert("Patente no existe");return;}
  const rr=await fetch(URL_SUPA+"/rest/v1/intervenciones",{method:"POST",headers:headers(),body:JSON.stringify({user_id:UID,vehiculo_id:v[0].id,fecha:$("fecha").value||new Date().toISOString().slice(0,10),tipo:"Service",descripcion:JSON.stringify({motivo:$("motivo").value})})});
  alert(rr.ok?"Guardada":"Error "+await rr.text());
};
</script></body></html>
