<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taller</title>
<style>body{font-family:Arial;padding:20px;background:#f2f2f2}.card{background:#fff;padding:20px;border-radius:12px;max-width:500px;margin:auto}input,button{width:100%;padding:14px;margin:8px 0;border-radius:8px;border:1px solid #ccc}button{background:#222;color:#fff}#error{color:red;font-weight:bold;white-space:pre-wrap;margin-top:15px;background:#ffe6e6;padding:10px;border-radius:8px}</style></head><body>
<div class="card"><h1>🔧 Taller Mecánico</h1>
<input id="email" value="maxi_boca46@hotmail.com"><input id="pass" type="password" placeholder="Contraseña"><button id="btn">🔐 Ingresar</button><div id="error"></div></div>
<script>
const URL="https://sljknzpyxmpfnkcaoksu.supabase.co";const KEY="sb_publishable_3oidhuHVin61bwlZBTW41w_fuF_rqPI";
document.getElementById("btn").onclick=async()=>{
  const e=document.getElementById("email").value.trim();const p=document.getElementById("pass").value;
  document.getElementById("error").textContent="⏳ Intentando entrar a Supabase...";
  try{
    const r=await fetch(URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({email:e,password:p})});
    const txt=await r.text();
    if(!r.ok){ document.getElementById("error").textContent="❌ ERROR DE SUPABASE (status "+r.status+"):\n"+txt+"\n\nEsto es lo que tenés que mandarme foto."; return; }
    const j=JSON.parse(txt); alert("✅ Entraste! Token: "+j.access_token.slice(0,20)+"... Ahora te mando el taller completo.");
    localStorage.setItem("token",j.access_token); localStorage.setItem("uid",j.user.id); location.href="/TALLER-AUTOS/?v=104";
  }catch(err){ document.getElementById("error").textContent="❌ ERROR DE RED/JS:\n"+err.message; }
};
</script></body></html>
