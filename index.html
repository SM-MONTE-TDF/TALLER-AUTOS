<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM MONTENEGRO</title><style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#050505;color:#fff;min-height:100vh}.c{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}.logo{font-size:40px;font-weight:900;font-style:italic}.logo b{color:#00e5ff}.sub{color:#666;font-size:11px;letter-spacing:4px;margin:10px 0 30px}input,button{width:100%;padding:13px;border-radius:12px;border:1px solid #222;background:#121212;color:#fff;margin:6px 0;font-size:15px}.btn{background:#00e5ff;color:#000;font-weight:900;border:0}#app{display:none;max-width:700px;margin:0 auto;padding:12px}.card{background:#101010;border:1px solid #1e1e1e;border-radius:12px;padding:12px;margin:10px 0}.vb{background:#0e0e0e;border:1px solid #222;border-radius:10px;padding:10px;margin:6px 0;display:flex;justify-content:space-between;width:100%;color:#fff}</style></head><body>
<div id="L" class="c"><div class="logo">SM <b>MONTENEGRO</b></div><div class="sub">TALLER AUTOS</div><div style="width:100%;max-width:320px"><input id="u" value="SM-MONTE-"><input id="p" type="password" value="Taller.monte1."><button class="btn" type="button" onclick="go()">ENTRAR</button><div id="m" style="color:#f55;text-align:center"></div></div></div>
<div id="A"><div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #111"><div class="logo" style="font-size:20px">SM <b>MONTENEGRO</b></div><button onclick="localStorage.clear();location.reload()" style="width:auto;background:#1a0000;color:#f88">Salir</button></div><div id="app"><div class="card"><input type="date" id="f"><input id="pa" placeholder="PATENTE *"><input id="ma" placeholder="Marca Modelo"><input id="ti" placeholder="Titular"><input id="te" placeholder="Telefono"><button class="btn" type="button" onclick="add()">+ GUARDAR VEHICULO</button></div><input id="q" placeholder="Buscar..." oninput="list()"><div id="ls"></div></div></div>
<script>
const U="SM-MONTE-",P="Taller.monte1.",K="sm_final";let D=[];try{D=JSON.parse(localStorage.getItem(K)||"[]")}catch(e){}
function go(){if(u.value.trim()===U&&p.value===P){localStorage.setItem("ok","1");show()}else m.innerText="Clave mal"}function show(){L.style.display="none";A.style.display="block";app.style.display="block";f.value=new Date().toISOString().slice(0,10);list()}
function sv(){localStorage.setItem(K,JSON.stringify(D));list()}
function add(){let pt=pa.value.toUpperCase().trim();if(!pt)return alert("Patente?");D.unshift({id:Date.now(),f:f.value,pt:pt,ma:ma.value,ti:ti.value,te:te.value});pa.value=ma.value=ti.value=te.value="";sv()}
function list(){let s=(q.value||"").toLowerCase();ls.innerHTML="";D.filter(v=>(v.pt+" "+v.ti).toLowerCase().includes(s)).forEach((v,i)=>{let d=document.createElement("div");d.className="vb";d.innerHTML="<div><b style=color:#00e5ff>"+v.pt+"</b><div style=font-size:12px;color:#888>"+v.ma+" • "+v.ti+"</div></div><span onclick='del("+D.indexOf(v)+")' style=color:#f55>X</span>";ls.appendChild(d)})}
function del(i){if(confirm("Borrar?")){D.splice(i,1);sv()}}
if(localStorage.getItem("ok")==="1")show();
</script></body></html>
