<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM MONTENEGRO</title><style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#050505;color:#fff;min-height:100vh}.c{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}.logo{font-size:40px;font-weight:900;font-style:italic}.logo b{color:#00e5ff}.sub{color:#666;font-size:11px;letter-spacing:4px;margin:10px 0 30px}input,button,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #222;background:#121212;color:#fff;margin:6px 0;font-size:15px}button{cursor:pointer}.btn{background:#00e5ff;color:#000;font-weight:900;border:0}#app{display:none;max-width:760px;margin:0 auto;padding:12px}.card{background:#101010;border:1px solid #1e1e1e;border-radius:14px;padding:12px;margin:10px 0}.vb{background:#0e0e0e;border:1px solid #222;border-radius:12px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;width:100%;color:#fff;text-align:left}.del{background:#1c0a0a;border:1px solid #f55;color:#f88;padding:7px 10px;border-radius:8px}.back{background:#111;border:1px solid #333;color:#aaa;padding:7px 10px;border-radius:8px}.badge{background:#00e5ff22;color:#00e5ff;border:1px solid #00e5ff44;padding:3px 8px;border-radius:20px;font-size:11px}.view{display:none}.view.active{display:block}</style></head><body>
<div id="L" class="c"><div class="logo">SM <b>MONTENEGRO</b></div><div class="sub">TALLER AUTOS</div><div style="width:100%;max-width:320px"><input id="u" value="SM-MONTE-"><input id="p" type="password" value="Taller.monte1."><button class="btn" onclick="go()">ENTRAR</button><div id="m" style="color:#f55;text-align:center"></div></div></div>
<div id="A"><div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #111"><div class="logo" style="font-size:20px">SM <b>MONTENEGRO</b></div><div style="display:flex;gap:6px"><button onclick="exp()" style="background:#111;border:1px solid #00e5ff;color:#00e5ff;padding:7px;border-radius:8px">Backup</button><input type="file" id="imp" accept=".json" style="display:none" onchange="im(event)"><button onclick="imp.click()" style="background:#111;border:1px solid #555;color:#aaa;padding:7px;border-radius:8px">Importar</button><button class="del" onclick="localStorage.removeItem('ok');location.reload()">Salir</button></div></div><div id="app"><div id="v1" class="view active"><div class="card"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input type="date" id="vf"><input id="vp" placeholder="PATENTE *"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="vm" placeholder="Marca"><input id="vmo" placeholder="Modelo"></div><input id="vt" placeholder="Titular"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="vte" placeholder="Tel"><input id="vc" placeholder="Contacto"></div><button class="btn" onclick="addV()">+ GUARDAR VEHICULO</button></div><input id="q" placeholder="Buscar..." oninput="ls()"><div id="lst"></div></div><div id="v2" class="view"><button class="back" onclick="v1()">← Volver</button><div id="det" class="card" style="margin-top:12px"></div><div class="card"><h3 style="color:#00e5ff;margin:0 0 10px">+ Intervención</h3><input type="date" id="if"><input id="ik" placeholder="Kilometraje"><textarea id="id" placeholder="Trabajo realizado..." rows="3"></textarea><input id="ic" placeholder="Costo $"><input type="file" id="ift" accept="image/*" multiple><button class="btn" style="margin-top:8px" onclick="addI()">Guardar intervención</button></div><div id="his"></div></div></div></div></div>
<script>
const U="SM-MONTE-",P="Taller.monte1.",K="sm_final_v3";let D=[];try{D=JSON.parse(localStorage.getItem(K)||"[]")}catch(e){}let S=-1;
function today(){return new Date().toISOString().slice(0,10)}
vf.value=today();if_.value=today();function go(){if(u.value.trim()===U&&p.value===P){localStorage.setItem("ok","1");show()}else m.innerText="Clave mal"}function show(){L.style.display="none";A.style.display="block";app.style.display="block";ls()}function sv(){localStorage.setItem(K,JSON.stringify(D));ls();if(S>=0)rd()}
function addV(){let pt=vp.value.toUpperCase().trim();if(!pt)return alert("Patente?");D.unshift({id:Date.now(),f:vf.value||today(),pt:pt,ma:vm.value,mo:vmo.value,ti:vt.value,te:vte.value,co:vc.value,iv:[]});vp.value=vm.value=vmo.value=vt.value=vte.value=vc.value="";vf.value=today();sv()}
function ls(){let s=(q.value||"").toLowerCase();let c=lst;c.innerHTML="";D.filter(v=>(v.pt+" "+v.ti+" "+v.ma).toLowerCase().includes(s)).forEach(v=>{let i=D.indexOf(v);let b=document.createElement("button");b.className="vb";b.innerHTML="<div><b style=color:#00e5ff>"+v.pt+"</b><div style=color:#888;font-size:12px>"+(v.ma||"")+" "+(v.mo||"")+" • "+(v.ti||"")+"</div><div style=color:#666;font-size:11px>"+v.iv.length+" intervenciones</div></div><span style=color:#00e5ff>›</span>";b.onclick=()=>openD(i);c.appendChild(b)})}
function v1(){S=-1;document.getElementById("v2").classList.remove("active");document.getElementById("v1").classList.add("active");ls()}
function openD(i){S=i;document.getElementById("v1").classList.remove("active");document.getElementById("v2").classList.add("active");if_.value=today();rd()}<script>
function rd(){if(S<0)return;let v=D[S];det.innerHTML='<div style=display:flex;justify-content:space-between><div><b style=color:#00e5ff;font-size:20px>'+v.pt+'</b><div style=color:#888;font-size:12px;margin-top:4px>'+v.f+' • '+v.ma+' '+v.mo+'</div><div style=margin-top:8px;font-size:14px> Titular:<b> '+(v.ti||'-')+'</b><br>Tel:'+(v.te||'-')+'<br>Cont:'+(v.co||'-')+'</div></div><div style=display:flex;flex-direction:column;gap:6px><button class=del onclick=delV()>Borrar</button><button class=back onclick="window.open('https://wa.me/?text=*SM MONTENEGRO*%0APatente:'+v.pt)">WhatsApp</button></div></div>';let h=his;h.innerHTML='';if(!v.iv.length){h.innerHTML='<div style=text-align:center;color:#666;padding:15px>Sin intervenciones</div>';return}v.iv.slice().reverse().forEach((it,ri)=>{let r=v.iv.length-1-ri;let d=document.createElement('div');d.className='card';let fh='';if(it.fo&&it.fo.length){fh='<div style=display:flex;gap:6px;flex-wrap:wrap;margin-top:8px>';it.fo.forEach(f=>fh+='<img src='+f+' style=width:60px;height:60px;object-fit:cover;border-radius:8px onclick=window.open(this.src)>');fh+='</div>'}d.innerHTML='<div style=display:flex;justify-content:space-between><div><span class=badge>'+it.f+'</span> <small style=color:#888>KM:'+(it.k||'-')+'</small></div><div><b style=color:#00e5ff>$'+(it.c||0)+'</b> <span onclick=delI('+r+') style=color:#f55;cursor:pointer;margin-left:10px>✕</span></div></div><div style=margin-top:8px;white-space:pre-wrap>'+(it.d||'')+'</div>'+fh;h.appendChild(d)})}
function delV(){if(confirm('Borrar '+D[S].pt+'?')){D.splice(S,1);S=-1;sv();v1()}}
async function addI(){if(S<0)return;let de=id.value.trim();if(!de)return alert('Descripción?');let f=[];for(let file of ift.files){f.push(await toB(file))}D[S].iv.push({f:if_.value||today(),k:ik.value,d:de,c:ic.value,fo:f});id.value=ik.value=ic.value='';ift.value='';if_.value=today();sv()}
function delI(i){if(confirm('Borrar intervención?')){D[S].iv.splice(i,1);sv()}}function toB(file){return new Promise((r,j)=>{let rd=new FileReader();rd.onload=e=>r(e.target.result);rd.onerror=j;rd.readAsDataURL(file)})}
function exp(){let b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});let u=URL.createObjectURL(b);let a=document.createElement('a');a.href=u;a.download='backup-taller-'+today()+'.json';a.click()}
function im(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=ev=>{try{let impo=JSON.parse(ev.target.result);if(Array.isArray(impo)){if(confirm('Importar '+impo.length+' vehículos?')){D=impo.concat(D);sv();alert('Importado!')}}}catch(err){alert('Archivo inválido')}};r.readAsText(file)}
if(localStorage.getItem('ok')==='1')show();
</script></body></html>
