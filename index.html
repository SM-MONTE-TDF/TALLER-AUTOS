<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SM MONTENEGRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff}
.hidden{display:none !important}
.wrap{max-width:460px;margin:0 auto;padding:14px}
.logo{width:100%;border-radius:14px;margin-bottom:18px;display:block}
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-weight:900;font-size:16px;margin:8px 0}
.btn-blue{background:#00c8ff;color:#000}
.btn-red{background:#7a1f1f;color:#fff}
#login{position:fixed;inset:0;background:#000;z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{width:100%;max-width:360px;text-align:center}
input,textarea{width:100%;padding:14px;margin:8px 0;background:#111;border:1px solid #333;border-radius:10px;color:#fff}
.card{background:#111;border:1px solid #222;border-radius:12px;padding:14px;margin:10px 0;border-left:4px solid #00c8ff}
.patente{background:#fff;color:#000;font-weight:900;padding:4px 10px;border-radius:6px}
</style>
</head>
<body>

<div id="login">
<div class="box">
<img src="./ff2ace8e-276f-47cf-8eb8-9f8eedf27a89.jpeg" style="width:100%;border-radius:14px;margin-bottom:16px">
<h2 style="color:#00c8ff">SM MONTENEGRO</h2>
<p style="color:#888;margin:10px 0 20px">Taller - Ingreso</p>
<input id="pass" type="password" placeholder="Contraseña: 1234" style="text-align:center">
<button class="btn btn-blue" onclick="if(document.getElementById('pass').value=='1234'){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden')}else{alert('Clave 1234')}">Entrar</button>
</div>
</div>

<div id="app" class="hidden">
<div class="wrap">
<img src="./ff2ace8e-276f-47cf-8eb8-9f8eedf27a89.jpeg" class="logo">
<button class="btn btn-blue" onclick="show('buscar')">🔍 Buscar</button>
<button class="btn btn-blue" onclick="show('nuevoV')">🚗 Nuevo vehículo</button>
<button class="btn btn-blue" onclick="show('nuevaI')">🛠️ Nueva intervención</button>
<button class="btn btn-blue" onclick="show('recuperar')">♻️ Recuperar viejos</button>
<!-- BOTON QUE SI VA A LOGIN 100% -->
<button class="btn btn-red" onclick="document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');document.getElementById('pass').value='';window.scrollTo(0,0);">Cerrar sesión</button>
<hr style="border:0;border-top:1px solid #222;margin:16px 0">
<div id="sec-buscar"><h2>Buscar (<span id="cont">0</span>)</h2><input id="q" placeholder="Patente..." oninput="buscar()"><div id="r"></div></div>
<div id="sec-nuevoV" class="hidden"><h2>Nuevo vehículo</h2><input id="vPat" placeholder="PATENTE" style="text-transform:uppercase"><input id="vMar" placeholder="Marca"><input id="vMod" placeholder="Modelo"><input id="vCli" placeholder="Cliente"><button class="btn btn-blue" onclick="saveV()">💾 Guardar</button></div>
<div id="sec-nuevaI" class="hidden"><h2>Nueva intervención</h2><input id="iPat" placeholder="Patente" style="text-transform:uppercase"><input id="iTra" placeholder="Trabajo"><button class="btn btn-blue" onclick="saveI()">💾 Guardar</button></div>
<div id="sec-recuperar" class="hidden"><h2>Recuperar viejos</h2><div id="rPap"></div></div>
</div>
</div>

<script>
let vehiculos=JSON.parse(localStorage.getItem('sm_vehiculos')||'[]');
function save(){localStorage.setItem('sm_vehiculos',JSON.stringify(vehiculos))}
function show(id){document.querySelectorAll('[id^=sec-]').forEach(e=>e.classList.add('hidden'));document.getElementById('sec-'+id).classList.remove('hidden');if(id=='buscar')buscar()}
function buscar(){let q=(document.getElementById('q').value||'').toLowerCase();document.getElementById('cont').innerText=vehiculos.length;let f=q?vehiculos.filter(v=>(v.patente+v.marca+v.modelo+v.cliente).toLowerCase().includes(q)):vehiculos;let c=document.getElementById('r');c.innerHTML=f.length?f.map(v=>'<div class=card><span class=patente>'+v.patente+'</span> '+v.marca+' '+(v.cliente||'')+'</div>').join(''):'<p style=color:#555;text-align:center>No hay vehículos</p>'}
function saveV(){let p=document.getElementById('vPat').value.toUpperCase().trim();if(!p)return alert('Patente');vehiculos.unshift({patente:p,marca:document.getElementById('vMar').value,modelo:document.getElementById('vMod').value,cliente:document.getElementById('vCli').value});save();buscar();show('buscar');alert('Guardado '+p)}
function saveI(){alert('Intervención guardada para '+document.getElementById('iPat').value)}
buscar();
</script>
</body>
</html>
