<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SM MONTENEGRO - Taller</title>
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto}
body{margin:0;background:#000;color:#fff;min-height:100vh}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
h1{color:#00d4ff;letter-spacing:2px;margin:0 0 5px;font-size:26px}
.sub{color:#666;font-size:12px;letter-spacing:3px;margin-bottom:25px}
input{background:#111;border:1px solid #333;color:#fff;padding:14px 16px;border-radius:12px;width:100%;max-width:340px;margin:6px 0;font-size:16px;outline:none}
input:focus{border-color:#00d4ff}
.btn{background:#00d4ff;color:#000;border:0;padding:14px;width:100%;max-width:340px;border-radius:12px;font-weight:800;font-size:16px;margin-top:12px;cursor:pointer}
.msg{color:#ff4d4d;margin-top:12px;font-size:13px;min-height:18px;text-align:center;max-width:340px}
.app{display:none;padding:15px;max-width:600px;margin:0 auto}
.card{background:#111;border:1px solid #222;border-radius:14px;padding:14px;margin:10px 0}
.card h3{margin:0 0 6px;color:#00d4ff}
.small{color:#888;font-size:12px}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.del{background:#1a0000;border:1px solid #ff2a2a;color:#ff6b6b;padding:8px 12px;border-radius:10px;font-size:13px;cursor:pointer}
.add{background:#001a1a;border:1px solid #00d4ff;color:#00d4ff;padding:8px 12px;border-radius:10px;font-size:13px;cursor:pointer}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 0}
.topbar button{background:#222;color:#fff;border:0;padding:8px 12px;border-radius:8px}
</style>
</head>
<body>
<div id="login" class="center">
<div style="font-size:42px;font-weight:900;font-style:italic;line-height:1;margin-bottom:10px"><span style="color:#fff">SM</span> <span style="color:#00d4ff">MONTENEGRO</span></div>
