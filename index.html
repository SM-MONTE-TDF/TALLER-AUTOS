<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taller Mecánico</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;font-family:Arial,sans-serif;background:#f2f2f2;color:#222}
.contenedor{max-width:800px;margin:auto}h1{text-align:center;margin-bottom:25px}h2{margin-top:0}
.tarjeta{background:white;padding:20px;margin-bottom:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
button{width:100%;padding:14px;margin-top:10px;border:none;border-radius:8px;background:#222;color:white;font-size:16px;cursor:pointer}
button:hover{background:#444}button:disabled{opacity:.6;cursor:not-allowed}
.boton-secundario{background:#777}.boton-cerrar{background:#a00000}.boton-editar{background:#555;margin-top:15px}.boton-migrar{background:#0b6b3a}
input,select,textarea{width:100%;padding:12px;margin-top:6px;margin-bottom:15px;border:1px solid #ccc;border-radius:7px;font-size:15px}
textarea{min-height:90px;resize:vertical}label{font-weight:bold}.oculto{display:none!important}
.info-vehiculo{background:#f5f5f5;padding:15px;border-radius:8px;margin-bottom:15px}
.historial-fechas{display:flex;flex-direction:column;gap:10px;margin-top:15px}
.boton-fecha{width:100%;margin:0;padding:13px 15px;background:#333;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px}
.detalle-intervencion{background:#f7f7f7;padding:15px;border-radius:8px;margin-top:15px}
.fotos-guardadas{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.fotos-guardadas img{width:120px;height:120px;object-fit:cover;border-radius:8px;cursor:pointer}
.vista-previa-fotos{display:flex;flex-wrap:wrap;gap:12px;margin-top:15px}
.foto-preview{position:relative;width:110px;height:110px}.foto-preview img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.boton-eliminar-foto{position:absolute;top:-8px;right:-8px;width:28px;height:28px;padding:0;margin:0;border-radius:50%;background:#d00;color:white;font-size:16px}
.mensaje{padding:15px;background:#fff3cd;border-radius:8px;margin-top:15px}.mensaje-error{padding:15px;background:#f8d7da;color:#842029;border-radius:8px;margin-top:15px}.mensaje-exito{padding:15px;background:#d1e7dd;color:#0f5132;border-radius:8px;margin-top:15px}.cargando{padding:15px;background:#eee;border-radius:8px;margin-top:15px;text-align:center}
small{display:block;color:#666;margin-bottom:10px}.separador{height:1px;background:#ddd;margin:20px 0}
#panelMigracion{border:2px solid #198754;background:#e9f7ef}
</style>
</head>
<body>

<div id="pantallaLogin" class="contenedor">
  <div class="tarjeta"><h1>🔧 Taller Mecánico</h1><h2>🔐 Iniciar sesión</h2>
    <label>Correo electrónico</label><input type="email" id="loginEmail" autocomplete="username">
    <label>Contraseña</label><input type="password" id="loginPassword" autocomplete="current-password">
    <button id="btnLogin">🔐 Ingresar</button><div id="mensajeLogin"></div>
  </div>
</div>

<div id="sistema" class="contenedor oculto">
  <h1>🔧 Taller Mecánico</h1>
  <div id="menuPrincipal" class="tarjeta">
    <div id="panelMigracion" class="tarjeta oculto"><h2>📦 Datos antiguos encontrados</h2><p>Se encontraron vehículos en este navegador que no están en Supabase.</p><div id="textoMigracion" style="font-weight:bold;margin:10px 0"></div><button class="boton-migrar" id="btnMigrar">📦 Migrar todos los datos</button><div id="resultadoMigracion"></div></div>
    <button id="btnMenuBuscar">🔎 Buscar vehículo</button>
    <button id="btnMenuNuevoVeh">🚗 Nuevo vehículo</button>
    <button id="btnMenuNuevaInterv">🛠️ Nueva intervención</button>
    <button class="boton-cerrar" id="btnCerrarSesion">🔒 Cerrar sesión</button>
  </div>
