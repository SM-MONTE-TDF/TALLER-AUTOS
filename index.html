<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Taller Mecánico</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    color: #222;
}

.contenedor {
    max-width: 800px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

h2 {
    margin-top: 0;
}

.tarjeta {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: #222;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #444;
}

.boton-secundario {
    background: #777;
}

.boton-editar {
    background: #444;
}

.boton-guardar-edicion {
    background: #222;
}

input,
select,
textarea {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

label {
    font-weight: bold;
}

.oculto {
    display: none;
}

.info-vehiculo {
    background: #f5f5f5;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 15px;
}

.historial-fechas {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 15px;
}

.boton-fecha {
    width: 100%;
    margin: 0;
    padding: 13px 15px;
    background: #333;
    text-align: left;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.boton-fecha:hover {
    background: #555;
}

.fecha-ingreso {
    font-weight: bold;
}

.tipo-ingreso {
    font-size: 14px;
    background: #666;
    padding: 6px 10px;
    border-radius: 15px;
    white-space: nowrap;
}

.detalle-intervencion {
    background: #f7f7f7;
    padding: 15px;
    border-radius: 8px;
    margin-top: 15px;
}

.detalle-intervencion p {
    line-height: 1.5;
}

.fotos-guardadas {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
}

.fotos-guardadas img {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 8px;
    cursor: pointer;
}

.boton-agregar-fotos {
    background: #333;
    margin-bottom: 5px;
}

.vista-previa-fotos {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 15px;
}

.foto-preview {
    position: relative;
    width: 110px;
    height: 110px;
}

.foto-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
}

.boton-eliminar-foto {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 28px;
    height: 28px;
    padding: 0;
    margin: 0;
    border-radius: 50%;
    background: #d00;
    color: white;
    font-size: 16px;
}

.mensaje {
    padding: 15px;
    background: #fff3cd;
    border-radius: 8px;
    margin-top: 15px;
}

small {
    display: block;
    color: #666;
    margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="contenedor">

    <h1>🔧 Taller Mecánico</h1>

    <!-- MENÚ PRINCIPAL -->
    <div id="menuPrincipal" class="tarjeta">

        <button onclick="mostrarSeccion('buscar')">
            🔎 Buscar vehículo
        </button>

        <button onclick="mostrarSeccion('nuevoVehiculo')">
            🚗 Nuevo vehículo
        </button>

        <button onclick="mostrarSeccion('nuevaIntervencion')">
            🛠️ Nueva intervención
        </button>

    </div>


    <!-- BUSCAR VEHÍCULO -->
    <div id="buscar" class="tarjeta oculto">

        <h2>🔎 Buscar vehículo</h2>

        <label>Patente</label>

        <input
            type="text"
            id="patenteBuscar"
            placeholder="Ej: AB123CD"
        >

        <button onclick="buscarVehiculo()">
            Buscar
        </button>

        <div id="resultadoBusqueda"></div>

        <button
            class="boton-secundario"
            onclick="volverInicio()"
        >
            ← Volver al inicio
        </button>

    </div>


    <!-- NUEVO VEHÍCULO -->
    <div id="nuevoVehiculo" class="tarjeta oculto">

        <h2>🚗 Nuevo vehículo</h2>

        <label>Patente</label>

        <input
            type="text"
            id="patente"
            placeholder="Ej: AB123CD"
        >

        <label>Marca</label>

        <input
            type="text"
            id="marca"
        >

        <label>Modelo</label>

        <input
            type="text"
            id="modelo"
        >

        <label>Año</label>

        <input
            type="number"
            id="anio"
        >

        <label>Kilometraje</label>

        <input
            type="number"
            id="kilometraje"
        >

        <label>Cliente</label>

        <input
            type="text"
            id="cliente"
        >

        <label>Teléfono</label>

        <input
            type="tel"
            id="telefono"
        >

        <button onclick="agregarVehiculo()">
            Guardar vehículo
        </button>

        <button
            class="boton-secundario"
            onclick="volverInicio()"
        >
            ← Volver al inicio
        </button>

    </div>


    <!-- EDITAR VEHÍCULO -->
    <div id="editarVehiculo" class="tarjeta oculto">

        <h2>✏️ Editar datos del vehículo</h2>

        <label>Patente</label>

        <input
            type="text"
            id="editarPatente"
            disabled
        >

        <label>Marca</label>

        <input
            type="text"
            id="editarMarca"
        >

        <label>Modelo</label>

        <input
            type="text"
            id="editarModelo"
        >

        <label>Año</label>

        <input
            type="number"
            id="editarAnio"
        >

        <label>Kilometraje</label>

        <input
            type="number"
            id="editarKilometraje"
        >

        <label>Cliente</label>

        <input
            type="text"
            id="editarCliente"
        >

        <label>Teléfono</label>

        <input
            type="tel"
            id="editarTelefono"
        >

        <button
            class="boton-guardar-edicion"
            onclick="guardarEdicionVehiculo()"
        >
            💾 Guardar cambios
        </button>

        <button
            class="boton-secundario"
            onclick="cancelarEdicionVehiculo()"
        >
            ← Cancelar
        </button>

    </div>


    <!-- NUEVA INTERVENCIÓN -->
    <div id="nuevaIntervencion" class="tarjeta oculto">

        <h2>🛠️ Nueva intervención</h2>

        <label>Patente</label>

        <input
            type="text"
            id="patenteIntervencion"
            placeholder="Ej: AB123CD"
        >

        <label>Fecha de ingreso</label>

        <input
            type="date"
            id="fecha"
        >

        <label>Tipo de trabajo</label>

        <select id="tipo">

            <option value="">
                Seleccionar tipo
            </option>

            <option value="Service">
                🔧 Service
            </option>

            <option value="Reparación">
                🛠️ Reparación
            </option>

            <option value="Diagnóstico">
                🔎 Diagnóstico
            </option>

            <option value="Otro">
                📋 Otro
            </option>

        </select>


        <label>Kilometraje</label>

        <input
            type="number"
            id="kmIntervencion"
        >

        <label>Motivo de ingreso</label>

        <textarea
            id="motivo"
            placeholder="¿Por qué ingresó el vehículo?"
        ></textarea>

        <label>Trabajo realizado</label>

        <textarea
            id="trabajo"
            placeholder="Detalle del trabajo realizado"
        ></textarea>

        <label>Repuestos</label>

        <textarea
            id="repuestos"
            placeholder="Repuestos utilizados"
        ></textarea>

        <label>Observaciones</label>

        <textarea
            id="observaciones"
            placeholder="Observaciones"
        ></textarea>


        <label>📷 Fotos de la intervención</label>

        <input
            type="file"
            id="fotos"
            accept="image/*"
            multiple
            style="display:none;"
            onchange="seleccionarFotos()"
        >

        <button
            type="button"
            class="boton-agregar-fotos"
            onclick="document.getElementById('fotos').click()"
        >
            📷 Agregar fotos
        </button>

        <small>
            Podés agregar varias fotos. Antes de guardar podés eliminar
            las que no quieras.
        </small>

        <div
            id="vistaPreviaFotos"
            class="vista-previa-fotos"
        ></div>


        <button onclick="agregarIntervencion()">
            💾 Guardar intervención
        </button>

        <button
            class="boton-secundario"
            onclick="volverInicio()"
        >
            ← Volver al inicio
        </button>

    </div>

</div>


<script>

/* =========================================================
   DATOS
   ========================================================= */

let vehiculos = [];
let historialActual = [];
let fotosSeleccionadas = [];
let patenteVehiculoEditando = "";


/* =========================================================
   CARGAR DATOS
   ========================================================= */

function cargarDatos() {

    try {

        const datosGuardados =
            localStorage.getItem("vehiculos");

        if (!datosGuardados) {

            vehiculos = [];

            return;
        }

        vehiculos =
            JSON.parse(datosGuardados);

        if (!Array.isArray(vehiculos)) {

            vehiculos = [];

            return;
        }

        vehiculos.forEach(vehiculo => {

            if (Array.isArray(vehiculo.historial)) {
                return;
            }

            if (Array.isArray(vehiculo.intervenciones)) {

                vehiculo.historial =
                    vehiculo.intervenciones;

            } else if (Array.isArray(vehiculo.registros)) {

                vehiculo.historial =
                    vehiculo.registros;

            } else {

                vehiculo.historial = [];

            }

        });

        localStorage.setItem(
            "vehiculos",
            JSON.stringify(vehiculos)
        );

    } catch (error) {

        console.error(
            "Error cargando datos:",
            error
        );

        alert(
            "No se pudieron leer los datos guardados."
        );

        vehiculos = [];
    }
}


/* =========================================================
   GUARDAR DATOS
   ========================================================= */

function guardarDatos() {

    localStorage.setItem(
        "vehiculos",
        JSON.stringify(vehiculos)
    );
}


/* =========================================================
   INICIO
   ========================================================= */

cargarDatos();


/* =========================================================
   NAVEGACIÓN
   ========================================================= */

function mostrarSeccion(seccion) {

    document
        .getElementById("menuPrincipal")
        .classList.add("oculto");

    document
        .getElementById("buscar")
        .classList.add("oculto");

    document
        .getElementById("nuevoVehiculo")
        .classList.add("oculto");

    document
        .getElementById("editarVehiculo")
        .classList.add("oculto");

    document
        .getElementById("nuevaIntervencion")
        .classList.add("oculto");

    document
        .getElementById(seccion)
        .classList.remove("oculto");
}


function volverInicio() {

    document
        .getElementById("buscar")
        .classList.add("oculto");

    document
        .getElementById("nuevoVehiculo")
        .classList.add("oculto");

    document
        .getElementById("editarVehiculo")
        .classList.add("oculto");

    document
        .getElementById("nuevaIntervencion")
        .classList.add("oculto");

    document
        .getElementById("menuPrincipal")
        .classList.remove("oculto");

    document
        .getElementById("resultadoBusqueda")
        .innerHTML = "";

    historialActual = [];
}


/* =========================================================
   AGREGAR VEHÍCULO
   ========================================================= */

function agregarVehiculo() {

    const patente =
        document
            .getElementById("patente")
            .value
            .trim()
            .toUpperCase();

    const marca =
        document
            .getElementById("marca")
            .value
            .trim();

    const modelo =
        document
            .getElementById("modelo")
            .value
            .trim();

    const anio =
        document
            .getElementById("anio")
            .value
            .trim();

    const kilometraje =
        document
            .getElementById("kilometraje")
            .value
            .trim();

    const cliente =
        document
            .getElementById("cliente")
            .value
            .trim();

    const telefono =
        document
            .getElementById("telefono")
            .value
            .trim();


    if (!patente) {

        alert("Ingresá la patente.");

        return;
    }


    const existente =
        vehiculos.find(
            v => v.patente === patente
        );


    if (existente) {

        alert(
            "Ese vehículo ya está registrado."
        );

        return;
    }


    const nuevoVehiculo = {

        patente: patente,

        marca: marca,

        modelo: modelo,

        anio: anio,

        kilometraje: kilometraje,

        cliente: cliente,

        telefono: telefono,

        historial: []

    };


    vehiculos.push(
        nuevoVehiculo
    );


    guardarDatos();


    alert(
        "Vehículo guardado correctamente."
    );


    document.getElementById(
        "patente"
    ).value = "";

    document.getElementById(
        "marca"
    ).value = "";

    document.getElementById(
        "modelo"
    ).value = "";

    document.getElementById(
        "anio"
    ).value = "";

    document.getElementById(
        "kilometraje"
    ).value = "";

    document.getElementById(
        "cliente"
    ).value = "";

    document.getElementById(
        "telefono"
    ).value = "";


    volverInicio();
}


/* =========================================================
   EDITAR VEHÍCULO
   ========================================================= */

function abrirEdicionVehiculo() {

    const patente =
        patenteVehiculoEditando;

    const vehiculo =
        vehiculos.find(
            v => v.patente === patente
        );


    if (!vehiculo) {

        alert(
            "No se encontró el vehículo."
        );

        return;
    }


    document.getElementById(
        "editarPatente"
    ).value =
        vehiculo.patente || "";


    document.getElementById(
        "editarMarca"
    ).value =
        vehiculo.marca || "";


    document.getElementById(
        "editarModelo"
    ).value =
        vehiculo.modelo || "";


    document.getElementById(
        "editarAnio"
    ).value =
        vehiculo.anio || "";


    document.getElementById(
        "editarKilometraje"
    ).value =
        vehiculo.kilometraje || "";


    document.getElementById(
        "editarCliente"
    ).value =
        vehiculo.cliente || "";


    document.getElementById(
        "editarTelefono"
    ).value =
        vehiculo.telefono || "";


    mostrarSeccion(
        "editarVehiculo"
    );
}


function guardarEdicionVehiculo() {

    const patente =
        patenteVehiculoEditando;


    const vehiculo =
        vehiculos.find(
            v => v.patente === patente
        );


    if (!vehiculo) {

        alert(
            "No se encontró el vehículo."
        );

        return;
    }


    vehiculo.marca =
        document
            .getElementById("editarMarca")
            .value
            .trim();


    vehiculo.modelo =
        document
            .getElementById("editarModelo")
            .value
            .trim();


    vehiculo.anio =
        document
            .getElementById("editarAnio")
            .value
            .trim();


    vehiculo.kilometraje =
        document
            .getElementById("editarKilometraje")
            .value
            .trim();


    vehiculo.cliente =
        document
            .getElementById("editarCliente")
            .value
            .trim();


    vehiculo.telefono =
        document
            .getElementById("editarTelefono")
            .value
            .trim();


    guardarDatos();


    alert(
        "Datos del vehículo actualizados correctamente."
    );


    mostrarSeccion("buscar");

    buscarVehiculo();
}


function cancelarEdicionVehiculo() {

    mostrarSeccion("buscar");

    buscarVehiculo();
}


/* =========================================================
   AGREGAR INTERVENCIÓN
   ========================================================= */

async function agregarIntervencion() {

    const patente =
        document
            .getElementById(
                "patenteIntervencion"
            )
            .value
            .trim()
            .toUpperCase();

    const fecha =
        document
            .getElementById("fecha")
            .value;

    const tipo =
        document
            .getElementById("tipo")
            .value;

    const km =
        document
            .getElementById(
                "kmIntervencion"
            )
            .value
            .trim();

    const motivo =
        document
            .getElementById("motivo")
            .value
            .trim();

    const trabajo =
        document
            .getElementById("trabajo")
            .value
            .trim();

    const repuestos =
        document
            .getElementById("repuestos")
            .value
            .trim();

    const observaciones =
        document
            .getElementById("observaciones")
            .value
            .trim();


    if (!patente) {

        alert(
            "Ingresá la patente."
        );

        return;
    }


    if (!fecha) {

        alert(
            "Ingresá la fecha."
        );

        return;
    }


    if (!tipo) {

        alert(
            "Seleccioná el tipo de trabajo."
        );

        return;
    }


    const vehiculo =
        vehiculos.find(
            v => v.patente === patente
        );


    if (!vehiculo) {

        alert(
            "No existe un vehículo con esa patente."
        );

        return;
    }


    if (!Array.isArray(vehiculo.historial)) {

        vehiculo.historial = [];

    }


    let fotos = [];


    try {

        fotos =
            await procesarFotos();

    } catch (error) {

        console.error(error);

        alert(
            "Hubo un problema al procesar las fotos."
        );

        return;
    }


    const intervencion = {

        fecha: fecha,

        tipo: tipo,

        kilometraje: km,

        motivo: motivo,

        trabajo: trabajo,

        repuestos: repuestos,

        observaciones: observaciones,

        fotos: fotos

    };


    vehiculo.historial.push(
        intervencion
    );


    try {

        guardarDatos();

    } catch (error) {

        vehiculo.historial.pop();

        alert(
            "No se pudo guardar la intervención."
        );

        return;
    }


    alert(
        "Intervención guardada correctamente."
    );


    limpiarFormularioIntervencion();

    volverInicio();
}


/* =========================================================
   PROCESAR FOTOS
   ========================================================= */

function procesarFotos() {

    return Promise.all(
        fotosSeleccionadas.map(
            archivo =>
                comprimirImagen(archivo)
        )
    );
}


function comprimirImagen(archivo) {

    return new Promise(
        (resolve, reject) => {

            const lector =
                new FileReader();


            lector.onload =
                function(e) {

                    const imagen =
                        new Image();


                    imagen.onload =
                        function() {

                            const maximo =
                                1200;

                            let ancho =
                                imagen.width;

                            let alto =
                                imagen.height;


                            if (
                                ancho > maximo ||
                                alto > maximo
                            ) {

                                if (
                                    ancho > alto
                                ) {

                                    alto =
                                        alto *
                                        (maximo / ancho);

                                    ancho =
                                        maximo;

                                } else {

                                    ancho =
                                        ancho *
                                        (maximo / alto);

                                    alto =
                                        maximo;
                                }
                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                ancho;

                            canvas.height =
                                alto;


                            const contexto =
                                canvas.getContext(
                                    "2d"
                                );


                            contexto.drawImage(
                                imagen,
                                0,
                                0,
                                ancho,
                                alto
                            );


                            const resultado =
                                canvas.toDataURL(
                                    "image/jpeg",
                                    0.70
                                );


                            resolve(
                                resultado
                            );

                        };


                    imagen.onerror =
                        reject;

                    imagen.src =
                        e.target.result;

                };


            lector.onerror =
                reject;

            lector.readAsDataURL(
                archivo
            );

        }
    );
}


/* =========================================================
   SELECCIONAR FOTOS
   ========================================================= */

function seleccionarFotos() {

    const input =
        document.getElementById("fotos");


    const archivos =
        Array.from(input.files);


    fotosSeleccionadas =
        fotosSeleccionadas.concat(
            archivos
        );


    mostrarVistaPreviaFotos();


    input.value = "";
}


/* =========================================================
   VISTA PREVIA FOTOS
   ========================================================= */

function mostrarVistaPreviaFotos() {

    const contenedor =
        document.getElementById(
            "vistaPreviaFotos"
        );


    contenedor.innerHTML = "";


    fotosSeleccionadas.forEach(
        (archivo, indice) => {

            const lector =
                new FileReader();


            lector.onload =
                function(e) {

                    const div =
                        document.createElement(
                            "div"
                        );

                    div.className =
                        "foto-preview";


                    const img =
                        document.createElement(
                            "img"
                        );

                    img.src =
                        e.target.result;


                    const boton =
                        document.createElement(
                            "button"
                        );

                    boton.type =
                        "button";

                    boton.className =
                        "boton-eliminar-foto";

                    boton.innerHTML =
                        "🗑️";


                    boton.onclick =
                        function() {

                            eliminarFoto(
                                indice
                            );

                        };


                    div.appendChild(img);

                    div.appendChild(boton);

                    contenedor.appendChild(div);

                };


            lector.readAsDataURL(
                archivo
            );

        }
    );
}


/* =========================================================
   ELIMINAR FOTO
   ========================================================= */

function eliminarFoto(indice) {

    fotosSeleccionadas.splice(
        indice,
        1
    );

    mostrarVistaPreviaFotos();
}


/* =========================================================
   BUSCAR VEHÍCULO
   ========================================================= */

function buscarVehiculo() {

    const patente =
        document
            .getElementById(
                "patenteBuscar"
            )
            .value
            .trim()
            .toUpperCase();


    const resultado =
        document.getElementById(
            "resultadoBusqueda"
        );


    resultado.innerHTML = "";


    if (!patente) {

        resultado.innerHTML =
            '<div class="mensaje">' +
            'Ingresá una patente.' +
            '</div>';

        return;
    }


    const vehiculo =
        vehiculos.find(
            v => v.patente === patente
        );


    if (!vehiculo) {

        resultado.innerHTML =
            '<div class="mensaje">' +
            'No se encontró ningún vehículo con esa patente.' +
            '</div>';

        return;
    }


    patenteVehiculoEditando =
        vehiculo.patente;


    if (
        !Array.isArray(
            vehiculo.historial
        )
    ) {

        if (
            Array.isArray(
                vehiculo.intervenciones
            )
        ) {

            vehiculo.historial =
                vehiculo.intervenciones;

        } else if (
            Array.isArray(
                vehiculo.registros
            )
        ) {

            vehiculo.historial =
                vehiculo.registros;

        } else {

            vehiculo.historial = [];

        }

        guardarDatos();
    }


    const historialOrdenado =
        [...vehiculo.historial].sort(
            (a, b) => {

                const fechaA =
                    new Date(
                        a.fecha || 0
                    );

                const fechaB =
                    new Date(
                        b.fecha || 0
                    );

                return fechaB - fechaA;
            }
        );


    historialActual =
        historialOrdenado;


    let html = "";


    html += `
        <div class="info-vehiculo">

            <h3>
                🚗 ${escaparHTML(
                    vehiculo.patente
                )}
            </h3>

            <p>
                <strong>Marca:</strong>
                ${escaparHTML(
                    vehiculo.marca || "-"
                )}
            </p>

            <p>
                <strong>Modelo:</strong>
                ${escaparHTML(
                    vehiculo.modelo || "-"
                )}
            </p>

            <p>
                <strong>Año:</strong>
                ${escaparHTML(
                    vehiculo.anio || "-"
                )}
            </p>

            <p>
                <strong>Kilometraje:</strong>
                ${escaparHTML(
                    vehiculo.kilometraje || "-"
                )}
            </p>

            <p>
                <strong>Cliente:</strong>
                ${escaparHTML(
                    vehiculo.cliente || "-"
                )}
            </p>

            <p>
                <strong>Teléfono:</strong>
                ${escaparHTML(
                    vehiculo.telefono || "-"
                )}
            </p>

            <button
                class="boton-editar"
                onclick="abrirEdicionVehiculo()"
            >
                ✏️ Editar datos del vehículo
            </button>

        </div>
    `;


    if (
        historialOrdenado.length === 0
    ) {

        html += `
            <div class="mensaje">
                Este vehículo no tiene
                intervenciones registradas.
            </div>
        `;

    } else {

        html += `
            <h3>
                📋 Historial de intervenciones
            </h3>
        `;


        html += `
            <div class="historial-fechas">
        `;


        historialOrdenado.forEach(
            (intervencion, indice) => {

                const tipo =
                    intervencion.tipo ||
                    "Intervención";


                const icono =
                    obtenerIconoTipo(
                        tipo
                    );


                html += `
                    <button
                        class="boton-fecha"
                        onclick="mostrarIntervencion(${indice})"
                    >

                        <span class="fecha-ingreso">

                            ${formatearFecha(
                                intervencion.fecha
                            )}

                        </span>

                        <span class="tipo-ingreso">

                            ${icono}
                            ${escaparHTML(tipo)}

                        </span>

                    </button>
                `;

            }
        );


        html += `
            </div>
        `;


        html += `
            <div
                id="detalleIntervencion"
            ></div>
        `;
    }


    resultado.innerHTML =
        html;
}


/* =========================================================
   ICONOS SEGÚN TIPO
   ========================================================= */

function obtenerIconoTipo(tipo) {

    const texto =
        String(tipo)
            .toLowerCase();


    if (
        texto.includes("service")
    ) {

        return "🔧";

    }


    if (
        texto.includes("repar")
    ) {

        return "🛠️";

    }


    if (
        texto.includes("diagn")
    ) {

        return "🔎";

    }


    return "📋";
}


/* =========================================================
   MOSTRAR INTERVENCIÓN
   ========================================================= */

function mostrarIntervencion(indice) {

    const intervencion =
        historialActual[indice];


    if (!intervencion) {
        return;
    }


    const contenedor =
        document.getElementById(
            "detalleIntervencion"
        );


    const tipo =
        intervencion.tipo ||
        "Intervención";


    const icono =
        obtenerIconoTipo(tipo);


    let html = "";


    html += `
        <div class="detalle-intervencion">

            <h3>

                ${icono}

                ${escaparHTML(tipo)}

            </h3>

            <p>

                <strong>
                    📅 Fecha de ingreso:
                </strong>

                ${formatearFecha(
                    intervencion.fecha
                )}

            </p>

            <p>

                <strong>
                    🚗 Kilometraje:
                </strong>

                ${escaparHTML(
                    intervencion.kilometraje ||
                    "-"
                )}

            </p>

            <p>

                <strong>
                    🔎 Motivo de ingreso:
                </strong>

                <br>

                ${escaparHTML(
                    intervencion.motivo ||
                    "-"
                )}

            </p>

            <p>

                <strong>
                    🔧 Trabajo realizado:
                </strong>

                <br>

                ${escaparHTML(
                    intervencion.trabajo ||
                    "-"
                )}

            </p>

            <p>

                <strong>
                    🔩 Repuestos:
                </strong>

                <br>

                ${escaparHTML(
                    intervencion.repuestos ||
                    "-"
                )}

            </p>

            <p>

                <strong>
                    📝 Observaciones:
                </strong>

                <br>

                ${escaparHTML(
                    intervencion.observaciones ||
                    "-"
                )}

            </p>
    `;


    if (
        Array.isArray(
            intervencion.fotos
        ) &&
        intervencion.fotos.length > 0
    ) {

        html += `
            <p>

                <strong>
                    📷 Fotos:
                </strong>

            </p>

            <div
                class="fotos-guardadas"
            >
        `;


        intervencion.fotos.forEach(
            foto => {

                html += `
                    <img
                        src="${foto}"
                        onclick="abrirFoto(this.src)"
                    >
                `;

            }
        );


        html += `
            </div>
        `;
    }


    html += `
        </div>
    `;


    contenedor.innerHTML =
        html;
}


/* =========================================================
   ABRIR FOTO
   ========================================================= */

function abrirFoto(src) {

    const ventana =
        window.open(
            "",
            "_blank"
        );


    if (!ventana) {

        alert(
            "El navegador bloqueó la ventana de la foto."
        );

        return;
    }


    ventana.document.write(`

        <!DOCTYPE html>

        <html>

        <head>

            <title>
                Foto de intervención
            </title>

            <style>

                body {
                    margin: 0;
                    background: #000;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    min-height: 100vh;
                }

                img {
                    max-width: 100%;
                    max-height: 100vh;
                    object-fit: contain;
                }

            </style>

        </head>

        <body>

            <img src="${src}">

        </body>

        </html>

    `);
}

/* =========================================================
   FORMATEAR FECHA
   ========================================================= */

function formatearFecha(fecha) {

    if (!fecha) {
        return "-";
    }


    const partes =
        fecha.split("-");


    if (
        partes.length === 3
    ) {

        return (
            partes[2] +
            "/" +
            partes[1] +
            "/" +
            partes[0]
        );
    }


    return fecha;
}


/* =========================================================
   ESCAPAR HTML
   ========================================================= */

function escaparHTML(texto) {

    return String(texto)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}
