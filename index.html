<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#000;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh}#b{width:90%;max-width:340px;text-align:center}input{width:100%;padding:14px;margin:7px 0;background:#111;border:1px solid #333;color:#fff;border-radius:12px}button{width:100%;padding:14px;background:#00e5ff;border:0;border-radius:12px;font-weight:900}#a{display:none}</style></head><body>
<div id="b"><img src="logo.png" style="width:100%;max-width:320px" onerror="this.style.display='none'"><p style="color:#555">TALLER</p><input id="u" value="SM-MONTE-"><input id="p" value="Taller.monte1."><button onclick="login()">ENTRAR</button><p id="m" style="color:red"></p><p style="color:#555;font-size:11px">Si queda negro toca aca: <a href="#" onclick="localStorage.clear();location.reload()" style="color:#00e5ff">borrar</a></p></div>
<div id="a"><h2 style="color:#00e5ff">Taller OK - Entraste</h2><p>Si ves esto el login anda.</p><button onclick="localStorage.clear();location.reload()">Salir</button></div>
<script>
function login(){
var u=document.getElementById("u").value.trim();
var p=document.getElementById("p").value.trim();
if(u=="SM-MONTE-" && p=="Taller.monte1."){
localStorage.setItem("auth","1");
document.getElementById("b").style.display="none";
document.getElementById("a").style.display="block";
}else{
document.getElementById("m").innerText="Mal. Copia: SM-MONTE- / Taller.monte1.";
}
}
if(localStorage.getItem("auth")=="1"){
document.getElementById("b").style.display="none";
document.getElementById("a").style.display="block";
}
</script></body></html>
