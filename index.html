<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SM MONTENEGRO - Taller</title>
<style>
*{box-sizing:border-box;font-family:system-ui,Arial}body{margin:0;background:#050505;color:#fff;min-height:100vh}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.logo-img{width:92%;max-width:360px;height:auto;filter:drop-shadow(0 0 20px rgba(0,229,255,.45))}
.sub{color:#555;font-size:10px;letter-spacing:5px;margin:10px 0 32px}
input,select,textarea{width:100%;background:#121212;border:1px solid #2a2a2a;color:#fff;padding:13px 14px;border-radius:12px;font-size:15px;margin:6px 0;outline:none}
.btn{background:#00e5ff;color:#000;border:0;padding:14px;border-radius:12px;font-weight:800;width:100%;cursor:pointer;font-size:16px}
.btn-small{background:#111;border:1px solid #00e5ff;color:#00e5ff;padding:8px 10px;border-radius:10px;font-size:12px;cursor:pointer}
.msg{color:#ff5a5a;text-align:center;font-size:13px;margin-top:10px;min-height:18px}
#app{display:none;max-width:760px;margin:0 auto;padding:14px 14px 90px}
.topbar{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#050505;z-index:10;padding:10px 0;border-bottom:1px solid #111}
.top-logo{height:44px;width:auto}
.card{background:#101010;border:1px solid #1e1e1e;border-radius:16px;padding:14px;margin:12px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.del{background:#1c0a0a;border:1px solid #ff2a2a;color:#ff8a8a;padding:8px 12px;border-radius:10px;font-size:13px;cursor:pointer}
.back{background:#111;border:1px solid #333;color:#aaa;padding:8px 12px;border-radius:10px;font-size:13px;cursor:pointer}
.add{background:#081a1a;border:1px solid #00e5ff;color:#00e5ff;padding:10px 12px;border-radius:10px;width:100%;cursor:pointer;font-weight:700}
.vehicle-btn{background:#0e0e0e;border:1px solid #222;border-radius:14px;padding:12px 14px;margin:8px 0;cursor:pointer;display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;color:#fff}
.vehicle-btn b{color:#00e5ff}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.thumb{width:76px;height:76px;border-radius:10px;object-fit:cover;border:1px solid #333}
.thumb-wrap{position:relative;display:inline-block}.thumb-del{position:absolute;top:-6px;right:-6px;background:#ff2a2a;color:#fff;border:0;width:22px;height:22px;border-radius:50%}
.small{color:#888;font-size:12px}
.tab{background:#0e0e0e;border:1px solid #222;border-radius:12px;padding:11px 12px;margin:6px 0;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.tab b{color:#00e5ff;font-size:13px}.tab.active{border-color:#00e5ff;background:#0f1f22}
.detail{background:#0c0c0c;border:1px dashed #222;border-radius:12px;padding:10px;margin:0 0 10px;display:none}
.detail.open{display:block}
.detail p{margin:5px 0;font-size:13px}
.detail img{width:80px;height:80px;object-fit:cover;border-radius:8px;margin:4px;border:1px solid #333}
.view{display:none}.view.active{display:block}
</style></head><body>
<div id="login" class="center">
<img class="logo-img" src="logo.png" alt="SM MONTENEGRO">
<div class="sub">TALLER AUTOS - PRIVADO</div>
<form onsubmit="return false" style="width:100%;max-width:340px" autocomplete="on">
<input id="u" type="text" autocomplete="username" placeholder="Usuario">
<input id="p" type="password" autocomplete="current-password" placeholder="Contraseña">
<button class="btn" onclick="login()">ENTRAR
