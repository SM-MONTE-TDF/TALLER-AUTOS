<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM MONTE</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyAv8rwDuULswvkQFOONHvukHszaVStXqdM",
  authDomain: "taller-monte.firebaseapp.com",
  projectId: "taller-monte",
  storageBucket: "taller-monte.firebasestorage.app",
  messagingSenderId: "15271199147",
  appId: "1:15271199147:web:6a603d8999d2a3ec8212ee",
  measurementId: "G-4V116R79NG"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const q = query(collection(db, "pedidos"), orderBy("fecha", "desc"));
window.onload = () => {
  const lista = document.getElementById('lista');
  onSnapshot(q, (snap) => {
    lista.innerHTML = "";
    if(snap.empty) lista.innerHTML = "<p class='text-zinc-600 text-center py-6 text-sm'>No hay pedidos todavía</p>";
    snap.forEach(d => {
      const p = d.data();
      lista.innerHTML += `<div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl flex justify-between items-center mb-3">
      <div><p class="font-bold text-white">${p.cliente} - ${p.patente}</p><p class="text-sm text-zinc-400">${p.trabajo || ''} ${p.precio? '| $'+p.precio : ''}</p><span class="text-[10px] px-2 py-1 rounded bg-yellow-500/20 text-yellow-400">${p.estado}</span></div>
      <button onclick="borrar('${d.id}')" class="text-red-400 text-xs border border-red-900/50 px-3 py-1 rounded-lg">Borrar</button></div>`;
    });
  });
}
window.guardar = async () => {
  const cliente = document.getElementById('cliente').value.trim();
  const patente = document.getElementById('patente').value.trim();
  const trabajo = document.getElementById('trabajo').value.trim();
  const precio = document.getElementById('precio').value.trim();
  if(!cliente ||!patente) return alert('Falta cliente o patente');
  await addDoc(collection(db, "pedidos"), { cliente, patente, trabajo, precio, estado: 'Pendiente', fecha: Date.now() });
  document.getElementById('cliente').value='';document.getElementById('patente').value='';document.getElementById('trabajo').value='';document.getElementById('precio').value='';
}
window.borrar = async (id) => { if(confirm('¿Borrar?')) await deleteDoc(doc(db, "pedidos", id)); }
</script>
</head>
<body class="bg-black text-white min-h-screen p-4">
<div class="max-w-md mx-auto">
<img src="./ff2ace8e-276f-47cf-8eb8-9f8eedf27a89.jpeg" onerror="this.style.display='none';document.getElementById('txtLogo').style.display='block'" class="w-full rounded-2xl mb-5 border border-zinc-800">
<h1 id="txtLogo" style="display:none" class="text-2xl font-black text-center py-6 tracking-widest">SM MONTE</h1>
<div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 mb-6">
<input id="cliente" placeholder="Cliente" class="w-full bg-black border border-zinc-800 rounded-xl p-3 mb-2 text-white outline-none">
<input id="patente" placeholder="PATENTE" class="w-full bg-black border border-zinc-800 rounded-xl p-3 mb-2 text-white uppercase outline-none">
<input id="trabajo" placeholder="Trabajo a realizar" class="w-full bg-black border border-zinc-800 rounded-xl p-3 mb-2 text-white outline-none">
<input id="precio" placeholder="Precio" type="number" class="w-full bg-black border border-zinc-800 rounded-xl p-3 mb-4 text-white outline-none">
<button onclick="guardar()" class="w-full bg-white text-black font-black rounded-xl p-3.5 tracking-wide">GUARDAR PEDIDO</button>
</div>
<div id="lista"></div>
<p class="text-center text-[10px] text-zinc-600 mt-8">Firebase: taller-monte ✓</p>
</div>
</body>
</html>
