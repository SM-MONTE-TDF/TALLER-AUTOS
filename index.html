<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff}.hidden{display:none!important}.wrap{max-width:480px;margin:auto;padding:14px 14px 90px}.btn{width:100%;padding:16px;border:0;border-radius:12px;font-weight:900;margin:8px 0;cursor:pointer}.btn-blue{background:#00c8ff;color:#000}.btn-dark{background:#1a1a1a;color:#fff;border:1px solid #333}#login{position:fixed;inset:0;background:#000;z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}.box{width:100%;max-width:360px;text-align:center}input,textarea,select{width:100%;padding:14px;margin:8px 0;background:#111;border:1px solid #333;border-radius:10px;color:#fff}.card{background:#111;border:1px solid #222;border-radius:12px;padding:14px;margin:10px 0;border-left:4px solid #00c8ff}.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img{width:70px;height:70px;object-fit:cover;border-radius:8px}#imgM{position:fixed;inset:0;background:#000000f2;z-index:9999;display:flex;align-items:center;justify-content:center}#imgM.hidden{display:none!important}#imgM img{max-width:95%;max-height:90vh}</style></head><body>
<div id="imgM" class="hidden" onclick="this.classList.add('hidden')"><img id="imgB"></div>
<div id="login"><div class="box"><img src="./ff2ace8e-276f-47cf-8eb8-9f8eedf27a89.jpeg" style="width:100%;border-radius:14px;margin-bottom:16px"><p style="color:#333;font-size:11px;margin-bottom:20px">ACCESO PRIVADO</p><input id="user" placeholder="Usuario"><input id="pass" type="password" placeholder="Contraseña"><button class="btn btn-blue" onclick="doLogin()">Entrar</button><p id="err" style="color:#f55;display:none">Datos incorrectos</p></div></div>
<div id="app" class="hidden"><div class="wrap"><img src="./ff2ace8e-276f-47cf-8eb8-9f8eedf27a89.jpeg" style="width:100%;border-radius:14px;margin-bottom:14px"><button class="btn btn-blue" onclick="S('buscar')">🔍 Buscar</button><button class="btn btn-blue" onclick="S('nuevoV')">🚗 Nuevo vehículo</button><button class="btn btn-blue" onclick="S('nuevaI')">🛠️ Nueva intervención</button><button class="btn btn-dark" onclick="S('ajustes')">⚙️ Ajustes / Exportar</button><button class="btn" style="background:#1a1a1a;color:#fff;border:1px solid #333" onclick="location.reload()">Cerrar sesión</button><hr style="margin:14px 0;border:0;border-top:1px solid #222">
<div id="sec-buscar"><input id="q" placeholder="Buscar patente..." oninput="buscar()"><div id="r"></div></div>
<div id="sec-nuevoV" class="hidden"><h3>🚗 Nuevo vehículo</h3><input id="vPat" placeholder="PATENTE"><input id="vMar" placeholder="Marca"><input id="vCli" placeholder="Cliente"><button class="btn btn-blue" onclick="saveV()">Guardar</button></div>
<div id="sec-nuevaI" class="hidden"><h3>🛠️ Nueva intervención</h3><select id="iMot"><option value="">1. Motivo</option><option>Diagnostico</option><option>Servicio</option><option>Reparacion</option></select><input id="iFec" type="date"><input id="iPat" placeholder="3. Patente"><textarea id="iDiag" placeholder="4. Diagnóstico"></textarea><textarea id="iTra" placeholder="5. Trabajo realizado"></textarea><input type="file" accept="image/*" multiple onchange="addF(this.files)"><div id="prev" class="thumbs" style="margin-top:10px"></div><button class="btn btn-blue" onclick="saveI()">💾 Guardar con fotos</button></div>
<div id="sec-ajustes" class="hidden"><h3>⚙️ Ajustes</h3><div class="card">Usuario: <span id="uA"></span><br><span id="total"></span> vehículos</div><button class="btn btn-blue" onclick="exportar()">📤 Exportar para pasar a la compu</button><input type="file" id="imp" style="display:none" onchange="importar(this)"><button class="btn btn-dark" onclick="document.getElementById('imp').click()">📥 Importar desde compu/celu</button><p style="color:#666;font-size:12px;margin-top:10px">Tocá Exportar > te baja un archivo. Mandalo por WhatsApp a tu compu y en la compu tocá Importar y elegí ese archivo. Listo, ves todo.</p><button class="btn btn-dark" onclick="S('buscar')">⬅ Volver</button></div>
</div></div>
<script>
localStorage.setItem('sm_user','SM-MONTE-');localStorage.setItem('sm_pass','Taller.monte1.');
let V=JSON.parse(localStorage.getItem('sm_vehiculos')||'[]'),I=JSON.parse(localStorage.getItem('sm_interv')||'[]'),FT=[];
function SV(){localStorage.setItem('sm_vehiculos',JSON.stringify(V));localStorage.setItem('sm_interv',JSON.stringify(I));}
function doLogin(){let u=document.getElementById('user').value.trim(),p=document.getElementById('pass').value;if(u===localStorage.getItem('sm_user')&&p===localStorage.getItem('sm_pass')){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');buscar()}else document.getElementById('err').style.display='block'}
function S(id){document.querySelectorAll('[id^=sec-]').forEach(e=>e.classList.add('hidden'));document.getElementById('sec-'+id).classList.remove('hidden');if(id=='buscar')buscar();if(id=='ajustes'){document.getElementById('uA').innerText=localStorage.getItem('sm_user');document.getElementById('total').innerText=V.length}}
function addF(f){for(let x of f){let r=new FileReader();r.onload=e=>{FT.push(e.target.result);RP()};r.readAsDataURL(x)}}function RP(){document.getElementById('prev').innerHTML=FT.map(s=>'<img src="'+s+'" onclick="document.getElementById(\'imgB\').src=this.src;document.getElementById(\'imgM\').classList.remove(\'hidden\')">').join('')}
function buscar(){let q=(document.getElementById('q').value||'').toLowerCase(),f=q?V.filter(v=>v.patente.toLowerCase().includes(q)):V;document.getElementById('r').innerHTML=f.map(v=>'<div class=card onclick="ver(\''+v.patente+'\')"><b>'+v.patente+'</b> '+v.marca+'</div>').join('')||'<p style=color:#555>Sin datos</p>'}
function ver(p){let ins=I.filter(i=>i.patente==p);document.getElementById('r').innerHTML='<div class=card><b>'+p+'</b><button class=btn style=background:#222;color:#fff;margin-top:8px" onclick="document.getElementById(\'iPat\').value=\''+p+'\';S(\'nuevaI\')">+ Intervención</button></div>'+ins.map(i=>'<div class=card><b>'+i.motivo+'</b> '+i.fecha+'<br>'+i.diagnostico+'<br><b>'+i.trabajo+'</b>'+(i.fotos?'<div class=thumbs>'+i.fotos.map(f=>'<img src="'+f+'" onclick="document.getElementById(\'imgB\').src=this.src;document.getElementById(\'imgM\').classList.remove(\'hidden\')">').join('')+'</div>':'')+'</div>').join('')}
function saveV(){let p=document.getElementById('vPat').value.toUpperCase().trim();if(!p)return alert('Patente');V.unshift({patente:p,marca:document.getElementById('vMar').value,cliente:document.getElementById('vCli').value});SV();S('buscar');buscar()}
function saveI(){let m=document.getElementById('iMot').value,f=document.getElementById('iFec').value,p=document.getElementById('iPat').value.toUpperCase().trim(),d=document.getElementById('iDiag').value,t=document.getElementById('iTra').value;if(!m||!f||!p||!d||!t)return alert('Completa los 5 campos');I.unshift({motivo:m,fecha:f,patente:p,diagnostico:d,trabajo:t,fotos:[...FT]});SV();FT=[];RP();alert('Guardado');S('buscar');document.getElementById('q').value=p;buscar()}
function exportar(){let data=JSON.stringify({vehiculos:V,intervenciones:I});let b=new Blob([data],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='SM-MONTENEGRO-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function importar(inp){let f=inp.files[0];let r=new FileReader();r.onload=e=>{let d=JSON.parse(e.target.result);if(d.vehiculos){V=d.vehiculos;I=d.intervenciones||[];SV();alert('Importado! '+V.length+' vehiculos');S('buscar');buscar()}};r.readAsText(f)}
document.getElementById('iFec').valueAsDate=new Date();
</script></body></html>
