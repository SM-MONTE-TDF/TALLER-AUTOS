<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gestión Taller</title>



  <style>

    body {

      font-family: Arial, sans-serif;

      background: #f2f2f2;

      margin: 0;

      padding: 20px;

    }



    .contenedor {

      max-width: 900px;

      margin: auto;

    }



    h1 {

      text-align: center;

    }



    .tarjeta {

      background: white;

      padding: 20px;

      margin-top: 20px;

      border-radius: 10px;

      box-shadow: 0 2px 8px rgba(0,0,0,0.1);

    }



    input, select, textarea, button {

      width: 100%;

      box-sizing: border-box;

      padding: 12px;

      margin: 6px 0;

      font-size: 16px;

      border-radius: 6px;

      border: 1px solid #ccc;

    }



    textarea {

      min-height: 90px;

      resize: vertical;

    }



    button {

      background: #222;

      color: white;

      border: none;

      cursor: pointer;

    }



    button:hover {

      background: #444;

    }



    .datos-vehiculo {

      background: #f8f8f8;

      padding: 15px;

      margin-top: 15px;

      border-radius: 8px;

    }



    .historial {

      border-top: 1px solid #ddd;

      margin-top: 15px;

      padding-top: 15px;

    }



    .registro {

      background: white;

      border: 1px solid #ddd;

      padding: 15px;

      margin-top: 10px;

      border-radius: 8px;

    }



    .dato {

      margin: 8px 0;

    }

  </style>

</head>



<body>



<div class="contenedor">



  <h1>🔧 Gestión Taller</h1>



  <div class="tarjeta">



    <h2>🔎 Buscar vehículo</h2>



    <input

      type="text"

      id="patenteBuscar"

      placeholder="Ingresá la patente"

    >



    <button onclick="buscarVehiculo()">

      Buscar vehículo

    </button>



  </div>





  <div class="tarjeta">



    <h2>🚗 Nuevo vehículo</h2>



    <input type="text" id="patente" placeholder="Patente">

    <input type="text" id="marca" placeholder="Marca">

    <input type="text" id="modelo" placeholder="Modelo">

    <input type="number" id="anio" placeholder="Año">

    <input type="number" id="kilometraje" placeholder="Kilometraje">

    <input type="text" id="cliente" placeholder="Nombre del cliente">

    <input type="tel" id="telefono" placeholder="Teléfono">



    <button onclick="agregarVehiculo()">

      ➕ Agregar vehículo

    </button>



  </div>





  <div class="tarjeta">



    <h2>🛠️ Nueva intervención</h2>



    <input

      type="text"

      id="patenteIntervencion"

      placeholder="Patente del vehículo"

    >



    <input

      type="date"

      id="fecha"

    >



    <select id="tipo">

      <option value="">Seleccioná el tipo</option>

      <option value="Servicio">Servicio</option>

      <option value="Reparación">Reparación</option>

      <option value="Diagnóstico">Diagnóstico</option>

    </select>



    <input

      type="number"

      id="kmIntervencion"

      placeholder="Kilometraje"

    >



    <input

      type="text"

      id="motivo"

      placeholder="Motivo de ingreso"

    >
