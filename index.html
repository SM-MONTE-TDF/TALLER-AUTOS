<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM MONTENEGRO</title><style>*{box-sizing:border-box;font-family:system-ui,Arial}body{margin:0;background:#050505;color:#fff;min-height:100vh}#login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}#login img{width:92%;max-width:360px}#sub{color:#555;font-size:10px;letter-spacing:4px;margin:10px 0 28px}input,select,textarea{width:100%;background:#121212;border:1px solid #2a2a2a;color:#fff;padding:13px;border-radius:12px;font-size:15px;margin:6px 0}button{cursor:pointer}.btn{background:#00e5ff;color:#000;border:0;padding:14px;border-radius:12px;font-weight:900;width:100%}#app{display:none;max-width:760px;margin:0 auto;padding:12px}.topbar{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#050505;padding:10px 0;border-bottom:1px solid #111;z-index:10}.top-logo{height:38px}.card{background:#101010;border:1px solid #1e1e1e;border-radius:14px;padding:14px;margin:10px 0}.vehicle-btn{background:#0e0e0e;border:1px solid #222;border-radius:12px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;width:100%;color:#fff;text-align:left}.vehicle-btn b{color:#00e5ff}.small{color:#888;font-size:12px}.view{display:none}.view.active{display:block}.del{background:#1c0a0a;border:1px solid #ff2a2a;color:#ff8a8a;padding:8px 10px;border-radius:8px}.back{background:#111;border:1px solid #333;color:#aaa;padding:8px 10px;border-radius:8px}.add{background:#00e5ff;color:#000;border:0;padding:11px;border-radius:10px;width:100%;font-weight:800}.thumbs{display:flex;gap:6px;flex-wrap:wrap}.thumb{width:70px;height:70px;border-radius:8px;object-fit:cover;border:1px solid #333}</style></head><body>
<div id="login"><img src="logo.png" onerror="this.style.display='none'"><div id="sub">TALLER AUTOS - PRIVADO</div><div style="width:100%;max-width:340px"><input id="u" value="SM-MONTE-"><input id="p" type="password" value="Taller.monte1."><button class="btn" type="button" onclick="doLogin()">ENTRAR</button><div id="msg" style="color:#ff5555;text-align:center;margin-top:10px"></div></div></div>
<div id="app"><div class="topbar"><img class="top-logo" src="logo.png" onerror="this.style.display='none'"><div style="display:flex;gap:6px"><button onclick="exportar()" style="background:#111;border:1px solid #00e5ff;color:#00e5ff;padding:7px 10px;border-radius:8px;font-size:12px">Backup</button><button class="del" onclick="salir()">Salir</button></div></div>
<div id="view-lista" class="view active"><div class="card"><h3 style="color:#00e5ff;margin:0 0 10px">Nuevo vehículo</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input type="date" id="v_fecha"><input id="v_pat" placeholder="PATENTE *" style="text-transform:uppercase"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="v_marca" placeholder="Marca"><input id="v_modelo" placeholder="Modelo"></div><input id="v_titular" placeholder="Titular"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="v_tel" placeholder="Tel"><input id="v_contacto" placeholder="Contacto"></div><button class="add" onclick="addVeh()">+ Guardar vehículo</button><div id="saveMsg" class="small" style="color:#00e5ff"></div></div><input id="busq" placeholder="🔍 Buscar..." oninput="renderLista()"><div id="listaVeh"></div></div>
<div id="view-detalle" class="view"><button class="back" onclick="volverLista()">← Volver</button><div id="detalleVeh" class="card" style="margin-top:12px"></div><div class="card"><h4 style="color:#00e5ff;margin:0 0 8px">+ Intervención</h4><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input type="date" id="i_fecha"><input id="i_pat" placeholder="Patente"></div><textarea id="i_diag" placeholder="Diagnóstico / Trabajo" rows="2"></textarea><textarea id="i_rep" placeholder="Repuestos / Costos" rows="2"></textarea><input type="file" id="i_fotos" accept="image/*" multiple><button class="add" onclick="addInter()">+ Guardar intervención</button></div><div id="historial"></div></div></div>
<script>
const USER_OK="SM-MONTE-";const PASS_OK="Taller.monte1.";const LS="sm_montenegro_final";
let data=[];try{data=JSON.parse(localStorage.getItem(LS)||"[]")}catch(e){}let sel=-1;
function today(){return new Date().toISOString().slice(0,10)}
document.getElementById('v_fecha').value=today();document.getElementById('i_fecha').value=today();
function doLogin(){let u=document.getElementById('u').value.trim();let p=document.getElementById('p').value;if(u===USER_OK&&p===PASS_OK){localStorage.setItem("auth","1");showApp();}else{document.getElementById('msg').innerText="Clave mal";}}
function salir(){localStorage.removeItem("auth");location.reload();}
function showApp(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';renderLista();}
function save(){localStorage.setItem(LS,JSON.stringify(data));let m=document.getElementById('saveMsg');if(m){m.innerText="✓ Guardado";setTimeout(()=>m.innerText="",1500);}renderLista();if(sel>=0)renderDet();}
function addVeh(){let pat=document.getElementById('v_pat').value.toUpperCase().trim();if(!pat)return alert("Patente obligatoria");let o={id:Date.now(),fecha:document.getElementById('v_fecha').value||today(),patente:pat,marca:document.getElementById('v_marca').value.trim(),modelo:document.getElementById('v_modelo').value.trim(),titular:document.getElementById('v_titular').value.trim(),telefono:document.getElementById('v_tel').value.trim(),contacto:document.getElementById('v_contacto').value.trim(),intervenciones:[]};data.unshift(o);["v_pat","v_marca","v_modelo","v_titular","v_tel","v_contacto"].forEach(i=>{document.getElementById(i).value="";});document.getElementById('v_fecha').value=today();save();}
function renderLista(){let q=(document.getElementById('busq').value||"").toLowerCase();let c=document.getElementById('listaVeh');c.innerHTML="";let f=data.filter(v=>(v.patente+" "+v.titular+" "+v.marca).toLowerCase().includes(q));if(!f.length){c.innerHTML='<div class="small" style="text-align:center;padding:20px">Sin vehículos</div>';return;}f.forEach(v=>{let idx=data.indexOf(v);let b=document.createElement('button');b.className='vehicle-btn';b.innerHTML='<div><b>'+v.patente+'</b><div class="small">'+v.marca+' '+v.modelo+' • '+v.titular+'</div></div><span style="color:#00e5ff">›</span>';b.onclick=()=>abrir(idx);c.appendChild(b);});}
function abrir(i){sel=i;document.getElementById('view-lista').classList.remove('active');document.getElementById('view-detalle').classList.add('active');renderDet();}
function volverLista(){sel=-1;document.getElementById('view-detalle').classList.remove('active');document.getElementById('view-lista').classList.add('active');renderLista();}
function renderDet(){if(sel<0)return;let v=data[sel];document.getElementById('detalleVeh').innerHTML='<div style="display:flex;justify-content:space-between"><div><b style="color:#00e5ff;font-size:18px">'+v.patente+'</b><div class="small">'+v.fecha+' • '+v.marca+' '+v.modelo+'</div><div class="small">Titular: '+v.titular+'<br>Tel: '+v.telefono+'</div></div><button class="del" onclick="delVeh()">Borrar</button></div>';let h=document.getElementById('historial');if(!v.intervenciones.length){h.innerHTML='<div class="small" style="text-align:center;padding:15px">Sin intervenciones</div>';return;}h.innerHTML=v.intervenciones.slice().reverse().map((it,i)=>'<div class="card"><div style="display:flex;justify-content:space-between"><b style="color:#00e5ff">'+it.fecha+' - '+it.patente+'</b><button class="del" onclick="delInter('+ (v.intervenciones.length-1-i) +')">x</button></div><div class="small">'+(it.diagnostico||'')+'</div><div class="small">'+(it.repuestos||'')+'</div>'+(it.fotos&&it.fotos.length?'<div class="thumbs">'+it.fotos.map(f=>'<img class="thumb" src="'+f+'">').join('')+'</div>':'')+'</div>').join('');}
async function addInter(){if(sel<0)return;let v=data[sel];let files=document.getElementById('i_fotos').files;let fotos=[];for(let f of files){fotos.push(await toBase64(f));}let it={id:Date.now(),fecha:document.getElementById('i_fecha').value||today(),patente:document.getElementById('i_pat').value||v.patente,diagnostico:document.getElementById('i_diag').value,repuestos:document.getElementById('i_rep').value,fotos:fotos};v.intervenciones.push(it);document.getElementById('i_diag').value="";document.getElementById('i_rep').value="";document.getElementById('i_fotos').value="";save();}
function toBase64(file){return new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file);});}
function delVeh(){if(confirm("Borrar?")){data.splice(sel,1);sel=-1;save();volverLista();}}
function delInter(i){if(confirm("Borrar intervención?")){data[sel].intervenciones.splice(i,1);save();}}
function exportar(){let b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});let u=URL.createObjectURL(b);let a=document.createElement('a');a.href=u;a.download='backup-'+today()+'.json';a.click();}
if(localStorage.getItem("auth")==="1")showApp();
</script></body></html>
