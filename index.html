<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Taller Mecánico</title>
<style>*{box-sizing:border-box}body{margin:0;padding:20px;font-family:Arial;background:#f2f2f2}.contenedor{max-width:800px;margin:auto}.tarjeta{background:white;padding:20px;border-radius:12px;margin-bottom:20px}button{width:100%;padding:14px;margin-top:10px;border:none;border-radius:8px;background:#222;color:white;cursor:pointer}input{width:100%;padding:12px;margin:6px 0 15px;border:1px solid #ccc;border-radius:7px}.oculto{display:none!important}.error{background:#f8d7da;color:#842029;padding:15px;border-radius:8px;margin-top:15px}.ok{background:#eee;padding:15px;border-radius:8px;margin-top:15px}</style>
</head>
<body>
<div id="login" class="contenedor"><div class="tarjeta"><h1>🔧 Taller Mecánico</h1><h2>Iniciar sesión</h2><input type="email" id="email" placeholder="Email" value="maxi_boca46@hotmail.com"><input type="password" id="pass" placeholder="Contraseña"><button id="btnLogin">Ingresar</button><div id="msg"></div></div></div>
<div id="sistema" class="contenedor oculto"><div class="tarjeta"><h1>✅ Entraste bien!</h1><p>El login ya funciona. Ahora seguimos con el taller.</p><button id="btnLogout">Cerrar sesión</button></div></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const supabase = createClient("https://sljknzpyxmpfnkcaoksu.supabase.co","sb_publishable_3oidhuHVin61bwlZBTW41w_fuF_rqPI");
const $ = id => document.getElementById(id);
$("btnLogin").addEventListener("click", async () => {
  const email = $("email").value.trim(); const password = $("pass").value;
  $("msg").innerHTML = '<div class="ok">⏳ Verificando...</div>';
  const { data, error } = await supabase.auth.signInWithPassword({email, password});
  if(error){ $("msg").innerHTML = `<div class="error">❌ ${error.message}</div>`; console.error(error); return; }
  $("login").classList.add("oculto"); $("sistema").classList.remove("oculto");
});
$("btnLogout").addEventListener("click", async () => { await supabase.auth.signOut(); location.reload(); });
const { data: { session } } = await supabase.auth.getSession();
if(session){ $("login").classList.add("oculto"); $("sistema").classList.remove("oculto"); }
</script>
</body>
</html>
