<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM MONTE - Taller</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAv8rwDuULswvkQFOONHvukHszaVStXqdM",
  authDomain: "taller-monte.firebaseapp.com",
  projectId: "taller-monte",
  storageBucket: "taller-monte.firebasestorage.app",
  messagingSenderId: "15271199147",
  appId: "1:15271199147:web:6a603d8999d2a3ec8212ee",
  measurementId: "G-4V116R79NG"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const q = query(collection(db, "pedidos"), orderBy("fecha", "desc"));

const lista = document.getElementById('lista');
onSnapshot(q, (snap) => {
  lista.innerHTML = "";
  snap.forEach(d => {
    const p = d.data();
    lista.innerHTML += `<div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl flex justify-between items-center mb-3">
      <div><p class="font-bold text-white">${p.cliente} - ${p.patente}</p><p class="text-sm text-zinc-400">${p.trabajo} | $${p.precio}</p><span class="text-xs px-2 py-1 rounded bg-yellow-500/20 text-yellow-400">${p.estado}</span></div>
      <button onclick="borrar('${d.id}')" class="text-red-400 text-sm">Borrar</button></div>`;
  });
});

window.guardar = async () => {
  const cliente = document.getElementById('cliente').value;
  const patente = document.getElementById('patente').value;
  const trabajo = document.getElementById('trabajo').value;
  const precio = document.getElementById('precio').value;
  if(!cliente || !patente) return alert('Falta cliente o patente');
  await addDoc(collection(db, "pedidos"), { cliente, patente, trabajo, precio, estado: 'Pendiente', fecha: Date.now() });
  document.getElementById('cliente').value='';document.getElementById('patente').value='';document.getElementById('trabajo').value='';document.getElementById('precio').value='';
}
window.borrar = async (id) => { if(confirm('Borrar?')) await deleteDoc(doc(db, "pedidos", id)); }
</script>
</head>
<body class="bg-black text-white min-h-screen p-4 font-sans">
<div class="max-w-md mx-auto">
<h1 class="text-2xl font-black text-center py-6 tracking-widest">SM MONTE</h1>
<div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 mb-6">
<input id="cliente" placeholder="Cliente" class="w-full bg-black border border-zinc-800 rounded-xl p-3 mb-2 text-white">
<input id="patente" placeholder="Patente" class="w-full bg-black border border-zinc-800 rounded-xl p-3 mb-2 text-white uppercase">
<input id="trabajo" placeholder="Trabajo a realizar" class="w-full bg-black border border-zinc-800 rounded-xl p-3 mb-2 text-white">
<input id="precio" placeholder="Precio" type="number" class="w-full bg-black border border-zinc-800 rounded-xl p-3 mb-4 text-white">
<button onclick="guardar()" class="w-full bg-white text-black font-bold rounded-xl p-3">GUARDAR PEDIDO</button>
</div>
<div id="lista"></div>
<p class="text-center text-xs text-zinc-600 mt-8">Conectado a Firebase: taller-monte</p>
</div>
</body>
</html>
