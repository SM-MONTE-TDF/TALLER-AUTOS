<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taller Mecánico</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;font-family:Arial;background:#f2f2f2}
.contenedor{max-width:800px;margin:auto}.tarjeta{background:#fff;padding:20px;margin-bottom:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
button{width:100%;padding:14px;margin-top:10px;border:none;border-radius:8px;background:#222;color:#fff;font-size:16px;cursor:pointer}input,select,textarea{width:100%;padding:12px;margin:6px 0 15px;border:1px solid #ccc;border-radius:7px}
.oculto{display:none!important}.boton-recuperar{background:#0066cc}.boton-secundario{background:#777}.boton-cerrar{background:#a00000}
.info-vehiculo{background:#f5f5f5;padding:15px;border-radius:8px}.detalle-intervencion{background:#f7f7f7;padding:12px;border-radius:8px;margin-top:10px}
</style>
</head>
<body>
<div id="pantallaLogin" class="contenedor"><div class="tarjeta"><h1>🔧 Taller Mecánico</h1><h2>🔐 Entrar</h2>
<label>Email</label><input id="loginEmail" value="maxi_boca46@hotmail.com"><label>Contraseña</label><input type="password" id="loginPassword" placeholder="La de Supabase">
<button id="btnLogin">🔐 Ingresar</button><div id="mensajeLogin" style="margin-top:10px;white-space:pre-wrap;font-weight:bold"></div></div></div>

<div id="sistema" class="contenedor oculto">
<h1>🔧 Taller Mecánico</h1>
<div id="menuPrincipal" class="tarjeta">
<button id="btnMenuBuscar">🔎 Buscar vehículo</button>
<button id="btnMenuNuevoVeh">🚗 Nuevo vehículo</button>
<button id="btnMenuNuevaInterv">🛠️ Nueva intervención</button>
<button id="btnRecuperar" class="boton-recuperar">♻️ Recuperar vehículos viejos (usar 1 sola vez)</button>
<button class="boton-cerrar" id="btnCerrarSesion">🔒 Cerrar sesión</button>
<div id="estadoRecupero" style="margin-top:15px;font-weight:bold"></div>
</div>
<div id="buscar" class="tarjeta oculto"><h2>🔎 Buscar</h2><input id="patenteBuscar" placeholder="AB123CD"><button id="btnBuscarAhora">🔎 Buscar</button><div id="resultadoBusqueda"></div><button class="boton-secundario" id="btnVolverBuscar">← Volver</button></div>
<div id="nuevoVehiculo" class="tarjeta oculto"><h2>🚗 Nuevo vehículo</h2><input id="patente" placeholder="Patente"><input id="marca" placeholder="Marca"><input id="modelo" placeholder="Modelo"><input id="anio" type="number" placeholder="Año"><input id="kilometraje" type="number" placeholder="Km"><input id="cliente" placeholder="Cliente"><input id="telefono" placeholder="Tel"><button id="btnGuardarVeh">💾 Guardar</button><button class="boton-secundario" id="btnVolverNuevoVeh">← Volver</button></div>
<div id="nuevaIntervencion" class="tarjeta oculto"><h2>🛠️ Nueva intervención</h2><input id="patenteIntervencion" placeholder="Patente"><input type="date" id="fecha"><select id="tipo"><option>Service</option><option>Reparación</option><option>Diagnóstico</option><option>Otro</option></select><textarea id="motivo" placeholder="Motivo"></textarea><textarea id="trabajo" placeholder="Trabajo"></textarea><button id="btnGuardarInterv">💾 Guardar intervención</button><button class="boton-secundario" id="btnVolverInterv">← Volver</button></div>
</div>

<script>
const URL_SUPA="https://sljknzpyxmpfnkcaoksu.supabase.co";
const KEY="sb_publishable_3oidhuHVin61bwlZBTW41w_fuF_rqPI";
let TOKEN=localStorage.getItem("token"); let UID=localStorage.getItem("uid");
const $=id=>document.getElementById(id);
const esc=t=>String(t||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const headers=()=>({"apikey":KEY,"Authorization":"Bearer "+TOKEN,"Content-Type":"application/json"});
function mostrar(id){["menuPrincipal","buscar","nuevoVehiculo","nuevaIntervencion"].forEach(s=>$(s).classList.add("oculto"));$(id).classList.remove("oculto");}
function volver(){["buscar","nuevoVehiculo","nuevaIntervencion"].forEach(s=>$(s).classList.add("oculto"));$("menuPrincipal").classList.remove("oculto");}
function checkLogin(){ if(TOKEN && UID){ $("pantallaLogin").classList.add("oculto"); $("sistema").classList.remove("oculto"); } }
checkLogin();

$("btnLogin").onclick=async()=>{
  const email=$("loginEmail").value.trim(); const pass=$("loginPassword").value;
  $("mensajeLogin").textContent="⏳ Ingresando...";
  try{
    const r=await fetch(URL_SUPA+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password:pass})});
    const txt=await r.text(); let j={}; try{j=JSON.parse(txt)}catch(e){j={msg:txt}}
    if(!r.ok){ $("mensajeLogin").textContent="❌ "+(j.error_description||j.error||j.msg||txt); return; }
    TOKEN=j.access_token; UID=j.user.id; localStorage.setItem("token",TOKEN); localStorage.setItem("uid",UID);
    $("pantallaLogin").classList.add("oculto"); $("sistema").classList.remove("oculto");
  }catch(e){ $("mensajeLogin").textContent="❌ Error red: "+e.message; }
};
$("btnCerrarSesion").onclick=()=>{localStorage.clear(); location.reload();};
$("btnMenuBuscar").onclick=()=>mostrar("buscar");
$("btnMenuNuevoVeh").onclick=()=>mostrar("nuevoVehiculo");
$("btnMenuNuevaInterv").onclick=()=>{ $("fecha").valueAsDate=new Date(); mostrar("nuevaIntervencion"); };
$("btnVolverBuscar").onclick=volver; $("btnVolverNuevoVeh").onclick=volver; $("btnVolverInterv").onclick=volver;

$("btnRecuperar").onclick=async()=>{
  $("estadoRecupero").textContent="⏳ Recuperando vehículos e intervenciones sin dueño...";
  let countV=0,countI=0;
  const rV=await fetch(URL_SUPA+"/rest/v1/vehiculos?user_id=is.null&select=*",{headers:headers()});
  const veh=await rV.json();
  if(Array.isArray(veh)){ for(let v of veh){ const rr=await fetch(URL_SUPA+"/rest/v1/vehiculos?id=eq."+v.id,{method:"PATCH",headers:{...headers(),"Prefer":"return=minimal"},body:JSON.stringify({user_id:UID})}); if(rr.ok) countV++; } }
  const rI=await fetch(URL_SUPA+"/rest/v1/intervenciones?user_id=is.null&select=*",{headers:headers()});
  const inter=await rI.json();
  if(Array.isArray(inter)){ for(let it of inter){ const rr=await fetch(URL_SUPA+"/rest/v1/intervenciones?id=eq."+it.id,{method:"PATCH",headers:{...headers(),"Prefer":"return=minimal"},body:JSON.stringify({user_id:UID})}); if(rr.ok) countI++; } }
  $("estadoRecupero").innerHTML="✅ Listo! Recuperados Vehículos: "+countV+" Intervenciones: "+countI+"<br>Ahora buscá una patente vieja.";
};

$("btnGuardarVeh").onclick=async()=>{
  const patente=$("patente").value.trim().toUpperCase(); if(!patente)return alert("Patente");
  const r=await fetch(URL_SUPA+"/rest/v1/vehiculos",{method:"POST",headers:{...headers(),"Prefer":"return=minimal"},body:JSON.stringify({user_id:UID,patente,marca:$("marca").value,modelo:$("modelo").value,anio:$("anio").value?Number($("anio").value):null,kilometraje:$("kilometraje").value?Number($("kilometraje").value):null,cliente:$("cliente").value,telefono:$("telefono").value})});
  if(!r.ok)alert("Error: "+await r.text()); else {alert("Guardado"); volver();}
};
$("btnBuscarAhora").onclick=async()=>{
  const pat=$("patenteBuscar").value.trim().toUpperCase(); $("resultadoBusqueda").innerHTML="⏳...";
  const r=await fetch(URL_SUPA+"/rest/v1/vehiculos?user_id=eq."+UID+"&patente=eq."+pat+"&select=*",{headers:headers()});
  const data=await r.json(); const veh=data[0];
  if(!veh){$("resultadoBusqueda").innerHTML="❌ No encontrado. Si es viejo, apretá primero RECUPERAR."; return;}
  const r2=await fetch(URL_SUPA+"/rest/v1/intervenciones?user_id=eq."+UID+"&vehiculo_id=eq."+veh.id+"&order=fecha.desc&select=*
