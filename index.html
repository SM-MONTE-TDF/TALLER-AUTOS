<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM Monte v115</title>
<style>
body{margin:0;padding:12px;font-family:Arial;background:#000;color:#fff}
.tarjeta{background:#111;padding:18px;border-radius:14px;max-width:850px;margin:auto;border:1px solid #222}
button{width:100%;padding:15px;margin-top:10px;border:none;border-radius:10px;background:#06b6d4;color:#000;font-size:17px;font-weight:900}
.boton-secundario{background:#374151;color:#fff}.boton-cerrar{background:#7f1d1d;color:#fff}
input,select,textarea{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #334155;border-radius:8px;background:#0f172a;color:#fff;box-sizing:border-box}
.tab{flex:1;padding:10px;border-radius:8px;background:#1e293b;color:#cbd5e1;text-align:center;cursor:pointer;font-weight:700}
.tab.activa{background:#06b6d4;color:#000}
.ficha{border:1px solid #1e293b;border-radius:10px;padding:12px;margin:10px 0;background:#0f172a}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:800;color:#fff}
.badge-servicio{background:#16a34a}.badge-diagnostico{background:#2563eb}.badge-reparacion{background:#ea580c}
.foto-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.foto-item{position:relative;width:90px;height:90px;border-radius:8px;overflow:hidden;border:1px solid #334155}
.foto-item img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.foto-del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:50%;width:24px;height:24px;padding:0}
.tabs{display:flex;gap:6px;margin:10px 0}.grilla-doble{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.label-sm{font-size:13px;font-weight:700;color:#94a3b8;margin-top:4px;display:block}
.historial-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.h-tab{padding:8px 12px;border-radius:20px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;cursor:pointer;font-size:13px}
.h-tab.activa{background:#06b6d4;color:#000}
.h-detalle{border:1px solid #1e293b;border-radius:10px;padding:12px;margin-top:10px;background:#0f172a;display:none}
.h-detalle.activo{display:block}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:9999}
#lightbox.activa{display:flex}#lightbox img{max-width:95%;max-height:90%;border-radius:12px}
.logo-wrap{text-align:center;margin-bottom:14px} .logo-wrap img{max-width:100%;width:340px}
.oculto{display:none!important}
</style></head><body>
