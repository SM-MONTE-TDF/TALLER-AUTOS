<style>
*{box-sizing:border-box;font-family:system-ui,Arial}body{margin:0;background:#000;color:#fff;min-height:100vh}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.logo-img{width:95%;max-width:380px;height:auto;display:block}
.sub{color:#555;font-size:11px;letter-spacing:4px;margin:12px 0 28px;text-align:center}

.msg{color:#ff5555;text-align:center;margin-top:10px;min-height:18px;font-size:13px}
#app{display:none;max-width:760px;margin:0 auto;padding:14px}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #222;position:sticky;top:0;background:#000;z-index:10}
.top-logo{height:44px}
.card{background:#101010;border:1px solid #222;border-radius:16px;padding:14px;margin:12px 0}
.add{background:#00e5ff;color:#000;border:0;padding:12px;border-radius:10px;width:100%;font-weight:800;cursor:pointer}
.small{color:#888;font-size:12px}
.vehicle{border:1px solid #222;border-radius:12px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.vehicle b{color:#00e5ff}
