<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM MONTENEGRO</title><style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#050505;color:#fff}input,textarea,select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #222;background:#121212;color:#fff;margin:5px 0}.b{background:#00e5ff;color:#000;font-weight:900;border:0}.c{display:flex;justify-content:center;align-items:center;min-height:100vh;flex-direction:column;padding:20px}.ca{background:#101010;border:1px solid #1e1e1e;border-radius:12px;padding:12px;margin:8px 0}.vb{background:#0e0e0e;border:1px solid #222;border-radius:10px;padding:10px;margin:6px 0;display:flex;justify-content:space-between;width:100%;color:#fff;text-align:left}label{font-size:11px;color:#00e5ff;letter-spacing:1px;margin:8px 0 0 4px;display:block}</style></head><body><div id="L" class="c"><h1>SM <b style="color:#00e5ff">MONTENEGRO</b></h1><p style="color:#666;font-size:11px;letter-spacing:4px">TALLER AUTOS</p><div style="width:100%;max-width:300px"><input id="u" placeholder="Usuario"><input id="p" type="password" placeholder="Contraseña"><button class="b" onclick="if(u.value==='SM-MONTE-'&&p.value==='Taller.monte1.'){localStorage.setItem('ok','1');show()}else alert('Mal')">ENTRAR</button></div></div><div id="A" style="display:none;max-width:700px;margin:auto;padding:10px"><div style="display:flex;justify-content:space-between;align-items:center"><b style="color:#00e5ff">SM TALLER</b><div style="display:flex;gap:5px"><button onclick="exp()" style="width:auto;font-size:12px">Backup</button><input type=file id=imf hidden onchange=imp(event)><button onclick="imf.click()" style="width:auto;font-size:12px">Importar</button><button onclick="logout()" style="width:auto;background:#300;color:#f88;font-size:12px">Salir</button></div></div><div id="v1"><div class="ca"><input type=date id=vf><input id=vp placeholder="PATENTE*"><input id=vm placeholder="Marca Modelo"><input id=vt placeholder="Titular"><input id=vte placeholder="Tel"><button class="b" onclick="addV()">+ GUARDAR VEHICULO</button></div><input id=q placeholder="Buscar..." oninput=ls()><div id=lst></div></div><div id="v2" style="display:none"><button onclick="v2.style.display='none';v1.style.display='block';S=-1;ls()" style="width:auto">← Volver</button><div id=det class=ca></div><div class="ca"><label>MOTIVO DE INGRESO</label><select id="imot"><option value="Diagnostico">🔍 Diagnostico</option><option value="Servicio">🔧 Servicio</option><option value="Reparacion">🛠️ Reparacion</option></select><label>FECHA / KM</label><div style="display:flex;gap:6px"><input type=date id=iff style="flex:1"><input id=ik placeholder="KM" style="flex:1"></div><label>DIAGNOSTICO</label><textarea id="idia" placeholder="Que trae / que falla..."></textarea><label>TRABAJO REALIZADO</label><textarea id="itra" placeholder="Que se le hizo..."></textarea><label>COSTO / FOTOS</label><input id=ic placeholder="$ Costo"><input type=file id=ift accept="image/*" multiple><button class="b" onclick="addI()">Guardar intervencion</button></div><div id=his></div></div></div><script>let K='sm_final_v3',D=JSON.parse(localStorage.getItem(K)||'[]'),S=-1;const today=()=>new Date().toISOString().slice(0,10);vf.value=iff.value=today();function show(){L.style.display='none';A.style.display='block';ls()}function logout(){localStorage.removeItem('ok');location.reload()}function sv(){localStorage.setItem(K,JSON.stringify(D));ls();if(S>=0)rd()}function addV(){let p=vp.value.toUpperCase().trim();if(!p)return alert('patente');D.unshift({pt:p,ma:vm.value,ti:vt.value,te:vte.value,f:vf.value||today(),iv:[]});vp.value=vm.value=vt.value=vte.value='';vf.value=today();sv()}function ls(){let s=(q.value||'').toLowerCase(),c=lst;c.innerHTML='';D.filter(x=>(x.pt+' '+x.ti).toLowerCase().includes(s)).forEach(x=>{let i=D.indexOf(x),b=document.createElement('button');b.className='vb';b.innerHTML='<div><b style=color:#00e5ff>'+x.pt+'</b><div style=font-size:12px;color:#888>'+x.ma+' - '+x.ti+'</div></div>›';b.onclick=()=>{S=i;v1.style.display='none';v2.style.display='block';iff.value=today();rd()};c.appendChild(b)})}function rd(){if(S<0)return;let v=D[S];det.innerHTML='<b style=color:#00e5ff;font-size:20px>'+v.pt+'</b><div>'+v.ma+'<br>'+v.ti+' Tel:'+v.te+'</div><button onclick="if(confirm(`Borrar vehiculo?`)){D.splice(S,1);S=-1;v2.style.display=`none`;v1.style.display=`block`;sv()}" style="width:auto;background:#300;color:#f88;margin-top:8px">Borrar vehiculo</button>';let h=his;h.innerHTML='';if(v.iv.length==0)h.innerHTML='<div class=ca style=color:#666;text-align:center>Sin intervenciones</div>';v.iv.slice().reverse().forEach((it,ri)=>{let r=v.iv.length-1-ri,d=document.createElement('div');d.className='ca';let f='';if(it.fo)it.fo.forEach(u=>f+=`<img src=${u} style=width:60px;height:60px;object-fit:cover;border-radius:8px;margin:2px onclick=window.open(this.src)>`);let ico=it.mot=='Servicio'?'🔧':it.mot=='Reparacion'?'🛠️':'🔍';d.innerHTML=`<div style=display:flex;justify-content:space-between><b style=color:#00e5ff>${ico} ${it.mot} - ${it.f}</b> $${it.c||0} <span onclick="if(confirm('Borrar?')){D[${S}].iv.splice(${r},1);sv()}" style=color:#f55> X</span></div><div style=margin:6px 0><b>KM:</b>${it.k||'-'}<br><b>Diag:</b> ${it.dia||'-'}<br><b>Trabajo:</b> ${it.tra||'-'}</div><div style=display:flex;flex-wrap:wrap>${f}</div>`;h.appendChild(d)})}async function addI(){if(S<0)return;let dia=idia.value.trim(),tra=itra.value.trim();if(!dia&&!tra)return alert('Pone diag o trabajo');let fo=[];for(let fl of ift.files){fo.push(await new Promise(r=>{let R=new FileReader();R.onload=e=>r(e.target.result);R.readAsDataURL(fl)}))}D[S].iv.push({mot:imot.value,f:iff.value||today(),k:ik.value,dia:dia,tra:tra,c:ic.value,fo:fo});idia.value=itra.value=ik.value=ic.value='';ift.value='';iff.value=today();sv()}function exp(){let b=new Blob([JSON.stringify(D)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='backup-taller.json';a.click()}function imp(e){let f=e.target.files[0];if(!f)return;let R=new FileReader();R.onload=v=>{try{let j=JSON.parse(v.target.result);D=j.concat(D);sv()}catch{alert('Mal')}};R.readAsText(f)}if(localStorage.getItem('ok'))show();</script></body></html>
