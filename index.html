<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taller Mecánico</title>
<style>
*{box-sizing:border-box} body{margin:0;padding:20px;font-family:Arial,sans-serif;background:#f2f2f2;color:#222}
.contenedor{max-width:800px;margin:auto} h1{text-align:center;margin-bottom:25px} h2{margin-top:0}
.tarjeta{background:white;padding:20px;margin-bottom:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
button{width:100%;padding:14px;margin-top:10px;border:none;border-radius:8px;background:#222;color:white;font-size:16px;cursor:pointer}
button:hover{background:#444} button:disabled{opacity:.6;cursor:not-allowed}
.boton-secundario{background:#777} .boton-cerrar{background:#a00000} .boton-migrar{background:#0b6b3a}
input,select,textarea{width:100%;padding:12px;margin-top:6px;margin-bottom:15px;border:1px solid #ccc;border-radius:7px;font-size:15px}
textarea{min-height:90px;resize:vertical} label{font-weight:bold} .oculto{display:none!important}
.mensaje-error{padding:15px;background:#f8d7da;color:#842029;border-radius:8px;margin-top:15px}
.mensaje-exito{padding:15px;background:#d1e7dd;color:#0f5132;border-radius:8px;margin-top:15px}
.cargando{padding:15px;background:#eee;border-radius:8px;margin-top:15px;text-align:center}
.info-vehiculo{background:#f5f5f5;padding:15px;border-radius:8px;margin-bottom:15px}
</style>
</head>
<body>

<div id="pantallaLogin" class="contenedor">
    <div class="tarjeta">
        <h1>🔧 Taller Mecánico</h1>
        <h2>🔐 Iniciar sesión</h2>
        <label>Correo electrónico</label>
        <input type="email" id="loginEmail" placeholder="Tu correo">
        <label>Contraseña</label>
        <input type="password" id="loginPassword" placeholder="Tu contraseña" onkeydown="if(event.key==='Enter') window.iniciarSesion()">
        <button onclick="window.iniciarSesion()">🔐 Ingresar</button>
        <div id="mensajeLogin"></div>
    </div>
</div>

<div id="sistema" class="contenedor oculto">
    <h1>🔧 Taller Mecánico</h1>
    <div id="menuPrincipal" class="tarjeta">
        <div id="panelMigracion" class="tarjeta oculto" style="border:2px solid #198754;background:#e9f7ef;">
            <h2>📦 Datos antiguos encontrados</h2>
            <div id="textoMigracion"></div>
            <button class="boton-migrar" onclick="window.migrarDatosAntiguos()">📦 Migrar todos los datos</button>
            <div id="resultadoMigracion"></div>
        </div>
        <button onclick="window.mostrarSeccion('buscar')">🔎 Buscar vehículo</button>
        <button onclick="window.mostrarSeccion('nuevoVehiculo')">🚗 Nuevo vehículo</button>
        <button onclick="window.mostrarSeccion('nuevaIntervencion')">🛠️ Nueva intervención</button>
        <button class="boton-cerrar" onclick="window.cerrarSesion()">🔒 Cerrar sesión</button>
    </div>

    <div id="buscar" class="tarjeta oculto">
        <h2>🔎 Buscar vehículo</h2>
        <input type="text" id="patenteBuscar" placeholder="Ej: AB123CD" onkeydown="if(event.key==='Enter') window.buscarVehiculo()">
        <button onclick="window.buscarVehiculo()">🔎 Buscar</button>
        <div id="resultadoBusqueda"></div>
        <button class="boton-secundario" onclick="window.volverInicio()">← Volver</button>
    </div>

    <div id="nuevoVehiculo" class="tarjeta oculto">
        <h2>🚗 Nuevo vehículo</h2>
        <label>Patente</label><input type="text" id="patente">
        <label>Marca</label><input type="text" id="marca">
        <label>Modelo</label><input type="text" id="modelo">
        <label>Año</label><input type="number" id="anio">
        <label>Cliente</label><input type="text" id="cliente">
        <label>Teléfono</label><input type="tel" id="telefono">
        <button onclick="window.agregarVehiculo()">💾 Guardar vehículo</button>
        <button class="boton-secundario" onclick="window.volverInicio()">← Volver</button>
    </div>

    <div id="nuevaIntervencion" class="tarjeta oculto">
        <h2>🛠️ Nueva intervención</h2>
        <label>Patente</label><input type="text" id="patenteIntervencion">
        <label>Fecha</label><input type="date" id="fecha">
        <label>Tipo</label>
        <select id="tipo"><option value="">Seleccionar</option><option>Service</option><option>Reparación</option><option>Diagnóstico</option><option>Otro</option></select>
        <label>Motivo</label><textarea id="motivo"></textarea>
        <label>Trabajo realizado</label><textarea id="trabajo"></textarea>
        <button onclick="window.agregarIntervencion()">
