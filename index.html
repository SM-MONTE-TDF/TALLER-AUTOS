<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión Taller</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 20px;
    }

    .contenedor {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .tarjeta {
      background: white;
      padding: 20px;
      margin-top: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 6px 0;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      background: #222;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    .datos-vehiculo {
      background: #f8f8f8;
      padding: 15px;
      margin-top: 15px;
      border-radius: 8px;
    }

    .dato {
      margin: 8px 0;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>🔧 Gestión Taller</h1>

  <div class="tarjeta">

    <h2>🔎 Buscar vehículo</h2>

    <input
      type="text"
      id="patenteBuscar"
      placeholder="Ingresá la patente"
    >

    <button onclick="buscarVehiculo()">
      Buscar vehículo
    </button>

  </div>


  <div class="tarjeta">

    <h2>🚗 Nuevo vehículo</h2>

    <input
      type="text"
      id="patente"
      placeholder="Patente"
    >

    <input
      type="text"
      id="marca"
      placeholder="Marca"
    >

    <input
      type="text"
      id="modelo"
      placeholder="Modelo"
    >

    <input
      type="number"
      id="anio"
      placeholder="Año"
    >

    <input
      type="number"
      id="kilometraje"
      placeholder="Kilometraje"
    >

    <input
      type="text"
      id="cliente"
      placeholder="Nombre del cliente"
    >

    <input
      type="tel"
      id="telefono"
      placeholder="Teléfono"
    >

    <button onclick="agregarVehiculo()">
      ➕ Agregar vehículo
    </button>

  </div>


  <div class="tarjeta">

    <h2>📋 Información del vehículo</h2>

    <div id="resultado">
      Buscá una patente para ver la información.
    </div>

  </div>

</div>


<script>

  let vehiculos = [];


  function agregarVehiculo() {

    const patente =
      document.getElementById("patente").value.trim().toUpperCase();

    const marca =
      document.getElementById("marca").value.trim();

    const modelo =
      document.getElementById("modelo").value.trim();

    const anio =
      document.getElementById("anio").value;

    const kilometraje =
      document.getElementById("kilometraje").value;

    const cliente =
      document.getElementById("cliente").value.trim();

    const telefono =
      document.getElementById("telefono").value.trim();


    if (!patente) {
      alert("Ingresá una patente.");
      return;
    }


    const vehiculo = {

      patente: patente,

      marca: marca,

      modelo: modelo,

      anio: anio,

      kilometraje: kilometraje,

      cliente: cliente,

      telefono: telefono

    };


    vehiculos.push(vehiculo);


    alert("Vehículo agregado correctamente.");


    document.getElementById("patente").value = "";
    document.getElementById("marca").value = "";
    document.getElementById("modelo").value = "";
    document.getElementById("anio").value = "";
    document.getElementById("kilometraje").value = "";
    document.getElementById("cliente").value = "";
    document.getElementById("telefono").value = "";

  }


  function buscarVehiculo() {

    const patente =
      document
      .getElementById("patenteBuscar")
      .value
      .trim()
      .toUpperCase();


    const resultado =
      document.getElementById("resultado");


    const vehiculo =
      vehiculos.find(v => v.patente === patente);


    if (!vehiculo) {

      resultado.innerHTML =
        "<p>❌ No se encontró ningún vehículo con esa patente.</p>";

      return;

    }


    resultado.innerHTML = `

      <div class="datos-vehiculo">

        <h3>🚗 ${vehiculo.marca} ${vehiculo.modelo}</h3>

        <div class="dato">
          <strong>Patente:</strong>
          ${vehiculo.patente}
        </div>

        <div class="dato">
          <strong>Año:</strong>
          ${vehiculo.anio}
        </div>

        <div class="dato">
          <strong>Kilometraje:</strong>
          ${vehiculo.kilometraje} km
        </div>

        <div class="dato">
          <strong>Cliente:</strong>
          ${vehiculo.cliente}
        </div>

        <div class="dato">
          <strong>Teléfono:</strong>
          ${vehiculo.telefono}
        </div>

      </div>

    `;

  }

</script>

</body>
</html>
