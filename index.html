<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM</title><style>body{margin:0;background:#000;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh}.box{width:92%;max-width:360px;text-align:center}input{width:100%;padding:14px;margin:8px 0;background:#111;border:1px solid #333;color:#fff;border-radius:12px;font-size:16px}button{width:100%;padding:14px;background:#00e5ff;color:#000;border:0;border-radius:12px;font-weight:900}#app{display:none;width:100%;max-width:700px;padding:20px}.card{background:#111;border:1px solid #222;border-radius:12px;padding:14px;margin:10px 0}</style></head><body>
<div id="login" class="box"><img src="logo.png?v=2" style="width:100%;max-width:340px" onerror="this.style.display='none'"><p style="color:#555;letter-spacing:4px;font-size:10px">TALLER AUTOS</p><input id="u" value="SM-MONTE-"><input id="p" type="password" value="Taller.monte1."><button type="button" onclick="entrar()">ENTRAR</button><div id="msg" style="color:red;margin-top:10px"></div><button onclick="localStorage.clear();location.reload()" style="margin-top:15px;background:#222;color:#888;font-size:12px">Si queda negro tocar acá</button></div>
<div id="app"><div style="display:flex;justify-content:space-between"><img src="logo.png?v=2" style="height:40px" onerror="this.style.display='none'"><button onclick="localStorage.removeItem('auth');location.reload()" style="width:auto;background:#222;color:#fff">Salir</button></div><div class="card"><h3 style="color:#00e5ff">Nuevo vehículo</h3><input id="v_pat" placeholder="PATENTE *"><input id="v_marca" placeholder="Marca"><input id="v_titular" placeholder="Titular"><button onclick="addVeh()">+ Guardar</button></div><input id="busq" placeholder="Buscar..." oninput="render()"><div id="lista"></div></div>
<script>
const USER="SM-MONTE-";const PASS="Taller.monte1.";
let data=[];try{data=JSON.parse(localStorage.getItem("taller")||"[]")}catch(e){}
function entrar(){let u=document.getElementById("u").value.trim();let p=document.getElementById("p").value;if(u===USER&&p===PASS){localStorage.setItem("auth","1");mostrar();}else{document.getElementById("msg").innerText="Usa SM-MONTE- / Taller.monte1.";}}
function mostrar(){document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";render();}
function addVeh(){let pat=document.getElementById("v_pat").value.toUpperCase().trim();if(!pat)return alert("Patente");data.unshift({patente:pat,marca:document.getElementById("v_marca").value,titular:document.getElementById("v_titular").value});localStorage.setItem("taller",JSON.stringify(data));render();}
function render(){let q=(document.getElementById("busq").value||"").toLowerCase();let c=document.getElementById("lista");c.innerHTML="";data.filter(v=>(v.patente+" "+v.titular).toLowerCase().includes(q)).forEach(v=>{let d=document.createElement("div");d.className="card";d.innerHTML="<b style='color:#00e5ff'>"+v.patente+"</b> "+v.marca+" - "+v.titular;c.appendChild(d);});}
if(localStorage.getItem("auth")==="1")mostrar();
</script></body></html>
