<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taller v112 CELU</title>
<style>
body{margin:0;padding:12px;font-family:Arial;background:#f2f2f2}
.tarjeta{background:#fff;padding:18px;border-radius:14px;max-width:850px;margin:auto;box-shadow:0 2px 10px rgba(0,0,0,.08)}
button{width:100%;padding:15px;margin-top:10px;border:none;border-radius:10px;background:#111827;color:#fff;font-size:17px;font-weight:700;cursor:pointer}
input,select,textarea{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #d1d5db;border-radius:8px;font-size:16px;box-sizing:border-box}
.oculto{display:none!important}
.boton-recuperar{background:#0066cc}.boton-secundario{background:#6b7280}.boton-cerrar{background:#991b1b}
.tabs{display:flex;gap:6px;margin:10px 0}
.tab{flex:1;padding:10px;border-radius:8px;background:#e5e7eb;color:#111827;text-align:center;cursor:pointer;font-weight:700;border:2px solid transparent}
.tab.activa{background:#1e3a8a;color:#fff;border-color:#1e3a8a}
.ficha{border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin:10px 0;background:#f9fafb}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:800;color:#fff;margin-right:6px}
.badge-servicio{background:#16a34a}.badge-diagnostico{background:#2563eb}.badge-reparacion{background:#ea580c}
.foto-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.foto-item{position:relative;width:90px;height:90px;border-radius:8px;overflow:hidden;border:1px solid #ddd}
.foto-item img{width:100%;height:100%;object-fit:cover}
.foto-del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:50%;width:24px;height:24px;padding:0;font-size:14px;cursor:pointer}
.grilla-doble{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.label-sm{font-size:13px;font-weight:700;color:#374151;margin-top:4px;display:block}
.historial-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.h-tab{padding:8px 12px;border-radius:20px;border:1px solid #d1d5db;background:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px}
.h-tab.activa{background:#111827;color:#fff;border-color:#111827}
.h-detalle{border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin-top:10px;background:#fff;display:none}
.h-detalle.activo{display:block}
</style></head><body>
<div id="pantallaLogin" class="tarjeta"><h1>🔧 Taller v112</h1><h2>Entrar</h2><label>Email</label><input id="loginEmail" value="maxi_boca46@hotmail.com"><label>Contraseña</label><input type="password" id="loginPassword"><button id="btnLogin" type="button">🔐 Ingresar</button><div id="mensajeLogin" style="margin-top:15px;font-weight:bold;color:red;white-space:pre-wrap"></div></div>
<div id="sistema" class="tarjeta oculto">
<h1>🔧 Taller v112</h1>
<button id="btnMenuBuscar">🔎 Buscar</button>
<button id="btnMenuNuevoVeh">🚗 Nuevo vehículo</button>
<button id="btnMenuNuevaInterv">🛠️ Nueva intervención</button>
<button id="btnRecuperar" class="boton-recuperar">♻️ Recuperar viejos</button>
<button id="btnCerrarSesion" class="boton-cerrar">Cerrar sesión</button>
<div id="estadoRecupero" style="font-weight:bold;margin-top:10px"></div>
<div id="buscar" class="oculto"><hr><h2>Buscar</h2>
<div class="tabs"><div id="tabPatente" class="tab activa">Patente</div><div id="tabTitular" class="tab">Titular</div><div id="tabTelefono" class="tab">Teléfono</div></div>
<input id="patenteBuscar" placeholder="Buscar por patente..."><button id="btnBuscarAhora">Buscar ahora</button><div id="resultadoBusqueda"></div></div>
<div id="nuevoVehiculo" class="oculto"><hr><h2>🚗 Nuevo vehículo</h2>
<div class="grilla-doble"><div><span class="label-sm">Patente</span><input id="patente" placeholder="AA123BB"></div><div><span class="label-sm">Año</span><input id="anio" type="number" placeholder="2012"></div></div>
<div class="grilla-doble"><div><span class="label-sm">Marca</span><input id="marca" placeholder="Marca"></div><div><span class="label-sm">Modelo</span><input id="modelo" placeholder="Modelo"></div></div>
<span class="label-sm">Titular</span><input id="titular" placeholder="Titular / Cliente">
<span class="label-sm">Teléfono</span><input id="telefono" placeholder="Teléfono / Contacto">
<span class="label-sm">Contacto alt.</span><input id="cliente" placeholder="Opcional">
<button id="btnGuardarVeh">💾 Guardar vehículo</button></div>
<div id="nuevaIntervencion" class="oculto"><hr><h2>🛠️ Nueva intervención</h2>
<span class="label-sm">Patente</span><input id="patenteIntervencion" placeholder="Patente">
<span class="label-sm">Fecha</span><input type="date" id="fecha">
<span class="label-sm">Motivo</span><select id="motivoTipo"><option value="diagnostico">Diagnóstico</option><option value="servicio">Servicio</option><option value="reparacion">Reparación</option></select>
<span class="label-sm">Diagnóstico</span><textarea id="diagnostico" placeholder="Qué se revisó / qué se encontró" rows="3"></textarea>
<span class="label-sm">Trabajo realizado</span><textarea id="trabajo" placeholder="Detalle del trabajo" rows="4"></textarea>
<span class="label-sm">Fotos</span><input type="file" id="inputFotos" accept="image/*" multiple><div id="previewFotos" class="foto-grid"></div>
<button id="btnGuardarInterv">💾 Guardar intervención</button><div id="estadoInterv" style="margin-top:8px;font-weight:bold"></div></div>
</div>
<script>
const URL_SUPA="https://sljknzpyxmpfnkcaoksu.supabase.co"; const KEY="sb_publishable_3oidhuHVin61bwlZBTW41w_fuF_rqPI";
let TOKEN=localStorage.getItem("token"); let UID=localStorage.getItem("uid"); let tipoBusqueda='patente'; let fotosTemp=[];
function $(id){return document.getElementById(id);}
function headers(){return {"apikey":KEY,"Authorization":"Bearer "+TOKEN,"Content-Type":"application/json"};}
function badgeClass(m){ if(m==='servicio') return 'badge-servicio'; if(m==='diagnostico') return 'badge-diagnostico'; return 'badge-reparacion';}
if(TOKEN&&UID){$("pantallaLogin").classList.add("oculto");$("sistema").classList.remove("oculto");}
$("btnLogin").addEventListener("click", async function(){
  $("mensajeLogin").textContent="⏳ Ingresando..."; const email=$("loginEmail").value.trim(); const pass=$("loginPassword").value;
  if(!pass){$("mensajeLogin").textContent="❌ Poné contraseña"; return;}
  try{ const r=await fetch(URL_SUPA+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password:pass})}); const t=await r.text(); let j={}; try{j=JSON.parse(t)}catch(e){j={error:t}} if(!r.ok){$("mensajeLogin").textContent="❌ "+(j.error_description||j.error||t);return;} TOKEN=j.access_token; UID=j.user.id; localStorage.setItem("token",TOKEN); localStorage.setItem("uid",UID); $("pantallaLogin").classList.add("oculto"); $("sistema").classList.remove("oculto"); }catch(e){$("mensajeLogin").textContent="❌ "+e.message;}
});
$("btnCerrarSesion").onclick=function(){localStorage.clear();location.reload();};
function setTab(t){ tipoBusqueda=t; $("tabPatente").classList.toggle("activa", t==='patente'); $("tabTitular").classList.toggle("activa", t==='titular'); $("tabTelefono").classList.toggle("activa", t==='telefono'); $("patenteBuscar").placeholder = t==='patente'?'Buscar por patente...': t==='titular'?'Buscar por titular...':'Buscar por teléfono...';}
$("tabPatente").onclick=()=>setTab('patente'); $("tabTitular").onclick=()=>setTab('titular'); $("tabTelefono").onclick=()=>setTab('telefono');
$("btnMenuBuscar").onclick=function(){ $("buscar").classList.remove("oculto"); $("nuevoVehiculo").classList.add("oculto"); $("nuevaIntervencion").classList.add("oculto"); $("patenteBuscar").focus();}
$("btnMenuNuevoVeh").onclick=function(){ $("nuevoVehiculo").classList.remove("oculto"); $("buscar").classList.add("oculto"); $("nuevaIntervencion").classList.add("oculto");}
$("btnMenuNuevaInterv").onclick=function(){ $("fecha").valueAsDate=new Date(); $("nuevaIntervencion").classList.remove("oculto"); $("buscar").classList.add("oculto"); $("nuevoVehiculo").classList.add("oculto"); fotosTemp=[]; renderFotos();}
$("btnRecuperar").onclick=async function(){ $("estadoRecupero").textContent="⏳ Recuperando..."; let cv=0,ci=0; const rv=await fetch(URL_SUPA+"/rest/v1/vehiculos?user_id=is.null&select=*",{headers:headers()}); const veh=await rv.json(); for(let v of (veh||[])){const rr=await fetch(URL_SUPA+"/rest/v1/vehiculos?id=eq."+v.id,{method:"PATCH",headers:{...headers(),"Prefer":"return=minimal"},body:JSON.stringify({user_id:UID})}); if(rr.ok) cv++;} const ri=await fetch(URL_SUPA+"/rest/v1/intervenciones?user_id=is.null&select=*",{headers:headers()}); const inter=await ri.json(); for(let it of (inter||[])){const rr=await fetch(URL_SUPA+"/rest/v1/intervenciones?id=eq."+it.id,{method:"PATCH",headers:{...headers(),"Prefer":"return=minimal"},body:JSON.stringify({user_id:UID})}); if(rr.ok) ci++;} $("estadoRecupero").textContent="✅ Veh: "+cv+" Interv: "+ci;};
$("btnGuardarVeh").onclick=async function(){ const p=$("patente").value.toUpperCase().trim(); if(!p){alert("Patente obligatoria");return;} const body={ user_id:UID, patente:p, marca:$("marca").value.trim(), modelo:$("modelo").value.trim(), cliente: JSON.stringify({titular:$("titular").value.trim(), telefono:$("telefono").value.trim(), contacto:$("cliente").value.trim(), marca:$("marca").value.trim(), modelo:$("modelo").value.trim(), anio:$("anio").value})}; const r=await fetch(URL_SUPA+"/rest/v1/vehiculos",{method:"POST",headers:{...headers(),"Prefer":"return=minimal"},body:JSON.stringify(body)}); if(r.ok){alert("✅ Guardado"); $("patente").value=""; $("marca").value=""; $("modelo").value=""; $("anio").value=""; $("titular").value=""; $("telefono").value=""; $("cliente").value="";} else alert("Error "+await r.text());};
$("inputFotos").addEventListener("change", async (e)=>{ const files = Array.from(e.target.files); for(let f of files){ const b64 = await new Promise(res=>{const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.readAsDataURL(f);}); fotosTemp.push({name:f.name, base64:b64}); } renderFotos(); e.target.value="";});
function renderFotos(){ const cont=$("previewFotos"); cont.innerHTML=""; fotosTemp.forEach((ft, idx)=>{ const div=document.createElement("div"); div.className="foto-item"; div.innerHTML=`<img src="${ft.base64}"><button class="foto-del" onclick="borrarFoto(${idx})">✕</button>`; cont.appendChild(div); });}
window.borrarFoto=function(i){ fotosTemp.splice(i,1); renderFotos(); }
$("btnBuscarAhora").onclick=async function(){ const q=$("patenteBuscar").value.trim(); if(!q){$("resultadoBusqueda").innerHTML="<i>Escribí algo</i>";return;} $("resultadoBusqueda").innerHTML="⏳ Buscando..."; let url=`${URL_SUPA}/rest/v1/vehiculos?user_id=eq.${UID}&select=*&cliente=ilike.*${encodeURIComponent(q)}*`; if(tipoBusqueda==='patente'){ url=`${URL_SUPA}/rest/v1/vehiculos?user_id=eq.${UID}&patente=ilike.*${encodeURIComponent(q)}*&select=*`; } const r=await fetch(url,{headers:headers()}); const data=await r.json(); if(!data.length){$("resultadoBusqueda").innerHTML="No encontrado";return;} let html=""; for(let veh of data){ let cli={}; try{cli=JSON.parse(veh.cliente)}catch(e){cli={titular:veh.cliente}} html+=`<div class="ficha"><b>🚗 ${veh.patente}</b> - ${cli.marca||""} ${cli.modelo||""} ${cli.anio||""}<br>👤 ${cli.titular||""} - 📞 ${cli.telefono||""}<br><button class="boton-secundario" onclick="verHistorial('${veh.id}')">Ver historial</button><div id="hist_${veh.id}"></div></div>`; } $("resultadoBusqueda").innerHTML=html;};
window.verHistorial=async function(vehId){ const cont=$(`hist_${vehId}`); cont.innerHTML="⏳ Cargando..."; const r=await fetch(`${URL_SUPA}/rest/v1/intervenciones?user_id=eq.${UID}&vehiculo_id=eq.${vehId}&order=fecha.desc&select=*`,{headers:headers()}); const inter=await r.json(); if(!inter.length){cont.innerHTML="<i>Sin intervenciones</i>";return;} let tabs=`<div class="historial-tabs">`; let detalles=""; inter.forEach((it,idx)=>{ let desc={}; try{desc=JSON.parse(it.descripcion)}catch(e){desc={trabajo:it.descripcion}} const motivo=(it.tipo||desc.motivo||"servicio").toLowerCase(); tabs+=`<div class="h-tab ${idx===0?'activa':''}" onclick="mostrarDetalle('${vehId}',${idx})"><span class="badge ${badgeClass(motivo)}">${motivo.slice(0,3).toUpperCase()}</span> ${it.fecha}</div>`; detalles+=`<div id="det_${vehId}_${idx}" class="h-detalle ${idx===0?'activo':''}"><span class="badge ${badgeClass(motivo)}">${motivo.toUpperCase()}</span> <small>${it.fecha}</small><div style="margin-top:8px"><b>Diagnóstico:</b><br>${desc.diagnostico||"-"}</div><div style="margin-top:8px"><b>Trabajo:</b><br>${desc.trabajo||""}</div>${(desc.fotos||[]).length?`<div class="foto-grid">${desc.fotos.map(f=>`<div class="foto-item"><img src="${f}"></div>`).join("")}</div>`:""}</div>`; }); tabs+=`</div>`; cont.innerHTML=tabs+detalles;};
window.mostrarDetalle=function(vehId, idx){ const cont=$(`hist_${vehId}`); cont.querySelectorAll('.h-tab').forEach((el,i)=>{el.classList.toggle('activa', i===idx)}); cont.querySelectorAll('.h-detalle').forEach((el,i)=>{el.classList.toggle('activo', i===idx)}); }
$("btnGuardarInterv").onclick=async function(){ const p=$("patenteIntervencion").value.toUpperCase().trim(); if(!p){alert("Patente obligatoria");return;} $("estadoInterv").textContent="⏳ Buscando..."; const r=await fetch(`${URL_SUPA}/rest/v1/vehiculos?user_id=eq.${UID}&patente=eq.${p}&select=id`,{headers:headers()}); const v=await r.json(); if(!v[0]){alert("Patente no existe"); $("estadoInterv").textContent="";return;} const fotosB64 = fotosTemp.map(f=>f.base64); const descripcion = JSON.stringify({motivo:$("motivoTipo").value, diagnostico:$("diagnostico").value.trim(), trabajo:$("trabajo").value.trim(), fotos:fotosB64}); const body={user_id:UID, vehiculo_id:v[0].id, fecha:$("fecha").value||new Date().toISOString().slice(0,10), tipo:$("motivoTipo").value, descripcion:descripcion}; $("estadoInterv").textContent="⏳ Guardando..."; const rr=await fetch(URL_SUPA+"/rest/v1/intervenciones",{method:"POST",headers:headers(),body:JSON.stringify(body)}); if(rr.ok){$("estadoInterv").textContent="✅ Guardada"; $("diagnostico").value=""; $("trabajo").value=""; fotosTemp=[]; renderFotos(); setTimeout(()=>{$("estadoInterv").textContent="";},2000);} else {$("estadoInterv").textContent="❌ Error"; alert(await rr.text());}};
</script></body></html>
