<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Taller Mecánico</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
    color:#222;
}

.contenedor{
    max-width:800px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:25px;
}

h2{
    margin-top:0;
}

.tarjeta{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#222;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#444;
}

.boton-secundario{
    background:#777;
}

.boton-cerrar{
    background:#a00000;
}

.boton-editar{
    background:#555;
    margin-top:15px;
}

.boton-guardar-edicion{
    background:#222;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    margin-top:6px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

label{
    font-weight:bold;
}

.oculto{
    display:none!important;
}

.info-vehiculo{
    background:#f5f5f5;
    padding:15px;
    border-radius:8px;
    margin-bottom:15px;
}

.historial-fechas{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:15px;
}

.boton-fecha{
    width:100%;
    margin:0;
    padding:13px 15px;
    background:#333;
    text-align:left;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.boton-fecha:hover{
    background:#555;
}

.fecha-ingreso{
    font-weight:bold;
}

.tipo-ingreso{
    font-size:14px;
    background:#666;
    padding:6px 10px;
    border-radius:15px;
    white-space:nowrap;
}

.detalle-intervencion{
    background:#f7f7f7;
    padding:15px;
    border-radius:8px;
    margin-top:15px;
}

.detalle-intervencion p{
    line-height:1.5;
}

.fotos-guardadas{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:10px;
}

.fotos-guardadas img{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:8px;
    cursor:pointer;
}

.boton-agregar-fotos{
    background:#333;
    margin-bottom:5px;
}

.vista-previa-fotos{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:15px;
}

.foto-preview{
    position:relative;
    width:110px;
    height:110px;
}

.foto-preview img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:8px;
}

.boton-eliminar-foto{
    position:absolute;
    top:-8px;
    right:-8px;
    width:28px;
    height:28px;
    padding:0;
    margin:0;
    border-radius:50%;
    background:#d00;
    color:white;
    font-size:16px;
}

.mensaje{
    padding:15px;
    background:#fff3cd;
    border-radius:8px;
    margin-top:15px;
}

.mensaje-error{
    padding:15px;
    background:#f8d7da;
    color:#842029;
    border-radius:8px;
    margin-top:15px;
}

.mensaje-exito{
    padding:15px;
    background:#d1e7dd;
    color:#0f5132;
    border-radius:8px;
    margin-top:15px;
}

.cargando{
    padding:15px;
    background:#eee;
    border-radius:8px;
    margin-top:15px;
    text-align:center;
}

small{
    display:block;
    color:#666;
    margin-bottom:10px;
}

.separador{
    height:1px;
    background:#ddd;
    margin:20px 0;
}
</style>
</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->

<div id="pantallaLogin" class="contenedor">

    <div class="tarjeta">

        <h1>🔧 Taller Mecánico</h1>

        <h2>🔐 Iniciar sesión</h2>

        <label>Correo electrónico</label>

        <input
            type="email"
            id="loginEmail"
            placeholder="Tu correo electrónico"
        >

        <label>Contraseña</label>

        <input
            type="password"
            id="loginPassword"
            placeholder="Tu contraseña"
        >

        <button onclick="iniciarSesion()">
            🔐 Ingresar
        </button>

        <div id="mensajeLogin"></div>

    </div>

</div>


<!-- =====================================================
     SISTEMA
===================================================== -->

<div id="sistema" class="contenedor oculto">

    <h1>🔧 Taller Mecánico</h1>


    <!-- =================================================
         MENÚ PRINCIPAL
    ================================================== -->

    <div id="menuPrincipal" class="tarjeta">

        <button onclick="mostrarSeccion('buscar')">
            🔎 Buscar vehículo
        </button>

        <button onclick="mostrarSeccion('nuevoVehiculo')">
            🚗 Nuevo vehículo
        </button>

        <button onclick="mostrarSeccion('nuevaIntervencion')">
            🛠️ Nueva intervención
        </button>

        <button
            class="boton-cerrar"
            onclick="cerrarSesion()"
        >
            🔒 Cerrar sesión
        </button>

    </div>


    <!-- =================================================
         BUSCAR VEHÍCULO
    ================================================== -->

    <div id="buscar" class="tarjeta oculto">

        <h2>🔎 Buscar vehículo</h2>

        <label>Patente</label>

        <input
            type="text"
            id="patenteBuscar"
            placeholder="Ej: AB123CD"
            onkeydown="if(event.key==='Enter') buscarVehiculo()"
        >

        <button onclick="buscarVehiculo()">
            🔎 Buscar
        </button>

        <div id="resultadoBusqueda"></div>

        <button
            class="boton-secundario"
            onclick="volverInicio()"
        >
            ← Volver al inicio
        </button>

    </div>


    <!-- =================================================
         NUEVO VEHÍCULO
    ================================================== -->

    <div id="nuevoVehiculo" class="tarjeta oculto">

        <h2>🚗 Nuevo vehículo</h2>

        <label>Patente</label>

        <input
            type="text"
            id="patente"
            placeholder="Ej: AB123CD"
        >

        <label>Marca</label>

        <input
            type="text"
            id="marca"
        >

        <label>Modelo</label>

        <input
            type="text"
            id="modelo"
        >

        <label>Año</label>

        <input
            type="number"
            id="anio"
        >

        <label>Kilometraje</label>

        <input
            type="number"
            id="kilometraje"
        >

        <label>Cliente</label>

        <input
            type="text"
            id="cliente"
        >

        <label>Teléfono</label>

        <input
            type="tel"
            id="telefono"
        >

        <button onclick="agregarVehiculo()">
            💾 Guardar vehículo
        </button>

        <button
            class="boton-secundario"
            onclick="volverInicio()"
        >
            ← Volver al inicio
        </button>

    </div>


    <!-- =================================================
         EDITAR VEHÍCULO
    ================================================== -->

    <div id="editarVehiculo" class="tarjeta oculto">

        <h2>✏️ Editar vehículo</h2>

        <label>Patente</label>

        <input
            type="text"
            id="editarPatente"
            disabled
        >

        <label>Marca</label>

        <input
            type="text"
            id="editarMarca"
        >

        <label>Modelo</label>

        <input
            type="text"
            id="editarModelo"
        >

        <label>Año</label>

        <input
            type="number"
            id="editarAnio"
        >

        <label>Kilometraje</label>

        <input
            type="number"
            id="editarKilometraje"
        >

        <label>Cliente</label>

        <input
            type="text"
            id="editarCliente"
        >

        <label>Teléfono</label>

        <input
            type="tel"
            id="editarTelefono"
        >

        <button
            class="boton-guardar-edicion"
            onclick="guardarEdicionVehiculo()"
        >
            💾 Guardar cambios
        </button>

        <button
            class="boton-secundario"
            onclick="cancelarEdicionVehiculo()"
        >
            ← Cancelar
        </button>

    </div>


    <!-- =================================================
         NUEVA INTERVENCIÓN
    ================================================== -->

    <div id="nuevaIntervencion" class="tarjeta oculto">

        <h2>🛠️ Nueva intervención</h2>

        <label>Patente</label>

        <input
            type="text"
            id="patenteIntervencion"
            placeholder="Ej: AB123CD"
        >

        <label>Fecha de ingreso</label>

        <input
            type="date"
            id="fecha"
        >

        <label>Tipo de trabajo</label>

        <select id="tipo">

            <option value="">
                Seleccionar tipo
            </option>

            <option value="Service">
                🔧 Service
            </option>

            <option value="Reparación">
                🛠️ Reparación
            </option>

            <option value="Diagnóstico">
                🔎 Diagnóstico
            </option>

            <option value="Otro">
                📋 Otro
            </option>

        </select>

        <label>Kilometraje</label>

        <input
            type="number"
            id="kmIntervencion"
        >

        <label>Motivo de ingreso</label>

        <textarea
            id="motivo"
            placeholder="¿Por qué ingresó el vehículo?"
        ></textarea>

        <label>Trabajo realizado</label>

        <textarea
            id="trabajo"
            placeholder="Detalle del trabajo realizado"
        ></textarea>

        <label>Repuestos</label>

        <textarea
            id="repuestos"
            placeholder="Repuestos utilizados"
        ></textarea>

        <label>Observaciones</label>

        <textarea
            id="observaciones"
            placeholder="Observaciones"
        ></textarea>

        <label>📷 Fotos de la intervención</label>

        <input
            type="file"
            id="fotos"
            accept="image/*"
            multiple
            style="display:none;"
            onchange="seleccionarFotos()"
        >

        <button
            type="button"
            class="boton-agregar-fotos"
            onclick="document.getElementById('fotos').click()"
        >
            📷 Agregar fotos
        </button>

        <small>
            Podés agregar varias fotos. Antes de guardar
            podés eliminar las que no quieras.
        </small>

        <div
            id="vistaPreviaFotos"
            class="vista-previa-fotos"
        ></div>

        <button onclick="agregarIntervencion()">
            💾 Guardar intervención
        </button>

        <button
            class="boton-secundario"
            onclick="volverInicio()"
        >
            ← Volver al inicio
        </button>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://sljknzpyxmpfnkcaoksu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_3oidhuHVin61bwlZBTW41w_fuF_rqPI";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   VARIABLES
========================================================= */

let vehiculos = [];

let historialActual = [];

let fotosSeleccionadas = [];

let patenteVehiculoEditando = "";

let vehiculoEditandoId = null;


/* =========================================================
   INICIO
========================================================= */

window.addEventListener(
    "load",
    verificarSesion
);


/* =========================================================
   VERIFICAR SESIÓN
========================================================= */

async function verificarSesion(){

    try{

        const resultado =
            await supabaseClient.auth.getSession();

        if(
            resultado.data &&
            resultado.data.session
        ){

            await mostrarSistema();

        }else{

            mostrarLogin();

        }

    }catch(error){

        console.error(
            "ERROR VERIFICANDO SESIÓN:",
            error
        );

        mostrarLogin();

    }
}


/* =========================================================
   MOSTRAR LOGIN
========================================================= */

function mostrarLogin(){

    document
        .getElementById("pantallaLogin")
        .classList.remove("oculto");

    document
        .getElementById("sistema")
        .classList.add("oculto");
}


/* =========================================================
   MOSTRAR SISTEMA
========================================================= */

async function mostrarSistema(){

    document
        .getElementById("pantallaLogin")
        .classList.add("oculto");

    document
        .getElementById("sistema")
        .classList.remove("oculto");

    await cargarVehiculosDesdeSupabase();

}


/* =========================================================
   INICIAR SESIÓN
========================================================= */

async function iniciarSesion(){

    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;

    const mensaje =
        document.getElementById(
            "mensajeLogin"
        );

    mensaje.innerHTML = "";

    if(!email){

        mensaje.innerHTML =
            '<div class="mensaje-error">Ingresá tu correo electrónico.</div>';

        return;
    }

    if(!password){

        mensaje.innerHTML =
            '<div class="mensaje-error">Ingresá tu contraseña.</div>';

        return;
    }

    try{

        const resultado =
            await supabaseClient.auth
                .signInWithPassword({

                    email:email,

                    password:password

                });

        if(resultado.error){

            console.error(
                resultado.error
            );

            mensaje.innerHTML =
                '<div class="mensaje-error">Correo o contraseña incorrectos.</div>';

            return;
        }

        document
            .getElementById("loginPassword")
            .value = "";

        await mostrarSistema();

    }catch(error){

        console.error(
            error
        );

        mensaje.innerHTML =
            '<div class="mensaje-error">No se pudo iniciar sesión.</div>';

    }
}


/* =========================================================
   CERRAR SESIÓN
========================================================= */

async function cerrarSesion(){

    try{

        await supabaseClient.auth.signOut();

    }catch(error){

        console.error(
            error
        );

    }

    vehiculos = [];

    historialActual = [];

    mostrarLogin();

}


/* =========================================================
   OBTENER USUARIO
========================================================= */

async function obtenerUsuario(){

    const resultado =
        await supabaseClient.auth.getUser();

    if(
        resultado.error ||
        !resultado.data ||
        !resultado.data.user
    ){

        return null;
    }

    return resultado.data.user;
}


/* =========================================================
   CARGAR TODOS LOS VEHÍCULOS DESDE SUPABASE
========================================================= */

async function cargarVehiculosDesdeSupabase(){

    const usuario =
        await obtenerUsuario();

    if(!usuario){

        mostrarLogin();

        return;
    }

    try{

        const resultado =
            await supabaseClient
                .from("vehiculos")
                .select("*")
                .eq("user_id",usuario.id)
                .order("patente",{ascending:true});

        if(resultado.error){

            console.error(
                "ERROR CARGANDO VEHÍCULOS:",
                resultado.error
            );

            alert(
                "No se pudieron cargar los vehículos desde la base de datos.\n\n" +
                resultado.error.message
            );

            vehiculos = [];

            return;
        }

        vehiculos =
            Array.isArray(resultado.data)
                ? resultado.data
                : [];

        console.log(
            "VEHÍCULOS CARGADOS:",
            vehiculos
        );

    }catch(error){

        console.error(
            "ERROR:",
            error
        );

        alert(
            "Ocurrió un error al cargar los vehículos."
        );

        vehiculos = [];
    }
}


/* =========================================================
   NAVEGACIÓN
========================================================= */

function mostrarSeccion(seccion){

    document
        .getElementById("menuPrincipal")
        .classList.add("oculto");

    document
        .getElementById("buscar")
        .classList.add("oculto");

    document
        .getElementById("nuevoVehiculo")
        .classList.add("oculto");

    document
        .getElementById("editarVehiculo")
        .classList.add("oculto");

    document
        .getElementById("nuevaIntervencion")
        .classList.add("oculto");

    document
        .getElementById(seccion)
        .classList.remove("oculto");

}


/* =========================================================
   VOLVER AL INICIO
========================================================= */

function volverInicio(){

    document
        .getElementById("buscar")
        .classList.add("oculto");

    document
        .getElementById("nuevoVehiculo")
        .classList.add("oculto");

    document
        .getElementById("editarVehiculo")
        .classList.add("oculto");

    document
        .getElementById("nuevaIntervencion")
        .classList.add("oculto");

    document
        .getElementById("menuPrincipal")
        .classList.remove("oculto");

    document
        .getElementById("resultadoBusqueda")
        .innerHTML = "";

    historialActual = [];

    patenteVehiculoEditando = "";

    vehiculoEditandoId = null;
}


/* =========================================================
   AGREGAR VEHÍCULO
========================================================= */

async function agregarVehiculo(){

    const patente =
        document
            .getElementById("patente")
            .value
            .trim()
            .toUpperCase();

    const marca =
        document
            .getElementById("marca")
            .value
            .trim();

    const modelo =
        document
            .getElementById("modelo")
            .value
            .trim();

    const anio =
        document
            .getElementById("anio")
            .value
            .trim();

    const kilometraje =
        document
            .getElementById("kilometraje")
            .value
            .trim();

    const cliente =
        document
            .getElementById("cliente")
            .value
            .trim();

    const telefono =
        document
            .getElementById("telefono")
            .value
            .trim();


    if(!patente){

        alert(
            "Ingresá la patente."
        );

        return;
    }


    const usuario =
        await obtenerUsuario();

    if(!usuario){

        alert(
            "La sesión no está disponible. Volvé a iniciar sesión."
        );

        return;
    }


    try{

        /* =============================================
           VERIFICAR SI YA EXISTE EN SUPABASE
        ============================================== */

        const existente =
            await supabaseClient
                .from("vehiculos")
                .select("id,patente")
                .eq("user_id",usuario.id)
                .eq("patente",patente)
                .maybeSingle();


        if(existente.error){

            console.error(
                existente.error
            );

            alert(
                "No se pudo verificar si el vehículo ya existe."
            );

            return;
        }


        if(existente.data){

            alert(
                "Ese vehículo ya está registrado."
            );

            return;
        }


        /* =============================================
           INSERTAR VEHÍCULO
        ============================================== */

        const resultado =
            await supabaseClient
                .from("vehiculos")
                .insert({

                    user_id:usuario.id,

                    patente:patente,

                    marca:marca,

                    modelo:modelo,

                    anio:anio,

                    kilometraje:kilometraje,

                    cliente:cliente,

                    telefono:telefono

                })
                .select()
                .single();


        if(resultado.error){

            console.error(
                "ERROR SUPABASE:",
                resultado.error
            );

            alert(
                "No se pudo guardar el vehículo.\n\n" +
                resultado.error.message
            );

            return;
        }


        /* =============================================
           ACTUALIZAR MEMORIA DE LA PÁGINA
        ============================================== */

        vehiculos.push(
            resultado.data
        );


        alert(
            "Vehículo guardado correctamente."
        );


        limpiarFormularioVehiculo();


        volverInicio();


    }catch(error){

        console.error(
            "ERROR:",
            error
        );

        alert(
            "Ocurrió un error al guardar el vehículo."
        );

    }
}


/* =========================================================
   LIMPIAR FORMULARIO VEHÍCULO
========================================================= */

function limpiarFormularioVehiculo(){

    document.getElementById(
        "patente"
    ).value = "";

    document.getElementById(
        "marca"
    ).value = "";

    document.getElementById(
        "modelo"
    ).value = "";

    document.getElementById(
        "anio"
    ).value = "";

    document.getElementById(
        "kilometraje"
    ).value = "";

    document.getElementById(
        "cliente"
    ).value = "";

    document.getElementById(
        "telefono"
    ).value = "";
}


/* =========================================================
   EDITAR VEHÍCULO
========================================================= */

function abrirEdicionVehiculo(){

    const vehiculo =
        vehiculos.find(
            v =>
                v.id ===
                vehiculoEditandoId
        );


    if(!vehiculo){

        alert(
            "No se encontró el vehículo."
        );

        return;
    }


    document.getElementById(
        "editarPatente"
    ).value =
        vehiculo.patente || "";


    document.getElementById(
        "editarMarca"
    ).value =
        vehiculo.marca || "";


    document.getElementById(
        "editarModelo"
    ).value =
        vehiculo.modelo || "";


    document.getElementById(
        "editarAnio"
    ).value =
        vehiculo.anio || "";


    document.getElementById(
        "editarKilometraje"
    ).value =
        vehiculo.kilometraje || "";


    document.getElementById(
        "editarCliente"
    ).value =
        vehiculo.cliente || "";


    document.getElementById(
        "editarTelefono"
    ).value =
        vehiculo.telefono || "";


    mostrarSeccion(
        "editarVehiculo"
    );
}


/* =========================================================
   GUARDAR EDICIÓN
========================================================= */

async function guardarEdicionVehiculo(){

    const usuario =
        await obtenerUsuario();


    if(!usuario){

        alert(
            "La sesión no está disponible. Volvé a iniciar sesión."
        );

        return;
    }


    const vehiculo =
        vehiculos.find(
            v =>
                v.id ===
                vehiculoEditandoId
        );


    if(!vehiculo){

        alert(
            "No se encontró el vehículo."
        );

        return;
    }


    const marca =
        document
            .getElementById("editarMarca")
            .value
            .trim();

    const modelo =
        document
            .getElementById("editarModelo")
            .value
            .trim();

    const anio =
        document
            .getElementById("editarAnio")
            .value
            .trim();

    const kilometraje =
        document
            .getElementById("editarKilometraje")
            .value
            .trim();

    const cliente =
        document
            .getElementById("editarCliente")
            .value
            .trim();

    const telefono =
        document

async function agregarIntervencion(){

        document
            .getElementById("patenteIntervencion")

            .trim()
            .toUpperCase();

    const fecha =
        document
            .getElementById("fecha")
            .value;

        document

            .value;

    const km =
        document
            .getElementById("kmIntervencion")
            .value
            .trim();

    const motivo =
        document
            .getElementById("motivo")
            .value
            .trim();

    const trabajo =
        document
            .getElementById("trabajo")
            .value
            .trim();

    const repuestos =
        document
            .getElementById("repuestos")
            .value
            .trim();

    const observaciones =
        document
            .getElementById("observaciones")
            .value
            .trim();


    if(!patente){

        alert(
            "Ingresá la patente."
        );

        return;
    }


    if(!fecha){

        alert(
            "Ingresá la fecha."
        );

        return;
    }


    if(!tipo){

        alert(
            "Seleccioná el tipo de trabajo."
        );

        return;
    }


    const usuario =
        await obtenerUsuario();


    if(!usuario){

        alert(
            "La sesión no está disponible. Volvé a iniciar sesión."
        );

        return;
    }


    try{

        /* =============================================
           BUSCAR VEHÍCULO
        ============================================== */

        const resultadoVehiculo =
            await supabaseClient
                .from("vehiculos")
                .select("*")
                .eq("patente",patente)
                .eq("user_id",usuario.id)
                .maybeSingle();


        if(resultadoVehiculo.error){

            console.error(
                "ERROR BUSCANDO VEHÍCULO:",
                resultadoVehiculo.error
            );

            alert(
                "No se pudo buscar el vehículo."
            );

            return;
        }


        if(!resultadoVehiculo.data){

            alert(
                "No se encontró ese vehículo en la base de datos.\n\n" +
                "Primero tenés que registrarlo desde 'Nuevo vehículo'."
            );

            return;
        }


        const vehiculoSupabase =
            resultadoVehiculo.data;


        /* =============================================
           PROCESAR FOTOS
        ============================================== */

        let fotos = [];


        try{

            fotos =
                await procesarFotos();

        }catch(error){

            console.error(
                "ERROR PROCESANDO FOTOS:",
                error
            );

            alert(
                "Hubo un problema al procesar las fotos."
            );

            return;
        }


        /* =============================================
           DESCRIPCIÓN
        ============================================== */

        const descripcion =
            JSON.stringify({

                kilometraje:km,

                motivo:motivo,

                trabajo:trabajo,

                repuestos:repuestos,

                observaciones:observaciones

            });


        /* =============================================
           INSERTAR INTERVENCIÓN
        ============================================== */

        const resultadoIntervencion =
            await supabaseClient
                .from("intervenciones")
                .insert({

                    user_id:
                        usuario.id,

                    vehiculo_id:
                        vehiculoSupabase.id,

                    fecha:
                        fecha,

                    tipo:
                        tipo,

                    descripcion:
                        descripcion,

                    fotos:
                        fotos

                })
                .select()
                .single();


        if(resultadoIntervencion.error){

            console.error(
                "ERROR SUPABASE INTERVENCIÓN:",
                resultadoIntervencion.error
            );

            alert(
                "No se pudo guardar la intervención.\n\n" +
                resultadoIntervencion.error.message
            );

            return;
        }


        /* =============================================
           ACTUALIZAR KILOMETRAJE DEL VEHÍCULO
           SI SE INGRESÓ UNO
        ============================================== */

        if(km){

            const actualizacionVehiculo =
                await supabaseClient
                    .from("vehiculos")
                    .update({

                        kilometraje:km

                    })
                    .eq(
                        "id",
                        vehiculoSupabase.id
                    )
                    .eq(
                        "user_id",
                        usuario.id
                    );


            if(actualizacionVehiculo.error){

                console.error(
                    "ERROR ACTUALIZANDO KILOMETRAJE:",
                    actualizacionVehiculo.error
                );

            }else{

                vehiculoSupabase.kilometraje =
                    km;
            }
        }


        /* =============================================
           ACTUALIZAR VEHÍCULO EN MEMORIA
        ============================================== */

        const indiceVehiculo =
            vehiculos.findIndex(
                v =>
                    v.id ===
                    vehiculoSupabase.id
            );


        if(indiceVehiculo >= 0){

            vehiculos[indiceVehiculo] =
                vehiculoSupabase;

        }else{

            vehiculos.push(
                vehiculoSupabase
            );
        }


        /* =============================================
           FINALIZAR
        ============================================== */

        alert(
            "Intervención guardada correctamente."
        );


        limpiarFormularioIntervencion();


        volverInicio();


    }catch(error){

        console.error(
            "ERROR GENERAL:",
            error
        );

        alert(
            "Ocurrió un error al guardar la intervención."
        );
    }
}


/* =========================================================
   FOTOS
========================================================= */

function procesarFotos(){

    return Promise.all(

        fotosSeleccionadas.map(
            archivo =>
                comprimirImagen(
                    archivo
                )
        )

    );
}


function comprimirImagen(archivo){

    return new Promise(
        (resolve,reject) => {

            const lector =
                new FileReader();


            lector.onload =
                function(e){

                    const imagen =
                        new Image();


                    imagen.onload =
                        function(){

                            const maximo =
                                1200;

                            let ancho =
                                imagen.width;

                            let alto =
                                imagen.height;


                            if(
                                ancho > maximo ||
                                alto > maximo
                            ){

                                if(
                                    ancho > alto
                                ){

                                    alto =
                                        alto *
                                        (
                                            maximo /
                                            ancho
                                        );

                                    ancho =
                                        maximo;

                                }else{

                                    ancho =
                                        ancho *
                                        (
                                            maximo /
                                            alto
                                        );

                                    alto =
                                        maximo;
                                }
                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                ancho;

                            canvas.height =
                                alto;


                            const contexto =
                                canvas.getContext(
                                    "2d"
                                );


                            contexto.drawImage(
                                imagen,
                                0,
                                0,
                                ancho,
                                alto
                            );


                            resolve(
                                canvas.toDataURL(
                                    "image/jpeg",
                                    0.70
                                )
                            );

                        };


                    imagen.onerror =
                        reject;


                    imagen.src =
                        e.target.result;

                };


            lector.onerror =
                reject;


            lector.readAsDataURL(
                archivo
            );

        }
    );
}


/* =========================================================
   SELECCIONAR FOTOS
========================================================= */

function seleccionarFotos(){

    const input =
        document.getElementById(
            "fotos"
        );


    const archivos =
        Array.from(
            input.files
        );


    fotosSeleccionadas =
        fotosSeleccionadas.concat(
            archivos
        );


    mostrarVistaPreviaFotos();


    input.value = "";

}


/* =========================================================
   VISTA PREVIA DE FOTOS
========================================================= */

function mostrarVistaPreviaFotos(){

    const contenedor =
        document.getElementById(
            "vistaPreviaFotos"
        );


    contenedor.innerHTML = "";


    fotosSeleccionadas.forEach(
        (archivo,indice) => {

            const lector =
                new FileReader();


            lector.onload =
                function(e){

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "foto-preview";


                    const img =
                        document.createElement(
                            "img"
                        );


                    img.src =
                        e.target.result;


                    const boton =
                        document.createElement(
                            "button"
                        );


                    boton.type =
                        "button";


                    boton.className =
                        "boton-eliminar-foto";


                    boton.innerHTML =
                        "🗑️";


                    boton.onclick =
                        function(){

                            eliminarFoto(
                                indice
                            );

                        };


                    div.appendChild(
                        img
                    );


                    div.appendChild(
                        boton
                    );


                    contenedor.appendChild(
                        div
                    );

                };


            lector.readAsDataURL(
                archivo
            );

        }
    );
}


/* =========================================================
   ELIMINAR FOTO ANTES DE GUARDAR
========================================================= */

function eliminarFoto(indice){

    fotosSeleccionadas.splice(
        indice,
        1
    );

    mostrarVistaPreviaFotos();

}
