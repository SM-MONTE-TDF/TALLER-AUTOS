<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Taller Mecánico</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    color: #222;
}

.contenedor {
    max-width: 800px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

h2 {
    margin-top: 0;
}

.tarjeta {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: #222;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #444;
}

.boton-secundario {
    background: #777;
}

.boton-cerrar {
    background: #a00000;
}

.boton-editar {
    background: #555;
    margin-top: 15px;
}

.boton-guardar-edicion {
    background: #222;
}

input,
select,
textarea {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

label {
    font-weight: bold;
}

.oculto {
    display: none !important;
}

.info-vehiculo {
    background: #f5f5f5;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 15px;
}

.historial-fechas {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 15px;
}

.boton-fecha {
    width: 100%;
    margin: 0;
    padding: 13px 15px;
    background: #333;
    text-align: left;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.boton-fecha:hover {
    background: #555;
}

.fecha-ingreso {
    font-weight: bold;
}

.tipo-ingreso {
    font-size: 14px;
    background: #666;
    padding: 6px 10px;
    border-radius: 15px;
    white-space: nowrap;
}

.detalle-intervencion {
    background: #f7f7f7;
    padding: 15px;
    border-radius: 8px;
    margin-top: 15px;
}

.detalle-intervencion p {
    line-height: 1.5;
}

.fotos-guardadas {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
}

.fotos-guardadas img {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 8px;
    cursor: pointer;
}

.boton-agregar-fotos {
    background: #333;
    margin-bottom: 5px;
}

.vista-previa-fotos {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 15px;
}

.foto-preview {
    position: relative;
    width: 110px;
    height: 110px;
}

.foto-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
}

.boton-eliminar-foto {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 28px;
    height: 28px;
    padding: 0;
    margin: 0;
    border-radius: 50%;
    background: #d00;
    color: white;
    font-size: 16px;
}

.mensaje {
    padding: 15px;
    background: #fff3cd;
    border-radius: 8px;
    margin-top: 15px;
}

.mensaje-error {
    padding: 15px;
    background: #f8d7da;
    color: #842029;
    border-radius: 8px;
    margin-top: 15px;
}

small {
    display: block;
    color: #666;
    margin-bottom: 10px;
}
</style>
</head>

<body>

<div id="pantallaLogin" class="contenedor">

    <div class="tarjeta">

        <h1>🔧 Taller Mecánico</h1>

        <h2>🔐 Iniciar sesión</h2>

        <label>Correo electrónico</label>

        <input
            type="email"
            id="loginEmail"
            placeholder="Tu correo electrónico"
        >

        <label>Contraseña</label>

        <input
            type="password"
            id="loginPassword"
            placeholder="Tu contraseña"
        >

        <button onclick="iniciarSesion()">
            🔐 Ingresar
        </button>

        <div id="mensajeLogin"></div>

    </div>

</div>


<div id="sistema" class="contenedor oculto">

    <h1>🔧 Taller Mecánico</h1>

    <div id="menuPrincipal" class="tarjeta">

        <button onclick="mostrarSeccion('buscar')">
            🔎 Buscar vehículo
        </button>

        <button onclick="mostrarSeccion('nuevoVehiculo')">
            🚗 Nuevo vehículo
        </button>

        <button onclick="mostrarSeccion('nuevaIntervencion')">
            🛠️ Nueva intervención
        </button>

        <button
            class="boton-cerrar"
            onclick="cerrarSesion()"
        >
            🔒 Cerrar sesión
        </button>

    </div>


    <div id="buscar" class="tarjeta oculto">

        <h2>🔎 Buscar vehículo</h2>

        <label>Patente</label>

        <input
            type="text"
            id="patenteBuscar"
            placeholder="Ej: AB123CD"
        >

        <button onclick="buscarVehiculo()">
            Buscar
        </button>

        <div id="resultadoBusqueda"></div>

        <button
            class="boton-secundario"
            onclick="volverInicio()"
        >
            ← Volver al inicio
        </button>

    </div>


    <div id="nuevoVehiculo" class="tarjeta oculto">

        <h2>🚗 Nuevo vehículo</h2>

        <label>Patente</label>

        <input
            type="text"
            id="patente"
            placeholder="Ej: AB123CD"
        >

        <label>Marca</label>

        <input type="text" id="marca">

        <label>Modelo</label>

        <input type="text" id="modelo">

        <label>Año</label>

        <input type="number" id="anio">

        <label>Kilometraje</label>

        <input type="number" id="kilometraje">

        <label>Cliente</label>

        <input type="text" id="cliente">

        <label>Teléfono</label>

        <input type="tel" id="telefono">

        <button onclick="agregarVehiculo()">
            Guardar vehículo
        </button>

        <button
            class="boton-secundario"
            onclick="volverInicio()"
        >
            ← Volver al inicio
        </button>

    </div>


    <div id="editarVehiculo" class="tarjeta oculto">

        <h2>✏️ Editar vehículo</h2>

        <label>Patente</label>

        <input
            type="text"
            id="editarPatente"
            disabled
        >

        <label>Marca</label>

        <input type="text" id="editarMarca">

        <label>Modelo</label>

        <input type="text" id="editarModelo">

        <label>Año</label>

        <input type="number" id="editarAnio">

        <label>Kilometraje</label>

        <input type="number" id="editarKilometraje">

        <label>Cliente</label>

        <input type="text" id="editarCliente">

        <label>Teléfono</label>

        <input type="tel" id="editarTelefono">

        <button
            class="boton-guardar-edicion"
            onclick="guardarEdicionVehiculo()"
        >
            💾 Guardar cambios
        </button>

        <button
            class="boton-secundario"
            onclick="cancelarEdicionVehiculo()"
        >
            ← Cancelar
        </button>

    </div>


    <div id="nuevaIntervencion" class="tarjeta oculto">

        <h2>🛠️ Nueva intervención</h2>

        <label>Patente</label>

        <input
            type="text"
            id="patenteIntervencion"
            placeholder="Ej: AB123CD"
        >

        <label>Fecha de ingreso</label>

        <input type="date" id="fecha">

        <label>Tipo de trabajo</label>

        <select id="tipo">

            <option value="">
                Seleccionar tipo
            </option>

            <option value="Service">
                🔧 Service
            </option>

            <option value="Reparación">
                🛠️ Reparación
            </option>

            <option value="Diagnóstico">
                🔎 Diagnóstico
            </option>

            <option value="Otro">
                📋 Otro
            </option>

        </select>

        <label>Kilometraje</label>

        <input
            type="number"
            id="kmIntervencion"
        >

        <label>Motivo de ingreso</label>

        <textarea
            id="motivo"
            placeholder="¿Por qué ingresó el vehículo?"
        ></textarea>

        <label>Trabajo realizado</label>

        <textarea
            id="trabajo"
            placeholder="Detalle del trabajo realizado"
        ></textarea>

        <label>Repuestos</label>

        <textarea
            id="repuestos"
            placeholder="Repuestos utilizados"
        ></textarea>

        <label>Observaciones</label>

        <textarea
            id="observaciones"
            placeholder="Observaciones"
        ></textarea>

        <label>📷 Fotos de la intervención</label>

        <input
            type="file"
            id="fotos"
            accept="image/*"
            multiple
            style="display:none;"
            onchange="seleccionarFotos()"
        >

        <button
            type="button"
            class="boton-agregar-fotos"
            onclick="document.getElementById('fotos').click()"
        >
            📷 Agregar fotos
        </button>

        <small>
            Podés agregar varias fotos. Antes de guardar podés eliminar
            las que no quieras.
        </small>

        <div
            id="vistaPreviaFotos"
            class="vista-previa-fotos"
        ></div>

        <button onclick="agregarIntervencion()">
            💾 Guardar intervención
        </button>

        <button
            class="boton-secundario"
            onclick="volverInicio()"
        >
            ← Volver al inicio
        </button>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://sljknzpyxmpfnkcaoksu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_3oidhuHVin61bwlZBTW41w_fuF_rqPI";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   VARIABLES
========================================================= */

let vehiculos = [];
let historialActual = [];
let fotosSeleccionadas = [];
let patenteVehiculoEditando = "";


/* =========================================================
   INICIO
========================================================= */

window.addEventListener(
    "load",
    verificarSesion
);


/* =========================================================
   VERIFICAR SESIÓN
========================================================= */

async function verificarSesion() {

    try {

        const resultado =
            await supabaseClient.auth.getSession();

        if (
            resultado.data &&
            resultado.data.session
        ) {

            await mostrarSistema();

        } else {

            mostrarLogin();
        }

    } catch (error) {

        console.error(error);

        mostrarLogin();
    }
}


/* =========================================================
   LOGIN
========================================================= */

function mostrarLogin() {

    document
        .getElementById("pantallaLogin")
        .classList.remove("oculto");

    document
        .getElementById("sistema")
        .classList.add("oculto");
}


async function mostrarSistema() {

    document
        .getElementById("pantallaLogin")
        .classList.add("oculto");

    document
        .getElementById("sistema")
        .classList.remove("oculto");

    await cargarDatos();
}


async function iniciarSesion() {

    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;

    const mensaje =
        document.getElementById(
            "mensajeLogin"
        );

    mensaje.innerHTML = "";

    if (!email) {

        mensaje.innerHTML =
            '<div class="mensaje-error">' +
            'Ingresá tu correo electrónico.' +
            '</div>';

        return;
    }

    if (!password) {

        mensaje.innerHTML =
            '<div class="mensaje-error">' +
            'Ingresá tu contraseña.' +
            '</div>';

        return;
    }

    try {

        const resultado =
            await supabaseClient.auth
                .signInWithPassword({
                    email: email,
                    password: password
                });

        if (resultado.error) {

            console.error(
                resultado.error
            );

            mensaje.innerHTML =
                '<div class="mensaje-error">' +
                'Correo o contraseña incorrectos.' +
                '</div>';

            return;
        }

        document
            .getElementById(
                "loginPassword"
            )
            .value = "";

        await mostrarSistema();

    } catch (error) {

        console.error(error);

        mensaje.innerHTML =
            '<div class="mensaje-error">' +
            'No se pudo iniciar sesión.' +
            '</div>';
    }
}


async function cerrarSesion() {

    try {

        await supabaseClient.auth.signOut();

    } catch (error) {

        console.error(error);
    }

    mostrarLogin();
}


/* =========================================================
   CARGAR DATOS DESDE SUPABASE
========================================================= */

async function cargarDatos() {

    try {

        const resultado =
            await supabaseClient
                .from("vehiculos")
                .select("*")
                .order("created_at", {
                    ascending: true
                });

        if (resultado.error) {

            console.error(
                resultado.error
            );

            alert(
                "No se pudieron cargar los vehículos desde Supabase."
            );

            vehiculos = [];

            return;
        }

        vehiculos =
            resultado.data || [];

        for (
            const vehiculo of vehiculos
        ) {

            vehiculo.historial = [];

            const resultadoIntervenciones =
                await supabaseClient
                    .from("intervenciones")
                    .select("*")
                    .eq(
                        "vehiculo_id",
                        vehiculo.id
                    )
                    .order("fecha", {
                        ascending: false
                    });

            if (
                resultadoIntervenciones.error
            ) {

                console.error(
                    resultadoIntervenciones.error
                );

                continue;
            }

            vehiculo.historial =
                (
                    resultadoIntervenciones.data ||
                    []
                ).map(
                    convertirIntervencion
                );
        }

        guardarDatosLocal();

    } catch (error) {

        console.error(error);

        alert(
            "No se pudieron cargar los datos."
        );

        vehiculos = [];
    }
}


/* =========================================================
   CONVERTIR INTERVENCIÓN DE SUPABASE
========================================================= */

function convertirIntervencion(
    intervencion
) {

    let datos = {};

    try {

        if (
            intervencion.descripcion
        ) {

            datos =
                JSON.parse(
                    intervencion.descripcion
                );
        }

    } catch (error) {

        datos = {
            trabajo:
                intervencion.descripcion
        };
    }

    return {

        id:
            intervencion.id,

        fecha:
            intervencion.fecha,

        tipo:
            intervencion.tipo,

        kilometraje:
            datos.kilometraje || "",

        motivo:
            datos.motivo || "",

        trabajo:
            datos.trabajo || "",

        repuestos:
            datos.repuestos || "",

        observaciones:
            datos.observaciones || "",

        fotos:
            Array.isArray(
                intervencion.fotos
            )
                ? intervencion.fotos
                : []

    };
}


/* =========================================================
   COPIA LOCAL
========================================================= */

function guardarDatosLocal() {

    try {

        localStorage.setItem(
            "vehiculos",
            JSON.stringify(
                vehiculos
            )
        );

    } catch (error) {

        console.error(error);
    }
}


/* =========================================================
   NAVEGACIÓN
========================================================= */

function mostrarSeccion(
    seccion
) {

    document
        .getElementById("menuPrincipal")
        .classList.add("oculto");

    document
        .getElementById("buscar")
        .classList.add("oculto");

    document
        .getElementById("nuevoVehiculo")
        .classList.add("oculto");

    document
        .getElementById("editarVehiculo")
        .classList.add("oculto");

    document
        .getElementById("nuevaIntervencion")
        .classList.add("oculto");

    document
        .getElementById(seccion)
        .classList.remove("oculto");
}


function volverInicio() {

    document
        .getElementById("buscar")
        .classList.add("oculto");

    document
        .getElementById("nuevoVehiculo")
        .classList.add("oculto");

    document
        .getElementById("editarVehiculo")
        .classList.add("oculto");

    document
        .getElementById("nuevaIntervencion")
        .classList.add("oculto");

    document
        .getElementById("menuPrincipal")
        .classList.remove("oculto");

    document
        .getElementById("resultadoBusqueda")
        .innerHTML = "";

    historialActual = [];
}


/* =========================================================
   AGREGAR VEHÍCULO
========================================================= */

async function agregarVehiculo() {

    const patente =
        document
            .getElementById("patente")
            .value
            .trim()
            .toUpperCase();

    const marca =
        document
            .getElementById("marca")
            .value
            .trim();

    const modelo =
        document
            .getElementById("modelo")
            .value
            .trim();

    const anio =
        document
            .getElementById("anio")
            .value
            .trim();

    const kilometraje =
        document
            .getElementById("kilometraje")
            .value
            .trim();

    const cliente =
        document
            .getElementById("cliente")
            .value
            .trim();

    const telefono =
        document
            .getElementById("telefono")
            .value
            .trim();

    if (!patente) {

        alert(
            "Ingresá la patente."
        );

        return;
    }

    const existente =
        vehiculos.find(
            v =>
                v.patente ===
                patente
        );

    if (existente) {

        alert(
            "Ese vehículo ya está registrado."
        );

        return;
    }

    try {

        const resultado =
            await supabaseClient
                .from("vehiculos")
                .insert({

                    patente:
                        patente,

                    marca:
                        marca,

                    modelo:
                        modelo,

                    anio:
                        anio,

                    kilometraje:
                        kilometraje,

                    cliente:
                        cliente,

                    telefono:
                        telefono

                })
                .select()
                .single();

        if (resultado.error) {

            console.error(
                resultado.error
            );

            alert(
                "No se pudo guardar el vehículo: " +
                resultado.error.message
            );

            return;
        }

        const nuevoVehiculo =
            resultado.data;

        nuevoVehiculo.historial =
            [];

        vehiculos.push(
            nuevoVehiculo
        );

        guardarDatosLocal();

        alert(
            "Vehículo guardado correctamente."
        );

        limpiarFormularioVehiculo();

        volverInicio();

    } catch (error) {

        console.error(error);

        alert(
            "Ocurrió un error al guardar el vehículo."
        );
    }
}


function limpiarFormularioVehiculo() {

    document.getElementById(
        "patente"
    ).value = "";

    document.getElementById(
        "marca"
    ).value = "";

    document.getElementById(
        "modelo"
    ).value = "";

    document.getElementById(
        "anio"
    ).value = "";

    document.getElementById(
        "kilometraje"
    ).value = "";

    document.getElementById(
        "cliente"
    ).value = "";

    document.getElementById(
        "telefono"
    ).value = "";
}


/* =========================================================
   EDITAR VEHÍCULO
========================================================= */

function abrirEdicionVehiculo() {

    const vehiculo =
        vehiculos.find(
            v =>
                v.patente ===
                patenteVehiculoEditando
        );

    if (!vehiculo) {

        alert(
            "No se encontró el vehículo."
        );

        return;
    }

    document.getElementById(
        "editarPatente"
    ).value =
        vehiculo.patente || "";

    document.getElementById(
        "editarMarca"
    ).value =
        vehiculo.marca || "";

    document.getElementById(
        "editarModelo"
    ).value =
        vehiculo.modelo || "";

    document.getElementById(
        "editarAnio"
    ).value =
        vehiculo.anio || "";

    document.getElementById(
        "editarKilometraje"
    ).value =
        vehiculo.kilometraje || "";

    document.getElementById(
        "editarCliente"
    ).value =
        vehiculo.cliente || "";

    document.getElementById(
        "editarTelefono"
    ).value =
        vehiculo.telefono || "";

    mostrarSeccion(
        "editarVehiculo"
    );
}


async function guardarEdicionVehiculo() {

    const vehiculo =
        vehiculos.find(
            v =>
                v.patente ===
                patenteVehiculoEditando
        );

    if (!vehiculo) {

        alert(
            "No se encontró el vehículo."
        );

        return;
    }

    const marca =
        document
            .getElementById(
                "editarMarca"
            )
            .value
            .trim();

    const modelo =
        document
            .getElementById(
                "editarModelo"
            )
            .value
            .trim();

    const anio =
        document
            .getElementById(
                "editarAnio"
            )
            .value
            .trim();

    const kilometraje =
        document
            .getElementById(
                "editarKilometraje"
            )
            .value
            .trim();

    const cliente =
        document
            .getElementById(
                "editarCliente"
            )
            .value
            .trim();

    const telefono =
        document
            .getElementById(
                "editarTelefono"
            )
            .value
            .trim();

    try {

        const resultado =
            await supabaseClient
                .from("vehiculos")
                .update({

                    marca:
                        marca,

                    modelo:
                        modelo,

                    anio:
                        anio,

                    kilometraje:
                        kilometraje,

                    cliente:
                        cliente,

                    telefono:
                        telefono

                })
                .eq(
                    "id",
                    vehiculo.id
                );

        if (resultado.error) {

            console.error(
                resultado.error
            );

            alert(
                "No se pudieron guardar los cambios: " +
                resultado.error.message
            );

            return;
        }

        vehiculo.marca =
            marca;

        vehiculo.modelo =
            modelo;

        vehiculo.anio =
            anio;

        vehiculo.kilometraje =
            kilometraje;

        vehiculo.cliente =
            cliente;

        vehiculo.telefono =
            telefono;

        guardarDatosLocal();

        alert(
            "Datos del vehículo actualizados correctamente."
        );

        volverInicio();

    } catch (error) {

        console.error(error);

        alert(
            "Ocurrió un error al actualizar el vehículo."
        );
    }
}

/* =========================================================
   AGREGAR INTERVENCIÓN
========================================================= */

async function agregarIntervencion() {

    const patente =
        document
            .getElementById(
                "patenteIntervencion"
            )
            .value
            .trim()
            .toUpperCase();

    const fecha =
        document
            .getElementById("fecha")
            .value;

    const tipo =
        document
            .getElementById("tipo")
            .value;

    const km =
        document
            .getElementById(
                "kmIntervencion"
            )
            .value
            .trim();

    const motivo =
        document
            .getElementById("motivo")
            .value
            .trim();

    const trabajo =
        document
            .getElementById("trabajo")
            .value
            .trim();

    const repuestos =
        document
            .getElementById("repuestos")
            .value
            .trim();

    const observaciones =
        document
            .getElementById("observaciones")
            .value
            .trim();

    if (!patente) {

        alert(
            "Ingresá la patente."
        );

        return;
    }

    if (!fecha) {

        alert(
            "Ingresá la fecha."
        );

        return;
    }

    if (!tipo) {

        alert(
            "Seleccioná el tipo de trabajo."
        );

        return;
    }

    const vehiculo =
        vehiculos.find(
            v =>
                v.patente ===
                patente
        );

    if (!vehiculo) {

        alert(
            "No existe un vehículo con esa patente."
        );

        return;
    }

    let fotos = [];

    try {

        fotos =
            await procesarFotos();

    } catch (error) {

        console.error(error);

        alert(
            "Hubo un problema al procesar las fotos."
        );

        return;
    }

    const datosIntervencion = {

        kilometraje:
            km,

        motivo:
            motivo,

        trabajo:
            trabajo,

        repuestos:
            repuestos,

        observaciones:
            observaciones
    };

    try {

        const resultado =
            await supabaseClient
                .from("intervenciones")
                .insert({

                    user_id:
                        (
                            await supabaseClient
                                .auth
                                .getUser()
                        ).data.user.id,

                    vehiculo_id:
                        vehiculo.id,

                    fecha:
                        fecha,

                    tipo:
                        tipo,

                    descripcion:
                        JSON.stringify(
                            datosIntervencion
                        ),

                    fotos:
                        fotos

                })
                .select()
                .single();

        if (resultado.error) {

            console.error(
                resultado.error
            );

            alert(
                "No se pudo guardar la intervención: " +
                resultado.error.message
            );

            return;
        }

        const nuevaIntervencion =
            convertirIntervencion(
                resultado.data
            );

        vehiculo.historial =
            Array.isArray(
                vehiculo.historial
            )
                ? vehiculo.historial
                : [];

        vehiculo.historial.push(
            nuevaIntervencion
        );

        guardarDatosLocal();

        alert(
            "Intervención guardada correctamente."
        );

        limpiarFormularioIntervencion();

        volverInicio();

    } catch (error) {

        console.error(error);

        alert(
            "Ocurrió un error al guardar la intervención."
        );
    }
}


/* =========================================================
   FOTOS
========================================================= */

function procesarFotos() {

    return Promise.all(
        fotosSeleccionadas.map(
            archivo =>
                comprimirImagen(
                    archivo
                )
        )
    );
}


function comprimirImagen(
    archivo
) {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const lector =
                new FileReader();

            lector.onload =
                function(e) {

                    const imagen =
                        new Image();

                    imagen.onload =
                        function() {

                            const maximo =
                                1200;

                            let ancho =
                                imagen.width;

                            let alto =
                                imagen.height;

                            if (
                                ancho > maximo ||
                                alto > maximo
                            ) {

                                if (
                                    ancho > alto
                                ) {

                                    alto =
                                        alto *
                                        (
                                            maximo /
                                            ancho
                                        );

                                    ancho =
                                        maximo;

                                } else {

                                    ancho =
                                        ancho *
                                        (
                                            maximo /
                                            alto
                                        );

                                    alto =
                                        maximo;
                                }
                            }

                            const canvas =
                                document.createElement(
                                    "canvas"
                                );

                            canvas.width =
                                ancho;

                            canvas.height =
                                alto;

                            const contexto =
                                canvas.getContext(
                                    "2d"
                                );

                            contexto.drawImage(
                                imagen,
                                0,
                                0,
                                ancho,
                                alto
                            );

                            resolve(
                                canvas.toDataURL(
                                    "image/jpeg",
                                    0.70
                                )
                            );
                        };

                    imagen.onerror =
                        reject;

                    imagen.src =
                        e.target.result;
                };

            lector.onerror =
                reject;

            lector.readAsDataURL(
                archivo
            );
        }
    );
}


function seleccionarFotos() {

    const input =
        document.getElementById(
            "fotos"
        );

    const archivos =
        Array.from(
            input.files
        );

    fotosSeleccionadas =
        fotosSeleccionadas.concat(
            archivos
        );

    mostrarVistaPreviaFotos();

    input.value = "";
}


function mostrarVistaPreviaFotos() {

    const contenedor =
        document.getElementById(
            "vistaPreviaFotos"
        );

    contenedor.innerHTML = "";

    fotosSeleccionadas.forEach(
        (
            archivo,
            indice
        ) => {

            const lector =
                new FileReader();

            lector.onload =
                function(e) {

                    const div =
                        document.createElement(
                            "div"
                        );

                    div.className =
                        "foto-preview";

                    const img =
                        document.createElement(
                            "img"
                        );

                    img.src =
                        e.target.result;

                    const boton =
                        document.createElement(
                            "button"
                        );

                    boton.type =
                        "button";

                    boton.className =
                        "boton-eliminar-foto";

                    boton.innerHTML =
                        "🗑️";

                    boton.onclick =
                        function() {

                            eliminarFoto(
                                indice
                            );
                        };

                    div.appendChild(img);

                    div.appendChild(
                        boton
                    );

                    contenedor.appendChild(
                        div
                    );
                };

            lector.readAsDataURL(
                archivo
            );
        }
    );
}


function eliminarFoto(
    indice
) {

    fotosSeleccionadas.splice(
        indice,
        1
    );

    mostrarVistaPreviaFotos();
}

/* =========================================================
   ICONOS
========================================================= */

function obtenerIconoTipo(
    tipo
) {

    const texto =
        String(tipo)
            .toLowerCase();

    if (
        texto.includes("service")
    ) {

        return "🔧";
    }

    if (
        texto.includes("repar")
    ) {

        return "🛠️";
    }

    if (
        texto.includes("diagn")
    ) {

        return "🔎";
    }

    return "📋";
}
