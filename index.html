<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gestión Taller</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    .contenedor {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    h2 {
      margin-top: 0;
    }

    .seccion {
      display: none;
    }

    .seccion.activa {
      display: block;
    }

    .tarjeta {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .boton-secundario {
      background: #777;
    }

    .boton-agregar-fotos {
      background: #333;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    label {
      font-weight: bold;
    }

    small {
      display: block;
      color: #666;
      margin-bottom: 10px;
    }

    .info-vehiculo {
      background: #eee;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      line-height: 1.7;
    }

    .historial-fechas {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .boton-fecha {
      background: #333;
      margin: 0;
    }

    .detalle-intervencion {
      margin-top: 20px;
      padding: 18px;
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 10px;
      line-height: 1.7;
    }

    .detalle-intervencion strong {
      color: #222;
    }

    .kilometraje {
      background: #e9e9e9;
      padding: 12px;
      border-radius: 8px;
      margin: 10px 0;
    }

    .aviso {
      padding: 12px;
      background: #fff3cd;
      border: 1px solid #ffe69c;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .mensaje {
      padding: 12px;
      background: #e8f5e9;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .sin-resultados {
      padding: 15px;
      background: #f8d7da;
      border-radius: 8px;
      color: #842029;
    }

    /* FOTOS */

    .vista-previa-fotos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 15px;
      margin-bottom: 15px;
    }

    .previsualizacion-foto {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #ccc;
      background: #eee;
    }

    .previsualizacion-foto img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
    }

    .boton-eliminar-foto {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 45px !important;
      height: 45px !important;
      min-width: 45px;
      padding: 0 !important;
      margin: 0 !important;
      border-radius: 50%;
      background: #d00000 !important;
      color: white;
      border: none;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .galeria-fotos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .foto-historial {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid #ccc;
    }

    @media (max-width: 500px) {

      body {
        padding: 12px;
      }

      .historial-fechas,
      .galeria-fotos,
      .vista-previa-fotos {
        grid-template-columns: 1fr;
      }

      .previsualizacion-foto img {
        height: 220px;
      }

      .foto-historial {
        height: 220px;
      }
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>🔧 Gestión Taller</h1>


  <!-- ========================= -->
  <!-- MENÚ PRINCIPAL -->
  <!-- ========================= -->

  <div id="menuPrincipal" class="seccion activa">

    <div class="tarjeta">

      <h2>Menú principal</h2>

      <button onclick="mostrarSeccion('buscar')">
        🔎 Buscar vehículo
      </button>

      <button onclick="mostrarSeccion('nuevoVehiculo')">
        🚗 Nuevo vehículo
      </button>

      <button onclick="mostrarSeccion('nuevaIntervencion')">
        🛠️ Nueva intervención
      </button>

    </div>

  </div>


  <!-- ========================= -->
  <!-- BUSCAR VEHÍCULO -->
  <!-- ========================= -->

  <div id="buscar" class="seccion">

    <div class="tarjeta">

      <h2>🔎 Buscar vehículo</h2>

      <label>Patente</label>

      <input
        type="text"
        id="busquedaPatente"
        placeholder="Ej: AB123CD"
      >

      <label>Cliente</label>

      <input
        type="text"
        id="busquedaCliente"
        placeholder="Nombre del cliente"
      >

      <label>Teléfono</label>

      <input
        type="text"
        id="busquedaTelefono"
        placeholder="Teléfono"
      >

      <button onclick="buscarVehiculo()">
        🔎 Buscar
      </button>

      <button
        class="boton-secundario"
        onclick="volverInicio()"
      >
        ↩️ Volver
      </button>

      <div id="resultadoBusqueda"></div>

    </div>

  </div>


  <!-- ========================= -->
  <!-- NUEVO VEHÍCULO -->
  <!-- ========================= -->

  <div id="nuevoVehiculo" class="seccion">

    <div class="tarjeta">

      <h2>🚗 Nuevo vehículo</h2>

      <label>Patente</label>

      <input
        type="text"
        id="patente"
        placeholder="Ej: AB123CD"
      >

      <label>Marca</label>

      <input
        type="text"
        id="marca"
        placeholder="Ej: Toyota"
      >

      <label>Modelo</label>

      <input
        type="text"
        id="modelo"
        placeholder="Ej: Corolla"
      >

      <label>Año</label>

      <input
        type="number"
        id="anio"
        placeholder="Ej: 2020"
      >

      <label>Kilometraje</label>

      <input
        type="number"
        id="kilometraje"
        placeholder="Ej: 85000"
      >

      <label>Cliente</label>

      <input
        type="text"
        id="cliente"
        placeholder="Nombre y apellido"
      >

      <label>Teléfono</label>

      <input
        type="text"
        id="telefono"
        placeholder="Teléfono"
      >

      <button onclick="agregarVehiculo()">
        💾 Guardar vehículo
      </button>

      <button
        class="boton-secundario"
        onclick="volverInicio()"
      >
        ↩️ Volver
      </button>

    </div>

  </div>


  <!-- ========================= -->
  <!-- NUEVA INTERVENCIÓN -->
  <!-- ========================= -->

  <div id="nuevaIntervencion" class="seccion">

    <div class="tarjeta">

      <h2>🛠️ Nueva intervención</h2>

      <label>Patente</label>

      <input
        type="text"
        id="patenteIntervencion"
        placeholder="Ej: AB123CD"
      >

      <label>Fecha</label>

      <input
        type="date"
        id="fecha"
      >

      <label>Tipo de trabajo</label>

      <input
        type="text"
        id="tipo"
        placeholder="Ej: Cambio de aceite"
      >

      <label>Kilometraje</label>

      <input
        type="number"
        id="kmIntervencion"
        placeholder="Kilometraje actual"
      >

      <label>Motivo / problema informado</label>

      <textarea
        id="motivo"
        placeholder="Qué problema informó el cliente..."
      ></textarea>

      <label>Trabajo realizado</label>

      <textarea
        id="trabajo"
        placeholder="Qué se hizo en el vehículo..."
      ></textarea>

      <label>Repuestos utilizados</label>

      <textarea
        id="repuestos"
        placeholder="Repuestos, marcas, cantidades..."
      ></textarea>

      <label>Observaciones</label>

      <textarea
        id="observaciones"
        placeholder="Observaciones adicionales..."
      ></textarea>


      <!-- FOTOS -->

      <label>
        📷 Fotos de la intervención
      </label>

      <input
        type="file"
        id="fotos"
        accept="image/*"
        multiple
        style="display:none;"
        onchange="seleccionarFotos()"
      >

      <button
        type="button"
        class="boton-agregar-fotos"
        onclick="document.getElementById('fotos').click()"
      >
        📷 Agregar fotos
      </button>

      <small>
        Podés agregar varias fotos.
        Antes de guardar podés eliminar las que no quieras.
      </small>

      <div
        id="vistaPreviaFotos"
        class="vista-previa-fotos"
      ></div>


      <button onclick="agregarIntervencion()">
        💾 Guardar intervención
      </button>

      <button
        class="boton-secundario"
        onclick="volverInicio()"
      >
        ↩️ Volver
      </button>

    </div>

  </div>

</div>


<script>

  /* =====================================
     DATOS
  ===================================== */

  let vehiculos =
    JSON.parse(localStorage.getItem("vehiculos")) || [];

  let fotosSeleccionadas = [];

  let historialActual = [];


  /* =====================================
     GUARDAR DATOS
  ===================================== */

  function guardarDatos() {

    localStorage.setItem(
      "vehiculos",
      JSON.stringify(vehiculos)
    );

  }


  /* =====================================
     CAMBIAR SECCIÓN
  ===================================== */

  function mostrarSeccion(id) {

    document
      .querySelectorAll(".seccion")
      .forEach(seccion => {

        seccion.classList.remove("activa");

      });

    document
      .getElementById(id)
      .classList.add("activa");

  }


  /* =====================================
     VOLVER AL INICIO
  ===================================== */

  function volverInicio() {

    document
      .querySelectorAll(".seccion")
      .forEach(seccion => {

        seccion.classList.remove("activa");

      });

    document
      .getElementById("menuPrincipal")
      .classList.add("activa");

  }


  /* =====================================
     ESCAPAR HTML
  ===================================== */

  function escaparHTML(texto) {

    if (texto === undefined || texto === null) {
      return "";
    }

    return String(texto)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =====================================
     FORMATEAR FECHA
  ===================================== */

  function formatearFecha(fecha) {

    if (!fecha) {
      return "";
    }

    const partes = fecha.split("-");

    if (partes.length !== 3) {
      return fecha;
    }

    return partes[2] + "/" +
           partes[1] + "/" +
           partes[0];

  }


  /* =====================================
     COMPRESIÓN DE FOTOS
  ===================================== */

  function comprimirFoto(
    archivo,
    maxSize = 1200,
    calidad = 0.70
  ) {

    return new Promise((resolve, reject) => {

      const lector = new FileReader();

      lector.onload = function(e) {

        const imagen = new Image();

        imagen.onload = function() {

          let ancho = imagen.width;
          let alto = imagen.height;

          if (ancho > maxSize || alto > maxSize) {

            if (ancho > alto) {

              alto =
                Math.round(
                  alto * maxSize / ancho
                );

              ancho = maxSize;

            } else {

              ancho =
                Math.round(
                  ancho * maxSize / alto
                );

              alto = maxSize;

            }

          }

          const canvas =
            document.createElement("canvas");

          canvas.width = ancho;
          canvas.height = alto;

          const contexto =
            canvas.getContext("2d");

          contexto.drawImage(
            imagen,
            0,
            0,
            ancho,
            alto
          );

          const resultado =
            canvas.toDataURL(
              "image/jpeg",
              calidad
            );

          resolve(resultado);

        };

        imagen.onerror = reject;

        imagen.src = e.target.result;

      };

      lector.onerror = reject;

      lector.readAsDataURL(archivo);

    });

  }


  /* =====================================
     SELECCIONAR FOTOS
  ===================================== */

  function seleccionarFotos() {

    const input =
      document.getElementById("fotos");

    const archivos =
      Array.from(input.files);

    archivos.forEach(archivo => {

      const yaExiste =
        fotosSeleccionadas.some(
          foto =>
            foto.name === archivo.name &&
            foto.size === archivo.size
        );

      if (!yaExiste) {

        fotosSeleccionadas.push(archivo);

      }

    });

    mostrarVistaPreviaFotos();

    /*
      Limpiamos el input para poder volver
      a seleccionar el mismo archivo si hace falta.
    */

    input.value = "";

  }


  /* =====================================
     MOSTRAR PREVISUALIZACIÓN
  ===================================== */

  function mostrarVistaPreviaFotos() {

    const contenedor =
      document.getElementById(
        "vistaPreviaFotos"
      );

    contenedor.innerHTML = "";

    fotosSeleccionadas.forEach(
      (archivo, indice) => {

        const lector =
          new FileReader();

        lector.onload = function(e) {

          const div =
            document.createElement("div");

          div.className =
            "previsualizacion-foto";

          div.innerHTML = `

            <img
              src="${e.target.result}"
              alt="Vista previa"
            >

            <button
              type="button"
              class="boton-eliminar-foto"
              onclick="eliminarFotoSeleccionada(${indice})"
              title="Eliminar foto"
            >
              🗑️
            </button>

          `;

          contenedor.appendChild(div);

        };

        lector.readAsDataURL(archivo);

      }
    );

  }


  /* =====================================
     ELIMINAR FOTO ANTES DE GUARDAR
  ===================================== */

  function eliminarFotoSeleccionada(indice) {

    fotosSeleccionadas.splice(
      indice,
      1
    );

    mostrarVistaPreviaFotos();

  }


  /* =====================================
     AGREGAR VEHÍCULO
  ===================================== */

  function agregarVehiculo() {

    const patente =
      document
        .getElementById("patente")
        .value
        .trim()
        .toUpperCase();

    const marca =
      document
        .getElementById("marca")
        .value
        .trim();

    const modelo =
      document
        .getElementById("modelo")
        .value
        .trim();

    const anio =
      document
        .getElementById("anio")
        .value
        .trim();

    const kilometraje =
      document
        .getElementById("kilometraje")
        .value
        .trim();

    const cliente =
      document
        .getElementById("cliente")
        .value
        .trim();

    const telefono =
      document
        .getElementById("telefono")
        .value
        .trim();


    if (!patente) {

      alert("Ingresá la patente.");

      return;

    }


    /*
      Evitamos crear dos vehículos
      con la misma patente.
    */

    const existente =
      vehiculos.find(
        vehiculo =>
          vehiculo.patente.toUpperCase() === patente
      );


    if (existente) {

      alert(
        "Ya existe un vehículo registrado con esa patente."
      );

      return;

    }


    const nuevoVehiculo = {

      patente: patente,

      marca: marca,

      modelo: modelo,

      anio: anio,

      kilometraje: kilometraje,

      cliente: cliente,

      telefono: telefono,

      intervenciones: []

    };


    vehiculos.push(
      nuevoVehiculo
    );


    guardarDatos();


    alert(
      "Vehículo guardado correctamente."
    );


    document
      .getElementById("patente")
      .value = "";

    document
      .getElementById("marca")
      .value = "";

    document
      .getElementById("modelo")
      .value = "";

    document
      .getElementById("anio")
      .value = "";

    document
      .getElementById("kilometraje")
      .value = "";

    document
      .getElementById("cliente")
      .value = "";

    document
      .getElementById("telefono")
      .value = "";


    volverInicio();

  }


  /* =====================================
     AGREGAR INTERVENCIÓN
  ===================================== */

  async function agregarIntervencion() {

    const patente =
      document
        .getElementById("patenteIntervencion")
        .value
        .trim()
        .toUpperCase();

    const fecha =
      document
        .getElementById("fecha")
        .value;

    const tipo =
      document
        .getElementById("tipo")
        .value
        .trim();

    const km =
      document
        .getElementById("kmIntervencion")
        .value
        .trim();

    const motivo =
      document
        .getElementById("motivo")
        .value
        .trim();

    const trabajo =
      document
        .getElementById("trabajo")
        .value
        .trim();

    const repuestos =
      document
        .getElementById("repuestos")
        .value
        .trim();

    const observaciones =
      document
        .getElementById("observaciones")
        .value
        .trim();


    if (!patente) {

      alert("Ingresá la patente.");

      return;

    }


    if (!fecha) {

      alert("Ingresá la fecha.");

      return;

    }


    const vehiculo =
      vehiculos.find(
        v =>
          v.patente.toUpperCase() === patente
      );


    if (!vehiculo) {

      alert(
        "No existe un vehículo con esa patente. Primero tenés que registrarlo."
      );

      return;

    }


    /*
      Calculamos el kilometraje anterior
      utilizando las intervenciones existentes.
    */

    let kilometrajeAnterior =
      vehiculo.kilometraje || "";


    if (
      vehiculo.intervenciones &&
      vehiculo.intervenciones.length > 0
    ) {

      const intervencionesOrdenadas =
        [...vehiculo.intervenciones]
          .sort(
            (a, b) =>
              new Date(a.fecha) -
              new Date(b.fecha)
          );


      const ultima =
        intervencionesOrdenadas[
          intervencionesOrdenadas.length - 1
        ];


      if (ultima.km) {

        kilometrajeAnterior =
          ultima.km;

      }

    }


    /*
      Procesamos las fotos.
    */

    const fotos = [];


    try {

      for (
        const archivo of fotosSeleccionadas
      ) {

        const fotoComprimida =
          await comprimirFoto(
            archivo
          );

        fotos.push(
          fotoComprimida
        );

      }

    } catch (error) {

      alert(
        "Hubo un problema al procesar una de las fotos."
      );

      return;

    }


    const nuevaIntervencion = {

      fecha: fecha,

      tipo: tipo,

      km: km,

      kilometrajeAnterior:
        kilometrajeAnterior,

      motivo: motivo,

      trabajo: trabajo,

      repuestos: repuestos,

      observaciones: observaciones,

      fotos: fotos

    };


    if (!vehiculo.intervenciones) {

      vehiculo.intervenciones = [];

    }


    vehiculo.intervenciones.push(
      nuevaIntervencion
    );


    /*
      Actualizamos el kilometraje actual
      del vehículo.
    */

    if (km) {

      vehiculo.kilometraje = km;

    }


    try {

      guardarDatos();

    } catch (error) {

      /*
        Si localStorage se queda sin espacio,
        deshacemos la intervención recién agregada.
      */

      vehiculo.intervenciones.pop();

      alert(
        "No hay suficiente espacio disponible para guardar las fotos. Probá con menos fotos."
      );

      return;

    }


    alert(
      "Intervención guardada correctamente."
    );


    /*
      Limpiamos el formulario.
    */

    document
      .getElementById("patenteIntervencion")
      .value = "";

    document
      .getElementById("fecha")
      .value = "";

    document
      .getElementById("tipo")
      .value = "";

    document
      .getElementById("kmIntervencion")
      .value = "";

    document
      .getElementById("motivo")
      .value = "";

    document
      .getElementById("trabajo")
      .value = "";

    document
      .getElementById("repuestos")
      .value = "";

    document
      .getElementById("observaciones")
      .value = "";


    fotosSeleccionadas = [];

    mostrarVistaPreviaFotos();


    volverInicio();

  }


  /* =====================================
     MOSTRAR INTERVENCIÓN
  ===================================== */

  function mostrarIntervencion(indice) {

    const contenedor =
      document.getElementById(
        "detalleIntervencion"
      );


    const intervencion =
      historialActual[indice];


    if (!intervencion) {

      return;

    }


    let html = `

      <div class="detalle-intervencion">

        <h3>
          🛠️ ${escaparHTML(
            intervencion.tipo || "Intervención"
          )}
        </h3>

        <p>
          <strong>📅 Fecha:</strong>
          ${formatearFecha(intervencion.fecha)}
        </p>

    `;


    if (intervencion.km) {

      html += `

        <div class="kilometraje">

          <strong>🛣️ Kilometraje:</strong><br>

          ${
            intervencion.kilometrajeAnterior
              ? "Anterior: " +
                escaparHTML(
                  intervencion.kilometrajeAnterior
                ) +
                " km<br>"
              : ""
          }

          Actual:
          ${escaparHTML(intervencion.km)}
          km

        </div>

      `;

    }


    if (intervencion.motivo) {

      html += `

        <p>
          <strong>📋 Motivo / problema:</strong><br>
          ${escaparHTML(intervencion.motivo)}
        </p>

      `;

    }


    if (intervencion.trabajo) {

      html += `

        <p>
          <strong>🔧 Trabajo realizado:</strong><br>
          ${escaparHTML(intervencion.trabajo)}
        </p>

      `;

    }


    if (intervencion.repuestos) {

      html += `

        <p>
          <strong>🔩 Repuestos:</strong><br>
          ${escaparHTML(intervencion.repuestos)}
        </p>

      `;

    }


    if (intervencion.observaciones) {

      html += `

        <p>
          <strong>📝 Observaciones:</strong><br>
          ${escaparHTML(intervencion.observaciones)}
        </p>

      `;

    }


    /*
      FOTOS
    */

    if (
      intervencion.fotos &&
      intervencion.fotos.length > 0
    ) {

      html += `

        <p>
          <strong>📷 Fotos:</strong>
        </p>

        <div class="galeria-fotos">

      `;


      intervencion.fotos.forEach(
        (foto, fotoIndice) => {

          html += `

            <img
              class="foto-historial"
              src="${foto}"
              alt="Foto de la intervención"
              onclick="abrirFoto(historialActual[${indice}].fotos[${fotoIndice}])"
            >

          `;

        }
      );


      html += `

        </div>

      `;

    } else {

      html += `

        <p>
          <strong>📷 Fotos:</strong>
          No hay fotos cargadas en esta intervención.
        </p>

      `;

    }


    html += `

      </div>

    `;


    contenedor.innerHTML =
      html;

  }


  /* =====================================
     ABRIR FOTO
  ===================================== */

  function abrirFoto(foto) {

    const ventana =
      window.open();

    if (!ventana) {

      alert(
        "El navegador bloqueó la apertura de la foto."
      );

      return;

    }


    ventana.document.write(`

      <html>

        <head>

          <title>Foto</title>

          <style>

            body {
              margin: 0;
              background: #000;
              display: flex;
              align-items: center;
              justify-content: center;
              min-height: 100vh;
            }

            img {
              max-width: 100%;
              max-height: 100vh;
              object-fit: contain;
            }

          </style>

        </head>

        <body>

          <img src="${foto}">

        </body>

      </html>

    `);

  }


  /* =====================================
     BUSCAR VEHÍCULO
  ===================================== */

  function buscarVehiculo() {

    const patente =
      document
        .getElementById("busquedaPatente")
        .value
        .trim()
        .toUpperCase();

    const cliente =
      document
        .getElementById("busquedaCliente")
        .value
        .trim()
        .toLowerCase();

    const telefono =
      document
        .getElementById("busquedaTelefono")
        .value
        .trim()
        .toLowerCase();


    const resultado =
      document.getElementById(
        "resultadoBusqueda"
      );


    /*
      Si no se ingresó ningún criterio.
    */

    if (
      !patente &&
      !cliente &&
      !telefono
    ) {

      resultado.innerHTML = `

        <div class="aviso">
          Ingresá una patente, cliente o teléfono para buscar.
        </div>

      `;

      return;

    }


    /*
      Buscamos coincidencias.
    */

    const encontrados =
      vehiculos.filter(vehiculo => {

        const coincidePatente =
          patente &&
          vehiculo.patente
            .toUpperCase()
            .includes(patente);

        const coincideCliente =
          cliente &&
          (vehiculo.cliente || "")
            .toLowerCase()
            .includes(cliente);

        const coincideTelefono =
          telefono &&
          (vehiculo.telefono || "")
            .toLowerCase()
            .includes(telefono);


        return (
          coincidePatente ||
          coincideCliente ||
          coincideTelefono
        );

      });


    if (encontrados.length === 0) {

      resultado.innerHTML = `

        <div class="sin-resultados">

          No se encontró ningún vehículo
          con esos datos.

        </div>

      `;

      return;

    }


    /*
      Mostramos los vehículos encontrados.
    */

    resultado.innerHTML =
      encontrados
        .map(
          vehiculo =>
            crearFichaVehiculo(
              vehiculo
            )
        )
        .join("");

  }


  /* =====================================
     CREAR FICHA VEHÍCULO
  ===================================== */

  function crearFichaVehiculo(
    vehiculo
  ) {

    const intervenciones =
      [...(
        vehiculo.intervenciones || []
      )]
      .sort(
        (a, b) =>
          new Date(b.fecha) -
          new Date(a.fecha)
      );


    let html = `

      <div class="tarjeta">

        <h2>
          🚗 ${escaparHTML(vehiculo.patente)}
        </h2>

        <div class="info-vehiculo">

          <strong>Marca:</strong>
          ${escaparHTML(vehiculo.marca)}
          <br>

          <strong>Modelo:</strong>
          ${escaparHTML(vehiculo.modelo)}
          <br>

          <strong>Año:</strong>
          ${escaparHTML(vehiculo.anio)}
          <br>

          <strong>Cliente:</strong>
          ${escaparHTML(vehiculo.cliente)}
          <br>

          <strong>Teléfono:</strong>
          ${escaparHTML(vehiculo.telefono)}
          <br>

          <strong>Kilometraje actual:</strong>
          ${escaparHTML(vehiculo.kilometraje)}
          km

        </div>

    `;


    /*
      Aviso si el vehículo tiene historial.
    */

    if (intervenciones.length > 0) {

      html += `

        <h3>
          📅 Historial de intervenciones
        </h3>

        <p>
          Seleccioná una fecha para ver
          el trabajo realizado.
        </p>

        <div class="historial-fechas">

      `;


      /*
        Guardamos temporalmente el historial
        para poder mostrar la intervención.
      */

      historialActual =
        intervenciones;


      intervenciones.forEach(
        (intervencion, indice) => {

          html += `

            <button
              class="boton-fecha"
              onclick="mostrarIntervencion(${indice})"
            >

              📅
              ${formatearFecha(
                intervencion.fecha
              )}

            </button>

          `;

        }
      );


      html += `

        </div>

        <div
          id="detalleIntervencion"
        ></div>

      `;

    } else {

      html += `

        <div class="aviso">

          Este vehículo todavía no tiene
          intervenciones registradas.

        </div>

      `;

    }


    html += `

      </div>

    `;


    return html;

  }


  /* =====================================
     FECHA DE HOY
  ===================================== */

  /*
    Ponemos automáticamente la fecha actual
    en el formulario de nueva intervención.
  */

  document
    .getElementById("fecha")
    .value =
      new Date()
        .toISOString()
        .split("T")[0];


</script>

</body>
</html>
