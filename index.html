<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SM MONTENEGRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff}
.hidden{display:none!important}
.wrap{max-width:480px;margin:0 auto;padding:14px 14px 90px}
.logo{width:100%;border-radius:14px;margin-bottom:18px;display:block}
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-weight:900;font-size:16px;margin:8px 0;cursor:pointer}
.btn-blue{background:#00c8ff;color:#000}
.btn-dark{background:#1a1a1a;color:#fff;border:1px solid #333}
.btn-red{background:#7a1f1f;color:#fff}
#login{position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:360px;text-align:center}
input,textarea,select{width:100%;padding:14px;margin:8px 0;background:#111;border:1px solid #333;border-radius:10px;color:#fff;font-size:15px}
.card{background:#111;border:1px solid #222;border-radius:12px;padding:14px;margin:10px 0;border-left:4px solid #00c8ff}
.patente{background:#fff;color:#000;font-weight:900;padding:4px 10px;border-radius:6px;display:inline-block}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.badge{background:#111;border:1px solid #222;padding:6px 10px;border-radius:20px;font-size:12px;color:#888}
label{color:#888;font-size:13px;margin-top:10px;display:block;text-align:left}
</style>
</head>
<body>

<div id="login">
<div class="box">
<img src="./ff2ace8e-276f-47cf-8eb8-9f8eedf27a89.jpeg" style="width:100%;border-radius:14px;margin-bottom:16px">
<h2 style="color:#00c8ff">SM MONTENEGRO</h2>
<p style="color:#888;margin:10px 0 20px">Acceso privado</p>
<input id="user" placeholder="Usuario" autocomplete="off" autocapitalize="off">
<input id="pass" type="password" placeholder="Contraseña" autocomplete="new-password">
<button class="btn btn-blue" onclick="doLogin()">Entrar</button>
<p id="errorLogin" style="color:#ff5555;font-size:13px;margin-top:10px;display:none">Usuario o contraseña incorrectos</p>
</div>
</div>

<div id="app" class="hidden">
<div class="wrap">
<div class="topbar">
<span class="badge" id="userBadge">👤</span>
<button onclick="show('ajustes')" style="background:#111;border:1px solid #333;color:#fff;padding:8px 12px;border-radius:10px">⚙️ Ajustes</button>
</div>
<img src="./ff2ace8e-276f-47cf-8eb8-9f8eedf27a89.jpeg" class="logo">
<button class="btn btn-blue" onclick="show('buscar')">🔍 Buscar</button>
<button class="btn btn-blue" onclick="show('nuevoV')">🚗 Nuevo vehículo</button>
<button class="btn btn-blue" onclick="show('nuevaI')">🛠️ Nueva intervención</button>
<button class="btn btn-blue" onclick="show('recuperar')">♻️ Papelera</button>
<button class="btn btn-red" onclick="cerrarSesion()">Cerrar sesión</button>
<hr style="border:0;border-top:1px solid #1e1e1e;margin:16px 0">

<div id="sec-buscar"><h2>Buscar <span id="cont" style="font-size:12px;color:#666"></span></h2><input id="q" placeholder="Patente, marca, cliente..." oninput="buscar()"><div id="r"></div></div>

<div id="sec-nuevoV" class="hidden"><h2>🚗 Nuevo vehículo</h2>
<input id="vPat" placeholder="PATENTE AB123CD" style="text-transform:uppercase"><input id="vMar" placeholder="Marca"><input id="vMod" placeholder="Modelo"><input id="vCli" placeholder="Cliente"><input id="vTel" placeholder="Tel"><input id="vKm" type="number" placeholder="KM actual"><button class="btn btn-blue" onclick="saveV()">💾 Guardar vehículo</button></div>

<div id="sec-nuevaI" class="hidden">
<h2>🛠️ Nueva intervención COMPLETA</h2>
<label>Patente *</label><input id="iPat" placeholder="AB123CD" style="text-transform:uppercase">
<label>Fecha *</label><input id="iFec" type="date">
<label>KM actual *</label><input id="iKm" type="number" placeholder="Ej: 85000">
<label>Trabajo realizado *</label><textarea id="iTra" placeholder="Ej: Cambio de aceite, filtros..."></textarea>
<label>Repuestos utilizados</label><textarea id="iRep" placeholder="Ej: Filtro aceite, 4L 10W40..."></textarea>
<label>Costo repuestos $</label><input id="iCostRep" type="number" placeholder="0" oninput="calcTotal()">
<label>Mano de obra $</label><input id="iCostMo" type="number" placeholder="0" oninput="calcTotal()">
<label style="color:#00c8ff">TOTAL $</label><input id="iTotal" type="number" placeholder="0" style="border-color:#00c8ff;font-weight:900">
<label>Próximo service KM</label><input id="iProxKm" type="number" placeholder="Ej: 95000">
<label>Próximo service Fecha</label><input id="iProxFec" type="date">
<label>Observaciones / Garantía</label><textarea id="iObs" placeholder="Garantía 3 meses..."></textarea>
<button class="btn btn-blue" onclick="saveI()">💾 Guardar intervención</button>
</div>

<div id="sec-recuperar" class="hidden"><h2>♻️ Papelera</h2><div id="rPap"></div></div>

<div id="sec-ajustes" class="hidden">
<h2>⚙️ Ajustes</h2>
<div class="card" style="border-left-color:#ffcc00">
<b>🔒 Cambiar acceso (Seguro)</b><br><br>
<label>Usuario actual: <span id="uActual" style="color:#fff"></span></label>
<input id="aUserNew" placeholder="Nuevo usuario" autocomplete="off">
<input id="aPassNew" type="password" placeholder="Nueva contraseña">
<input id="aPassConf" type="password" placeholder="Confirmar nueva contraseña">
<button class="btn btn-blue" onclick="cambiarCreds()">Guardar nuevo acceso</button>
<p style="color:#666;font-size:12px;margin-top:8px">La contraseña no se muestra por seguridad. Tenés que escribirla 2 veces.</p>
</div>
<div class="card" style="border-left-color:#25D366">
<b>💾 Backup</b><br><br>
<button class="btn btn-dark" onclick="exportar()">📤 Exportar backup</button>
<label class="btn btn-dark" style="text-align:center;display:block">📥 Importar backup<input type="file" id="fileIn" style="display:none" onchange="importar(event)"></label>
</div>
<button class="btn btn-dark" onclick="show('buscar')">⬅ Volver</button>
</div>
</div>
</div>

<script>
let vehiculos=JSON.parse(localStorage.getItem('sm_vehiculos')||'[]');
let intervenciones=JSON.parse(localStorage.getItem('sm_interv')||'[]');
let papelera=JSON.parse(localStorage.getItem('sm_papelera')||'[]');
function save(){localStorage.setItem('sm_vehiculos',JSON.stringify(vehiculos));localStorage.setItem('sm_interv',JSON.stringify(intervenciones));localStorage.setItem('sm_papelera',JSON.stringify(papelera))}
function doLogin(){
 let u=document.getElementById('user').value.trim();
 let p=document.getElementById('pass').value.trim();
 if(!u||!p){document.getElementById('errorLogin').style.display='block';document.getElementById('errorLogin').innerText='Tenés que poner usuario y contraseña';return}
 let su=localStorage.getItem('sm_user')||'admin';
 let sp=localStorage.getItem('sm_pass')||'1234';
 if(u===su && p===sp){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('userBadge').innerText='👤 '+su;
  document.getElementById('errorLogin').style.display='none';
  buscar();
 }else{
  document.getElementById('errorLogin').style.display='block';
  document.getElementById('errorLogin').innerText='Usuario o contraseña incorrectos';
 }
}
function cerrarSesion(){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');document.getElementById('user').value='';document.getElementById('pass').value='';}
function show(id){document.querySelectorAll('[id^=sec-]').forEach(e=>e.classList.add('hidden'));document.getElementById('sec-'+id).classList.remove('hidden');if(id=='buscar')buscar();if(id=='recuperar')renderPap();if(id=='ajustes'){document.getElementById('uActual').innerText=localStorage.getItem('sm_user')||'admin';document.getElementById('aUserNew').value='';document.getElementById('aPassNew').value='';document.getElementById('aPassConf').value='';}}
function cambiarCreds(){
 let nu=document.getElementById('aUserNew').value.trim();
 let np=document.getElementById('aPassNew').value.trim();
 let nc=document.getElementById('aPassConf').value.trim();
 if(!nu||!np)return alert('Completá usuario y contraseña nueva');
 if(np!==nc)return alert('Las contraseñas no coinciden');
 localStorage.setItem('sm_user',nu);localStorage.setItem('sm_pass',np);
 alert('✅ Nuevo acceso guardado\nUsuario: '+nu+'\nContraseña: '+np+'\n\nAhora entrá con esos datos');
 document.getElementById('userBadge').innerText='👤 '+nu;
}
function calcTotal(){let r=parseFloat(document.getElementById('iCostRep').value)||0;let m=parseFloat(document.getElementById('iCostMo').value)||0;document.getElementById('iTotal').value=r+m}
function buscar(){let q=(document.getElementById('q').value||'').toLowerCase();document.getElementById('cont').innerText='('+vehiculos.length+')';let f=q?vehiculos.filter(v=>(v.patente+v.marca+v.cliente).toLowerCase().includes(q)):vehiculos;document.getElementById('r').innerHTML=f.length?f.map(v=>'<div class=card onclick="ver(\''+v.patente+'\')"><span class=patente>'+v.patente+'</span> <b>'+(v.marca||'')+'</b><div style=color:#888>'+(v.cliente||'')+'</div></div>').join(''):'<p style=color:#555;text-align:center>Sin vehículos</p>'}
function ver(p){let v=vehiculos.find(x=>x.patente==p);let ins=intervenciones.filter(i=>i.patente==p);document.getElementById('r').innerHTML='<div class=card><span class=patente>'+v.patente+'</span><h3>'+(v.marca||'')+' '+(v.modelo||'')+'</h3><p>'+(v.cliente||'')+'</p><button class=btn style=background:#222;color:#fff;margin-top:10px onclick="document.getElementById(\'iPat\').value=\''+p+'\';show(\'nuevaI\')">+ Nueva intervención</button></div>'+ins.map(i=>'<div class=card style=border-left-color:#25D366><b>'+i.fecha+'</b> - '+i.km+'km<br><b>'+i.trabajo+'</b><br>Rep: '+(i.repuestos||'-')+'<br>Rep $'+(i.costRep||0)+' + MO $'+(i.costMo||0)+' = <b style=color:#25D366>$'+(i.total||0)+'</b><br>Prox: '+(i.proxKm||'-')+'km / '+(i.proxFec||'-')+'<br><i>'+(i.obs||'')+'</i></div>').join('')}
function saveV(){let p=document.getElementById('vPat').value.toUpperCase().trim();if(!p)return alert('Patente');let o={patente:p,marca:document.getElementById('vMar').value,modelo:document.getElementById('vMod').value,cliente:document.getElementById('vCli').value,tel:document.getElementById('vTel').value,km:document.getElementById('vKm').value};let ex=vehiculos.find(v=>v.patente==p);if(ex)Object.assign(ex,o);else vehiculos.unshift(o);save();show('buscar');buscar()}
function saveI(){let p=document.getElementById('iPat').value.toUpperCase().trim();let f=document.getElementById('iFec').value;let k=document.getElementById('iKm').value;let t=document.getElementById('iTra').value;if(!p||!f||!k||!t)return alert('Falta Patente, Fecha, KM y Trabajo (obligatorios)');intervenciones.unshift({patente:p,fecha:f,km:k,trabajo:t,repuestos:document.getElementById('iRep').value,costRep:document.getElementById('iCostRep').value,costMo:document.getElementById('iCostMo').value,total:document.getElementById('iTotal').value,proxKm:document.getElementById('iProxKm').value,proxFec:document.getElementById('iProxFec').value,obs:document.getElementById('iObs').value});save();alert('✅ Intervención guardada');show('buscar');document.getElementById('q').value=p;buscar()}
function renderPap(){document.getElementById('rPap').innerHTML=papelera.length?papelera.map(v=>'<div class=card><span class=patente>'+v.patente+'</span></div>').join(''):'<p style=color:#555>Vacía</p>'}
function exportar(){let blob=new Blob([JSON.stringify({vehiculos,intervenciones},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-SM.json';a.click()}
function importar(e){let f=e.target.files[0];let r=new FileReader();r.onload=function(ev){let d=JSON.parse(ev.target.result);vehiculos=d.vehiculos||[];intervenciones=d.intervenciones||[];save();buscar();alert('Importado')};r.readAsText(f)}
document.getElementById('iFec').valueAsDate=new Date();
</script>
</body>
</html>
